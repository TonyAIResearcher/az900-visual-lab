<script>/* js/m-redundancy.js */
/* Module 12 — Storage redundancy: LRS, ZRS, GRS, GZRS under failure */
(function () {
  'use strict';
  const { h } = AZ;
  // slot ids: p1a p1b p1c (zone 1 datacenter), p2a.., p3a.., sA sB sC (secondary region datacenter)
  const PLACE = {
    LRS: ['p1a', 'p1b', 'p1c'],
    ZRS: ['p1a', 'p2a', 'p3a'],
    GRS: ['p1a', 'p1b', 'p1c', 'sa', 'sb', 'sc'],
    GZRS: ['p1a', 'p2a', 'p3a', 'sa', 'sb', 'sc']
  };
  const DESC = {
    LRS: ['Locally redundant', 'Three copies inside one datacenter in the primary region. Cheapest. Survives a disk or server failure.'],
    ZRS: ['Zone-redundant', 'Three copies across three availability zones in the primary region. Survives losing a whole datacenter or zone.'],
    GRS: ['Geo-redundant', 'LRS in the primary region, plus an asynchronous copy to a secondary region (stored there as LRS).'],
    GZRS: ['Geo-zone-redundant', 'ZRS in the primary region, plus an asynchronous copy to a secondary region (stored there as LRS).']
  };
  const FAILS = {
    disk: { label: 'Fail disk', icon: 'storage', kills: ['p1a'], name: 'One disk in zone 1 failed' },
    dc: { label: 'Fail datacenter', icon: 'building', kills: ['p1a', 'p1b', 'p1c'], box: ['dc1'], name: 'The zone 1 datacenter went offline' },
    zone: { label: 'Fail availability zone', icon: 'layers', kills: ['p1a', 'p1b', 'p1c'], box: ['z1'], name: 'Availability zone 1 went offline' },
    region: { label: 'Fail region', icon: 'warn', kills: ['p1a', 'p1b', 'p1c', 'p2a', 'p2b', 'p2c', 'p3a', 'p3b', 'p3c'], box: ['prim'], name: 'The whole primary region went offline' }
  };
  const OPTS = ['LRS', 'ZRS', 'GRS', 'GZRS'];

  function outcome(opt, fail) {
    if (!fail) return 'ok';
    const alive = PLACE[opt].filter((sl) => !FAILS[fail].kills.includes(sl));
    const prim = alive.filter((sl) => sl[0] === 'p');
    if (prim.length) return 'ok';
    if (alive.length) return 'failover';
    return 'down';
  }

  function miniRed(opt) {
    const sp = { boxes: [], nodes: [], texts: [] };
    const geo = opt === 'GRS' || opt === 'GZRS';
    const pw = geo ? 100 : 148;
    sp.boxes.push({ x: 6, y: 8, w: pw, h: 84, label: 'Primary', cls: 'm-in' });
    const zw = (pw - 16) / 3;
    [0, 1, 2].forEach((i) => sp.boxes.push({ x: 12 + i * (zw + 2), y: 22, w: zw, h: 62, cls: 'm-off' }));
    const dots = [];
    if (opt === 'LRS' || opt === 'GRS') [0, 1, 2].forEach((k) => dots.push([12 + zw / 2, 36 + k * 16]));
    else [0, 1, 2].forEach((i) => dots.push([12 + i * (zw + 2) + zw / 2, 52]));
    if (geo) {
      sp.boxes.push({ x: 112, y: 8, w: 42, h: 84, label: '2nd', cls: 'm-in' });
      [0, 1, 2].forEach((k) => dots.push([133, 36 + k * 16]));
    }
    const sv = AZ.mini(sp);
    dots.forEach(([x, y]) => sv.append(AZ.s('circle', { cx: x, cy: y, r: 5, class: 'm-copy' })));
    return sv;
  }

  AZ.register({
    id: 'redundancy', num: 12, domain: 'arch', icon: 'storage',
    title: 'Storage redundancy', short: 'Storage redundancy',
    lede: 'Pick a redundancy option and see where Azure keeps copies of your data. Then break things — a disk, a datacenter, a zone, a region — and see which options keep the data.',
    objectives: ['a16'],
    memory: [
      { term: 'LRS', rule: '3 copies, 1 datacenter.', icon: 'building' },
      { term: 'ZRS', rule: '3 copies, 3 availability zones, 1 region.', icon: 'layers' },
      { term: 'GRS', rule: 'LRS + a copy in a second region.', icon: 'globe' },
      { term: 'GZRS', rule: 'ZRS + a copy in a second region.', icon: 'shield' }
    ],
    exams: [
      {
        id: 'red-x1', concept: 'red-zrs', pair: 'redundancy', short: 'Survive a zone, stay in one region → ZRS',
        prompt: 'Data must stay available if an entire availability zone fails. For data-residency reasons, it must not be copied outside the region.',
        answer: 'ZRS',
        why: 'ZRS keeps three copies across three availability zones in one region. It survives a zone outage and never replicates to another region.',
        choices: OPTS.map((o) => ({ id: o, label: o, art: () => miniRed(o), note: { LRS: 'All copies in one datacenter: a zone outage takes them all.', ZRS: 'Across zones, same region.', GRS: 'Copies data to a second region — not allowed here.', GZRS: 'Also copies to a second region.' }[o] }))
      },
      {
        id: 'red-x2', concept: 'red-lrs', pair: 'redundancy', short: 'Cheapest, disk-failure protection only → LRS',
        prompt: 'Test data can be recreated easily. You want the lowest-cost option that still protects against a single disk failure.',
        answer: 'LRS',
        why: 'LRS keeps three copies in one datacenter — the lowest-cost option, and enough to survive a disk or server failure.',
        choices: OPTS.map((o) => ({ id: o, label: o, art: () => miniRed(o), note: { LRS: 'Lowest cost, survives disk failure.', ZRS: 'Costs more for zone protection you don’t need.', GRS: 'Pays for a second region.', GZRS: 'The most protection and the highest cost.' }[o] }))
      }
    ],
    render(root, api) {
      let opt = 'LRS', fail = null;
      const tried = {};
      const why = AZ.whyBox();
      const slots = {};
      const slot = (id) => (slots[id] = h('div', { class: 'rd-disk', 'data-slot': id }, h('span', { class: 'rd-disk-l' }, 'disk')));
      const dc = (id, prefix, label) => h('div', { class: 'rd-dc', 'data-box': id },
        h('div', { class: 'rd-dc-h' }, AZ.icon('building'), h('span', null, label)),
        h('div', { class: 'rd-disks' }, slot(prefix + 'a'), slot(prefix + 'b'), slot(prefix + 'c')));
      const zones = [1, 2, 3].map((i) => h('div', { class: 'rd-zone', 'data-box': 'z' + i },
        h('div', { class: 'rd-zone-h' }, 'Zone ' + i), dc(i === 1 ? 'dc1' : 'dc' + i, 'p' + i, 'Datacenter')));
      const prim = h('div', { class: 'rd-region', 'data-box': 'prim' },
        h('div', { class: 'rd-region-h' }, h('span', { class: 'rd-k' }, 'Primary region'), h('span', null, 'East US 2')),
        h('div', { class: 'rd-zones' }, zones));
      const sec = h('div', { class: 'rd-region sec', 'data-box': 'sec' },
        h('div', { class: 'rd-region-h' }, h('span', { class: 'rd-k' }, 'Secondary region'), h('span', null, 'Central US (paired)')),
        h('div', { class: 'rd-zones one' }, h('div', { class: 'rd-zone plain' }, dc('dcs', 's', 'Datacenter'))));
      const repl = h('div', { class: 'rd-repl' }, h('span', { class: 'rd-repl-line' }), h('span', { class: 'rd-repl-t' }, 'asynchronous copy'));
      const banner = h('div', { class: 'rd-banner', 'aria-live': 'polite' });
      const copies = [0, 1, 2, 3, 4, 5].map((i) => h('span', { class: 'rd-copy', 'data-copy': i }, AZ.icon('file'), h('span', { class: 'sr' }, 'copy ' + (i + 1))));
      const table = h('table', { class: 'rd-table' },
        h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Option'), Object.keys(FAILS).map((k) => h('th', { scope: 'col' }, FAILS[k].label.replace('Fail ', ''))))),
        h('tbody', null, OPTS.map((o) => h('tr', { 'data-opt': o }, h('th', { scope: 'row' }, o), Object.keys(FAILS).map((k) => h('td', { 'data-fail': k }, h('span', { class: 'rd-cell q' }, '?')))))));

      const seg = AZ.seg({ label: 'Redundancy option', value: opt, cls: 'seg-lg', options: OPTS.map((o) => ({ id: o, label: o })), onChange: (v) => { opt = v; fail = null; draw(true); } });
      const fbtns = Object.keys(FAILS).map((k) => {
        const b = AZ.btn(FAILS[k].label, () => { fail = k; draw(false); record(); AZ.reveal(prim); }, { icon: FAILS[k].icon, cls: 'danger-ghost' });
        b.dataset.fail = k;
        return b;
      });
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Redundancy option'), seg),
          h('div', { class: 'rd-map' }, prim, repl, sec),
          banner),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Break something'), h('div', { class: 'btn-row' }, fbtns, AZ.btn('Restore', () => { fail = null; draw(false); }, { icon: 'reset', cls: 'ghost' }))),
          why,
          h('div', { class: 'rd-tablewrap after' }, h('div', { class: 'ctl-k' }, 'Results you have tested'), table))));

      function draw(moveCopies) {
        const before = copies.map((c) => c.getBoundingClientRect());
        const places = PLACE[opt];
        copies.forEach((c, i) => {
          if (i < places.length) { slots[places[i]].append(c); c.hidden = false; }
          else { c.hidden = true; root.append(c); }
          c.classList.toggle('lost', !!fail && FAILS[fail].kills.includes(places[i]));
        });
        if (moveCopies) copies.forEach((c, i) => { if (!c.hidden && before[i].width) AZ.flip(c, before[i], 600); else if (!c.hidden && !AZ.reduced) c.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 250 }); });
        const geo = opt === 'GRS' || opt === 'GZRS';
        sec.classList.toggle('inactive', !geo);
        repl.classList.toggle('on', geo);
        root.querySelectorAll('[data-box]').forEach((b) => b.classList.toggle('down', !!fail && (FAILS[fail].box || []).includes(b.dataset.box)));
        Object.values(slots).forEach((sl) => sl.classList.toggle('down', !!fail && FAILS[fail].kills.includes(sl.dataset.slot)));
        fbtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.fail === fail)));
        const out = outcome(opt, fail);
        if (!fail) {
          banner.className = 'rd-banner info';
          banner.replaceChildren(AZ.icon('file'), h('span', null, h('strong', null, opt + ' · ' + DESC[opt][0] + ': '), PLACE[opt].length + ' copies'));
          why.set(opt + ' · ' + DESC[opt][0], DESC[opt][1]);
        } else {
          const txt = { ok: ['Data available', 'Copies survive in the primary region.'], failover: ['Safe in the secondary region', 'Readable after failover. With RA-GRS or RA-GZRS you can read the secondary copy even before failover.'], down: ['Data unavailable', 'Every copy was inside the failed area. It may be lost.'] }[out];
          banner.className = 'rd-banner ' + (out === 'ok' ? 'ok' : out === 'failover' ? 'warn' : 'bad');
          banner.replaceChildren(AZ.icon(out === 'ok' ? 'check' : out === 'failover' ? 'warn' : 'x'), h('span', null, h('strong', null, txt[0] + '. '), FAILS[fail].name + '.'));
          why.set(opt + ' vs ' + FAILS[fail].label.replace('Fail ', '').toLowerCase() + ' failure', txt[1] + ' ' + explain(opt, fail), out === 'ok' ? 'ok' : out === 'failover' ? 'warn' : 'bad');
        }
      }
      function explain(o, f) {
        if (f === 'disk') return 'Every option keeps at least three copies, so a single disk never matters.';
        if (o === 'LRS') return 'LRS keeps all three copies in one datacenter, so anything bigger than a disk takes them all.';
        if (o === 'ZRS') return f === 'region' ? 'ZRS spreads copies across zones — but all zones are in the same region.' : 'The copies in zones 2 and 3 carry on.';
        if (o === 'GRS') return f === 'region' || f === 'dc' || f === 'zone' ? 'The primary copies were all in one datacenter. The secondary region still has the data.' : '';
        return f === 'region' ? 'Zones can’t survive a regional outage, but the secondary region can.' : 'The other zones keep serving.';
      }
      function record() {
        const out = outcome(opt, fail);
        const cell = table.querySelector(`tr[data-opt="${opt}"] td[data-fail="${fail}"] .rd-cell`);
        cell.className = 'rd-cell ' + out;
        cell.textContent = out === 'ok' ? 'Kept' : out === 'failover' ? 'Failover' : 'Lost';
        AZ.pop(cell, 'pop', 600);
        tried[opt + fail] = 1;
        if (Object.keys(tried).length >= 8) api.complete();
      }
      draw(false);
      why.set('Pick an option, then break things', 'Blue file icons are copies of the same data. Each failure button knocks out part of the map. The table fills in as you test.');
    }
  });
})();

</script>
<script>/* js/m-authz.js */
/* Module 14 — Authentication vs authorization */
(function () {
  'use strict';
  const { h } = AZ;
  const DOORS = [
    { id: 'read', label: 'Read', icon: 'eye', what: 'view the VM' },
    { id: 'create', label: 'Create', icon: 'plus', what: 'create a VM' },
    { id: 'delete', label: 'Delete', icon: 'trash', what: 'delete a VM' },
    { id: 'access', label: 'Grant access', icon: 'key', what: 'give others access' }
  ];
  const ROLES = {
    reader: { name: 'Reader', can: ['read'] },
    contributor: { name: 'Contributor', can: ['read', 'create', 'delete'] },
    owner: { name: 'Owner', can: ['read', 'create', 'delete', 'access'] }
  };

  function miniGate(kind) {
    if (kind === 'authn') return AZ.mini({ boxes: [{ x: 60, y: 14, w: 90, h: 72, label: 'inside', cls: 'm-in' }], nodes: [{ x: 22, y: 50, icon: 'user' }, { x: 60, y: 50, icon: 'key', cls: 'm-hl', r: 13 }], texts: [{ x: 60, y: 96, t: 'Who are you?' }] });
    if (kind === 'authz') return AZ.mini({ boxes: [{ x: 6, y: 14, w: 148, h: 72, label: 'inside', cls: 'm-in' }], nodes: [{ x: 36, y: 50, icon: 'user' }, { x: 84, y: 50, icon: 'unlock', cls: 'm-ok' }, { x: 124, y: 50, icon: 'lock', cls: 'm-bad' }], texts: [{ x: 80, y: 96, t: 'What can you do?' }] });
    if (kind === 'mfa') return AZ.mini({ nodes: [{ x: 40, y: 46, icon: 'key', label: 'password' }, { x: 120, y: 46, icon: 'phone', label: 'phone' }], texts: [{ x: 80, y: 50, t: '+' }] });
    return AZ.mini({ nodes: [{ x: 26, y: 50, icon: 'laptop' }, { x: 134, y: 50, icon: 'cloud' }], links: [{ a: 0, b: 1, cls: 'bad dash' }], marks: [{ x: 80, y: 50, icon: 'x', cls: 'm-bad' }] });
  }

  AZ.register({
    id: 'authn-authz', num: 14, domain: 'arch', icon: 'key',
    title: 'Authentication vs authorization', short: 'Authentication vs authorization',
    lede: 'Two different checks. The front gate asks who you are. The doors inside ask what you are allowed to do. Sign in, pick a role, then try every door.',
    objectives: ['a20', 'a24'],
    memory: [
      { term: 'Authentication', rule: '“Who are you?” — prove your identity.', icon: 'user' },
      { term: 'Authorization', rule: '“What can you do?” — decided after you are identified.', icon: 'unlock' },
      { term: 'Microsoft Entra ID', rule: 'Azure’s cloud identity service: it signs users in.', icon: 'shield' }
    ],
    exams: [
      {
        id: 'auth-x1', concept: 'auth-authz', pair: 'authn-authz', short: 'Signed in but denied → authorization',
        prompt: 'Dana signs in successfully, then gets “access denied” when she tries to delete a virtual machine. Which check stopped her?',
        answer: 'authz',
        why: 'She passed authentication — Azure knows who she is. The delete was stopped by authorization: her role doesn’t allow that action.',
        choices: [
          { id: 'authn', label: 'Authentication', art: () => miniGate('authn'), note: 'She got past this gate — she is signed in.' },
          { id: 'authz', label: 'Authorization', art: () => miniGate('authz'), note: 'Her role allows some actions, not delete.' },
          { id: 'mfa', label: 'Multifactor authentication', art: () => miniGate('mfa'), note: 'MFA is part of signing in, which already succeeded.' },
          { id: 'net', label: 'Network connectivity', art: () => miniGate('net'), note: 'A network failure wouldn’t return “access denied”.' }
        ]
      },
      {
        id: 'auth-x2', concept: 'auth-authn', pair: 'authn-authz', short: 'Proving identity → authentication',
        prompt: 'A user enters a password and approves a prompt on their phone before the Azure portal opens. What is happening?',
        answer: 'authn',
        why: 'Password plus phone approval proves who the user is: authentication (with MFA). What they can do comes afterwards.',
        choices: [
          { id: 'authn', label: 'Authentication', art: () => miniGate('authn'), note: 'Proving identity.' },
          { id: 'authz', label: 'Authorization', art: () => miniGate('authz'), note: 'Comes after sign-in: which actions are allowed.' },
          { id: 'net', label: 'Encryption in transit', art: () => miniGate('net'), note: 'Protects data on the wire; it doesn’t identify the user.' },
          { id: 'mfa', label: 'Role assignment', art: () => miniGate('authz'), note: 'Roles decide permissions, not identity.' }
        ]
      }
    ],
    render(root, api) {
      let who = 'dana', role = 'reader', signedIn = false, busy = false;
      const tried = new Set();
      const why = AZ.whyBox(['Two checks', 'Choose who signs in and which role they have, then press Sign in.']);
      const person = h('div', { class: 'az-person' }, AZ.icon('user'), h('span', { class: 'az-person-l' }, 'Dana'));
      const badge = h('div', { class: 'az-badge', hidden: true });
      const gate = h('div', { class: 'az-gate' },
        h('div', { class: 'az-gate-top' }, AZ.icon('shield'), h('span', null, 'Microsoft Entra ID')),
        h('div', { class: 'az-gate-door' }, h('span', { class: 'az-gate-state' }, 'Closed')));
      const doorEls = DOORS.map((d) => {
        const b = h('button', { type: 'button', class: 'az-door', disabled: true, 'data-door': d.id },
          h('span', { class: 'az-door-ic' }, AZ.icon(d.icon)), h('span', { class: 'az-door-l' }, d.label), h('span', { class: 'az-door-st' }, AZ.icon('lock'), h('span', null, 'Locked')));
        b.addEventListener('click', () => tryDoor(d, b));
        return b;
      });
      const outside = h('div', { class: 'az-out' }, h('span', { class: 'az-zone-k' }, 'Outside'), person);
      const hall = h('div', { class: 'az-hall' }, h('span', { class: 'az-zone-k' }, 'Inside: Azure subscription'), badge, h('div', { class: 'az-doors' }, doorEls));
      const building = h('div', { class: 'az-bld' },
        h('div', { class: 'az-band authn' }, h('span', { class: 'az-band-k' }, 'Authentication'), h('span', { class: 'az-band-q' }, 'Who are you?'), h('span', { class: 'az-band-s' }, 'identity verification')),
        h('div', { class: 'az-row' }, outside, gate),
        h('div', { class: 'az-band authz' }, h('span', { class: 'az-band-k' }, 'Authorization'), h('span', { class: 'az-band-q' }, 'What are you allowed to do?'), h('span', { class: 'az-band-s' }, 'allowed actions')),
        hall);
      const whoSeg = AZ.seg({ label: 'Who signs in', value: who, options: [{ id: 'dana', label: 'Dana · right password + MFA' }, { id: 'intruder', label: 'Someone with a wrong password' }], onChange: (v) => { who = v; signOut(); } });
      const roleSeg = AZ.seg({ label: 'Dana’s role', value: role, options: Object.keys(ROLES).map((k) => ({ id: k, label: ROLES[k].name })), onChange: (v) => { role = v; badgeText(); resetDoors(); if (signedIn) why.set('Role changed to ' + ROLES[v].name, 'Same person, same sign-in. Only authorization changes. Try the doors again.'); } });
      const bSign = AZ.btn('Sign in', signIn, { cls: 'primary', icon: 'key' });
      const bAll = AZ.btn('Try every door', tryAll, { icon: 'play', cls: 'ghost' });
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, building),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Who signs in'), whoSeg),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Role assigned (RBAC)'), roleSeg),
          h('div', { class: 'btn-row' }, bSign, bAll),
          why)));

      function badgeText() {
        badge.replaceChildren(AZ.icon('check'), h('span', null, h('strong', null, 'dana@contoso.com'), ' · verified · role: ' + ROLES[role].name));
      }
      function resetDoors() {
        doorEls.forEach((b) => { b.classList.remove('open', 'denied'); b.querySelector('.az-door-st').replaceChildren(AZ.icon('lock'), h('span', null, signedIn ? 'Try me' : 'Locked')); b.disabled = !signedIn; });
      }
      function signOut() {
        signedIn = false;
        person.classList.remove('in', 'rejected');
        person.querySelector('.az-person-l').textContent = who === 'dana' ? 'Dana' : 'Unknown';
        gate.classList.remove('pass', 'fail');
        gate.querySelector('.az-gate-state').textContent = 'Closed';
        badge.hidden = true;
        hall.classList.remove('lit', 'never');
        resetDoors();
        why.set('Signed out', 'Press Sign in.');
      }
      async function signIn() {
        if (busy) return;
        busy = true;
        signOut();
        AZ.reveal(building);
        person.classList.add('walking');
        gate.classList.add('checking');
        gate.querySelector('.az-gate-state').textContent = 'Checking…';
        why.set('Authentication', who === 'dana' ? 'Entra ID checks the password, then asks for a second factor on Dana’s phone.' : 'Entra ID checks the password…');
        await AZ.wait(900);
        if (!api.alive) return;
        gate.classList.remove('checking');
        person.classList.remove('walking');
        if (who === 'dana') {
          gate.classList.add('pass');
          gate.querySelector('.az-gate-state').textContent = 'Identity verified';
          person.classList.add('in');
          hall.classList.add('lit');
          badge.hidden = false;
          badgeText();
          signedIn = true;
          resetDoors();
          why.set('Authenticated: Azure knows who this is', 'That’s all authentication does. It says nothing yet about what Dana may do. Now try the doors.', 'ok');
          api.concept('auth-seen-authn', true, 'Authentication verifies identity', 'authn-authz');
        } else {
          gate.classList.add('fail');
          gate.querySelector('.az-gate-state').textContent = 'Sign-in failed';
          person.classList.add('rejected');
          hall.classList.add('never');
          why.set('Authentication failed', 'The person never reaches the doors. Authorization isn’t even evaluated for someone who can’t prove who they are.', 'bad');
          tried.add('fail');
        }
        busy = false;
      }
      async function tryDoor(d, b) {
        if (!signedIn) return;
        const ok = ROLES[role].can.includes(d.id);
        b.classList.remove('open', 'denied');
        await AZ.wait(120);
        b.classList.add(ok ? 'open' : 'denied');
        b.querySelector('.az-door-st').replaceChildren(AZ.icon(ok ? 'unlock' : 'lock'), h('span', null, ok ? 'Allowed' : 'Denied'));
        why.set(ok ? d.label + ': allowed' : d.label + ': access denied', ok
          ? 'The ' + ROLES[role].name + ' role includes permission to ' + d.what + '.'
          : 'Dana is signed in, but the ' + ROLES[role].name + ' role doesn’t allow her to ' + d.what + '. Same identity, different answer: that’s authorization.', ok ? 'ok' : 'bad');
        tried.add(role + d.id);
        if ([...tried].some((k) => k.startsWith('reader')) && [...tried].some((k) => k.startsWith('owner') || k.startsWith('contributor')) && tried.has('fail')) api.complete();
      }
      async function tryAll() {
        if (!signedIn) await signIn();
        if (!signedIn) return;
        for (let i = 0; i < DOORS.length; i++) {
          await tryDoor(DOORS[i], doorEls[i]);
          await AZ.wait(450);
          if (!api.alive) return;
        }
        const n = ROLES[role].can.length;
        why.set(ROLES[role].name + ': ' + n + ' of 4 doors open', 'Authentication happened once, at the gate. Each door was a separate authorization decision based on the role.');
      }
      badgeText();
    }
  });
})();

</script>
<script>/* js/m-controls.js */
/* Module 18 — RBAC vs Azure Policy vs resource locks */
(function () {
  'use strict';
  const { h } = AZ;
  const PEOPLE = {
    jorge: { name: 'Jorge', role: 'Reader' },
    priya: { name: 'Priya', role: 'Contributor' },
    sam: { name: 'Sam', role: 'Owner' }
  };
  const ACTIONS = {
    view: { label: 'View vm-prod-01', short: 'View', kind: 'read', icon: 'eye' },
    createUS: { label: 'Create a VM in East US', short: 'Create in East US', kind: 'write', loc: 'East US', icon: 'plus' },
    createEU: { label: 'Create a VM in West Europe', short: 'Create in West Europe', kind: 'write', loc: 'West Europe', icon: 'plus' },
    resize: { label: 'Resize vm-prod-01', short: 'Resize', kind: 'write', icon: 'pencil' },
    del: { label: 'Delete vm-prod-01', short: 'Delete', kind: 'delete', icon: 'trash' }
  };
  const CTL = {
    rbac: { name: 'RBAC', q: 'WHO can do it?', icon: 'key' },
    policy: { name: 'Azure Policy', q: 'Is it ALLOWED?', icon: 'policy' },
    lock: { name: 'Resource lock', q: 'Can it be CHANGED or DELETED?', icon: 'lock' }
  };

  function miniCtl(k) {
    if (k === 'rbac') return AZ.mini({ nodes: [{ x: 30, y: 46, icon: 'user', label: 'who' }, { x: 80, y: 46, icon: 'key', cls: 'm-hl', r: 14 }, { x: 130, y: 46, icon: 'vm', label: 'what' }], links: [{ a: 0, b: 1 }, { a: 1, b: 2 }] });
    if (k === 'policy') return AZ.mini({ nodes: [{ x: 40, y: 46, icon: 'vm', label: 'config' }, { x: 120, y: 46, icon: 'policy', cls: 'm-hl', r: 14, label: 'rules' }], links: [{ a: 0, b: 1 }] });
    if (k === 'lock') return AZ.mini({ nodes: [{ x: 80, y: 46, icon: 'vm', r: 16 }], marks: [{ x: 100, y: 28, icon: 'lock', cls: 'm-hl', r: 10 }] });
    return AZ.mini({ nodes: [{ x: 80, y: 46, icon: 'tag', r: 16, label: 'env=prod' }] });
  }

  AZ.register({
    id: 'controls', num: 18, domain: 'gov', icon: 'policy',
    title: 'RBAC vs Azure Policy vs resource locks', short: 'RBAC vs Policy vs Locks',
    lede: 'One resource, three separate checks. Build a request — who, what, where — and watch which gate stops it. Each gate answers a different question.',
    objectives: ['g6', 'g7', 'a24'],
    memory: [
      { term: 'RBAC', rule: 'WHO can do WHAT at WHICH SCOPE?', icon: 'key' },
      { term: 'Azure Policy', rule: 'What is allowed? Is this resource compliant?', icon: 'policy' },
      { term: 'Resource lock', rule: 'Can this resource be changed or deleted? Applies even to Owners.', icon: 'lock' }
    ],
    exams: [
      {
        id: 'ctl-x1', concept: 'ctl-lock', pair: 'policy-lock', short: 'Stop an Owner deleting by accident → lock',
        prompt: 'An administrator with the Owner role accidentally deleted a production database. What would have stopped the deletion while still letting admins manage it day to day?',
        answer: 'lock',
        why: 'A delete lock (CanNotDelete) blocks deletion for every user, Owners included, until someone deliberately removes the lock.',
        choices: [
          { id: 'rbac', label: 'Give them the Reader role', art: () => miniCtl('rbac'), note: 'Would block all management, not just accidental deletes.' },
          { id: 'policy', label: 'Azure Policy', art: () => miniCtl('policy'), note: 'Policy checks whether configurations are allowed.' },
          { id: 'lock', label: 'Delete lock', art: () => miniCtl('lock'), note: 'Blocks deletion for everyone.' },
          { id: 'tag', label: 'A “production” tag', art: () => miniCtl('tag'), note: 'Tags label resources; they enforce nothing.' }
        ]
      },
      {
        id: 'ctl-x2', concept: 'ctl-policy', pair: 'rbac-policy', short: 'Only approved regions → Azure Policy',
        prompt: 'No one in the company — including Owners — should be able to create resources outside approved US regions.',
        answer: 'policy',
        why: 'Azure Policy evaluates the resource itself. A policy that denies non-approved locations applies no matter who makes the request.',
        choices: [
          { id: 'rbac', label: 'RBAC role', art: () => miniCtl('rbac'), note: 'RBAC controls who can create resources, not where they may go.' },
          { id: 'policy', label: 'Azure Policy', art: () => miniCtl('policy'), note: 'Evaluates the configuration: location, SKU, tags.' },
          { id: 'lock', label: 'Resource lock', art: () => miniCtl('lock'), note: 'Locks protect existing resources from change or deletion.' },
          { id: 'tag', label: 'Tags', art: () => miniCtl('tag'), note: 'Tags don’t block anything.' }
        ]
      }
    ],
    render(root, api) {
      let who = 'jorge', act = 'view', policyOn = true, lockType = 'none', exists = true, busy = false;
      const runs = new Set();
      const why = AZ.whyBox(['Three gates', 'Pick who is asking and what they want, then send the request down through the gates.']);
      const gates = {};
      Object.keys(CTL).forEach((k) => {
        gates[k] = h('div', { class: 'cg-gate cg-' + k, 'data-gate': k },
          h('div', { class: 'cg-top' }, AZ.icon(CTL[k].icon), h('span', { class: 'cg-name' }, CTL[k].name)),
          h('div', { class: 'cg-q' }, CTL[k].q),
          h('div', { class: 'cg-rule' }),
          h('div', { class: 'cg-res' }),
          h('div', { class: 'cg-slot', 'data-slot': '' }));
      });
      const req = h('div', { class: 'cg-req' });
      const res = h('div', { class: 'cg-target' },
        h('div', { class: 'cg-rg' }, AZ.icon('rg'), h('span', null, 'rg-prod · East US')),
        h('div', { class: 'cg-vm' }, AZ.icon('vm'), h('span', { class: 'cg-vm-n' }, 'vm-prod-01')),
        h('div', { class: 'cg-new', hidden: true }));
      const pipe = h('div', { class: 'cg-pipe' }, req, gates.rbac, gates.policy, gates.lock, res);

      const whoSeg = AZ.seg({ label: 'Who', value: who, options: Object.keys(PEOPLE).map((k) => ({ id: k, label: PEOPLE[k].name + ' · ' + PEOPLE[k].role })), onChange: (v) => { who = v; drawReq(); } });
      const actSeg = AZ.seg({ label: 'Action', value: act, cls: 'seg-wrap', options: Object.keys(ACTIONS).map((k) => ({ id: k, label: ACTIONS[k].short, icon: ACTIONS[k].icon })), onChange: (v) => { act = v; drawReq(); } });
      const tPolicy = AZ.toggle({ label: 'Policy: allowed locations = US only', on: true, onChange: (v) => { policyOn = v; rules(); } });
      const lockSeg = AZ.seg({ label: 'Lock on rg-prod', value: lockType, options: [{ id: 'none', label: 'No lock' }, { id: 'delete', label: 'Delete lock' }, { id: 'readonly', label: 'Read-only lock' }], onChange: (v) => { lockType = v; rules(); } });
      const bSend = AZ.btn('Send request', send, { cls: 'primary', icon: 'play' });
      const bRestore = AZ.btn('Restore VM', () => { exists = true; res.querySelector('.cg-vm').classList.remove('gone'); bRestore.hidden = true; }, { cls: 'ghost', icon: 'reset' });
      bRestore.hidden = true;

      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, pipe),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Who is asking'), whoSeg),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'What they want'), actSeg),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Governance settings'), tPolicy, lockSeg),
          h('div', { class: 'btn-row' }, bSend, bRestore),
          why)));

      function drawReq() {
        const a = ACTIONS[act];
        req.replaceChildren(h('div', { class: 'cg-req-k' }, 'Request'), h('div', { class: 'cg-req-b' }, AZ.icon('user'), h('strong', null, PEOPLE[who].name), h('span', null, '(' + PEOPLE[who].role + ')')), h('div', { class: 'cg-req-b' }, AZ.icon(a.icon), h('span', null, a.label)));
        Object.values(gates).forEach((g) => { g.classList.remove('pass', 'fail', 'skip'); g.querySelector('.cg-res').replaceChildren(); });
      }
      function rules() {
        gates.rbac.querySelector('.cg-rule').textContent = 'Reader: view · Contributor: manage · Owner: manage + grant access';
        gates.policy.querySelector('.cg-rule').textContent = policyOn ? 'Allowed locations: US regions' : 'No policy assigned';
        gates.lock.querySelector('.cg-rule').textContent = { none: 'No lock', delete: 'Delete lock: no deletions', readonly: 'Read-only: no changes at all' }[lockType];
        drawReq();
      }
      function evalGate(k) {
        const a = ACTIONS[act], p = PEOPLE[who];
        if (k === 'rbac') {
          if (a.kind === 'read' || p.role !== 'Reader') return [true, p.role + ' may ' + (a.kind === 'read' ? 'read' : 'make changes') + '.'];
          return [false, 'Reader can view but not change anything.'];
        }
        if (k === 'policy') {
          if (!policyOn) return [true, 'No policy to check.'];
          if (a.loc && a.loc !== 'East US') return [false, a.loc + ' is not an allowed location. Non-compliant.'];
          if (a.loc) return [true, 'East US is allowed. Compliant.'];
          return [true, 'Nothing here breaks the rule.'];
        }
        if (lockType === 'delete' && a.kind === 'delete') return [false, 'Delete lock: nobody can delete, not even ' + (p.role === 'Owner' ? 'an Owner' : p.role) + '.'];
        if (lockType === 'readonly' && a.kind !== 'read') return [false, 'Read-only lock: no changes, not even by an Owner.'];
        return [true, lockType === 'none' ? 'No lock.' : 'The lock allows this.'];
      }
      async function send() {
        if (busy) return;
        const a = ACTIONS[act];
        if (!exists && act !== 'createUS' && act !== 'createEU') { why.set('vm-prod-01 is gone', 'Restore the VM first.', 'warn'); return; }
        busy = true; bSend.disabled = true;
        AZ.reveal(pipe);
        drawReq();
        let stoppedBy = null;
        for (const k of ['rbac', 'policy', 'lock']) {
          const g = gates[k];
          g.classList.add('checking');
          await AZ.wait(520);
          if (!api.alive) return;
          g.classList.remove('checking');
          const [ok, msg] = evalGate(k);
          g.classList.add(ok ? 'pass' : 'fail');
          g.querySelector('.cg-res').replaceChildren(AZ.icon(ok ? 'check' : 'x'), h('span', null, msg));
          if (!ok) { stoppedBy = k; break; }
        }
        if (stoppedBy) {
          ['rbac', 'policy', 'lock'].slice(['rbac', 'policy', 'lock'].indexOf(stoppedBy) + 1).forEach((k) => gates[k].classList.add('skip'));
          const expl = {
            rbac: 'RBAC answers WHO. ' + PEOPLE[who].name + '’s role doesn’t include this action.',
            policy: 'Azure Policy answers WHAT IS ALLOWED. It judged the resource’s location, not the person — even an Owner would be denied.',
            lock: 'A lock answers CAN IT BE CHANGED OR DELETED. It overrides roles: remove the lock deliberately first.'
          }[stoppedBy];
          why.set('Denied by ' + CTL[stoppedBy].name, expl, 'bad');
        } else {
          if (a.kind === 'delete') { exists = false; res.querySelector('.cg-vm').classList.add('gone'); bRestore.hidden = false; }
          const nw = res.querySelector('.cg-new');
          if (a.loc) { nw.hidden = false; nw.replaceChildren(AZ.icon('vm'), h('span', null, 'new VM · ' + a.loc)); AZ.pop(nw, 'pop', 600); }
          why.set('Allowed: all three gates passed', 'RBAC allowed the person, Policy allowed the configuration, and no lock blocked the change.', 'ok');
        }
        runs.add(stoppedBy || 'ok');
        if (runs.size >= 4) api.complete();
        busy = false; bSend.disabled = false;
      }
      rules();

      /* --- pick the right control --- */
      const tray = h('div', { class: 'tray' });
      const sWhy = AZ.whyBox(['Which control?', 'Drop each requirement on the gate that solves it.']);
      const slotGates = {};
      const board = h('div', { class: 'cg-board' }, Object.keys(CTL).map((k) => (slotGates[k] = h('div', { class: 'cg-drop cg-' + k },
        h('div', { class: 'cg-top' }, AZ.icon(CTL[k].icon), h('span', { class: 'cg-name' }, CTL[k].name)), h('div', { class: 'cg-q' }, CTL[k].q), h('div', { class: 'cg-slot', 'data-slot': '' })))));
      root.append(h('div', { class: 'chal-block' }, AZ.part('Pick the right control', 'Each requirement below is solved by exactly one of the three.'),
        h('div', { class: 'lab-grid' }, h('div', { class: 'lab-main' }, board, tray), h('aside', { class: 'lab-side' }, sWhy))));
      const W = {
        rbac: 'RBAC grants people permissions. It can’t judge a resource’s settings, and it doesn’t stop an Owner from an accidental delete.',
        policy: 'Policy evaluates resource settings (location, size, tags). It doesn’t decide who may act, and it doesn’t freeze a resource.',
        lock: 'A lock only prevents changes or deletion of existing resources. It doesn’t grant access or judge settings.'
      };
      AZ.sorter({
        tray, feedback: sWhy, moduleId: 'controls', domain: 'gov',
        targets: Object.keys(CTL).map((k) => ({ id: k, el: slotGates[k], label: CTL[k].name })),
        wrong: (it, t) => W[t.id],
        items: [
          { id: 'region', text: 'Prevent resources from being created outside approved regions', short: 'Approved regions only', target: 'policy', pair: 'rbac-policy', why: 'Location is a property of the resource. Policy checks it on every request, whoever sends it.' },
          { id: 'view', text: 'Allow Jorge to view VMs but not modify them', short: 'Jorge: view only', target: 'rbac', pair: 'rbac-policy', why: 'Who can do what: assign Jorge the Reader role (RBAC).' },
          { id: 'del', text: 'Prevent accidental deletion of this production resource', short: 'No accidental deletes', target: 'lock', pair: 'policy-lock', why: 'A delete lock blocks deletion for everyone until it is removed on purpose.' },
          { id: 'tag', text: 'Every new resource must carry a CostCenter tag', short: 'Require a tag', target: 'policy', pair: 'policy-lock', why: 'A required tag is a configuration rule: Azure Policy.' },
          { id: 'dbteam', text: 'Let the database team manage only the resources in rg-data', short: 'DB team → rg-data', target: 'rbac', pair: 'rbac-policy', why: 'A role assignment scoped to one resource group: RBAC.' },
          { id: 'freeze', text: 'Nobody may change this firewall’s settings during an audit', short: 'Freeze settings', target: 'lock', pair: 'policy-lock', why: 'A read-only lock stops all modifications to the existing resource.' }
        ],
        doneText: 'Done. RBAC = who. Policy = what is allowed. Lock = can it change.'
      });
    }
  });
})();

</script>
<script>/* js/m-monitoring.js */
/* Module 21 — Azure Monitor vs Application Insights vs Log Analytics vs Service Health vs Advisor */
(function () {
  'use strict';
  const { h, s } = AZ;
  const ST = {
    monitor: { name: 'Azure Monitor', q: 'Collect, chart and alert on telemetry', icon: 'chart' },
    appins: { name: 'Application Insights', q: 'How is MY APP performing?', icon: 'pulse' },
    logs: { name: 'Log Analytics', q: 'Query the collected logs', icon: 'search' },
    health: { name: 'Service Health', q: 'Is AZURE having a problem that affects me?', icon: 'heart' },
    advisor: { name: 'Azure Advisor', q: 'How can I improve my setup?', icon: 'bulb' }
  };

  function sparkSvg(vals, opts) {
    opts = opts || {};
    const W = 300, H = 110, pad = 8;
    const max = opts.max || Math.max(...vals) * 1.15;
    const X = (i) => pad + (i / (vals.length - 1)) * (W - pad * 2);
    const Y = (v) => H - pad - (v / max) * (H - pad * 2 - 10);
    const sv = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'mon-chart', 'aria-hidden': 'true' });
    if (opts.threshold != null) {
      sv.append(s('line', { x1: pad, x2: W - pad, y1: Y(opts.threshold), y2: Y(opts.threshold), class: 'mon-thr' }));
      sv.append(s('text', { x: W - pad, y: Y(opts.threshold) - 5, class: 'mon-tl', 'text-anchor': 'end' }, opts.thrLabel || 'threshold'));
    }
    const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(v)).join(' ');
    sv.append(s('path', { d: d + ` L${X(vals.length - 1)} ${H - pad} L${X(0)} ${H - pad} Z`, class: 'mon-area' }));
    sv.append(s('path', { d, class: 'mon-line' }));
    const li = vals.length - 1;
    sv.append(s('circle', { cx: X(li), cy: Y(vals[li]), r: 4.5, class: 'mon-end' + (opts.hot ? ' hot' : '') }));
    return sv;
  }

  function view(k) {
    if (k === 'monitor') {
      return h('div', { class: 'mon-view' },
        h('div', { class: 'mon-vh' }, AZ.icon('chart'), 'Metrics · vm-api-01 · CPU %'),
        sparkSvg([22, 25, 24, 30, 28, 35, 41, 55, 72, 88, 94, 96], { max: 100, threshold: 90, thrLabel: 'alert rule: CPU > 90%', hot: true }),
        h('div', { class: 'mon-alert' }, AZ.icon('bell'), h('span', null, h('strong', null, 'Alert fired'), ' · email + SMS sent to the on-call team')),
        h('p', { class: 'mon-cap' }, 'The platform that collects metrics and logs from Azure resources, apps and even on-premises machines — then charts them and fires alerts.'));
    }
    if (k === 'appins') {
      const rows = [['GET /checkout', '4.2 s', 'bad'], ['GET /cart', '380 ms', 'ok'], ['POST /login', '210 ms', 'ok']];
      return h('div', { class: 'mon-view' },
        h('div', { class: 'mon-vh' }, AZ.icon('pulse'), 'Application Insights · contoso-store'),
        h('div', { class: 'mon-dep' },
          h('span', { class: 'mon-n' }, AZ.icon('web'), 'web app'), h('span', { class: 'mon-arrow ok' }),
          h('span', { class: 'mon-n' }, AZ.icon('db'), 'SQL'), h('span', { class: 'mon-slow' }, '3.9 s per call')),
        h('table', { class: 'mon-tbl' }, h('thead', null, h('tr', null, h('th', null, 'Request'), h('th', null, 'Avg duration'))),
          h('tbody', null, rows.map(([r, v, t]) => h('tr', null, h('td', null, r), h('td', { class: t }, v))))),
        h('p', { class: 'mon-cap' }, 'Application performance monitoring: response times, failed requests, and which dependency is slow.'));
    }
    if (k === 'logs') {
      return h('div', { class: 'mon-view' },
        h('div', { class: 'mon-vh' }, AZ.icon('search'), 'Log Analytics · query'),
        h('pre', { class: 'mon-kql' }, 'AppRequests\n| where Success == false\n| summarize failures = count()\n    by bin(TimeGenerated, 5m)'),
        h('div', { class: 'mon-bars' }, [2, 3, 2, 5, 14, 22, 19].map((v) => h('span', { style: { height: v * 3 + 6 + 'px' } }))),
        h('p', { class: 'mon-cap' }, 'A tool in the Azure portal for writing and running queries against the logs Azure Monitor collected.'));
    }
    if (k === 'health') {
      return h('div', { class: 'mon-view' },
        h('div', { class: 'mon-vh' }, AZ.icon('heart'), 'Service Health · your subscriptions'),
        h('div', { class: 'mon-evt bad' }, h('strong', null, 'Service issue'), h('span', null, 'Azure Storage · East US · may affect stinvoices')),
        h('div', { class: 'mon-evt warn' }, h('strong', null, 'Planned maintenance'), h('span', null, 'Virtual Machines · West US 2 · next Tuesday 02:00 UTC')),

(function () {

      sp.links.push({ a: 0, b: 1, cls: 'private' });
    }

    return AZ.mini(sp);
  }

  AZ.register({
    id: 'cloud-models', num: 3, domain: 'cloud', icon: 'cloud',
    title: 'Cloud computing and cloud models', short: 'Public vs private vs hybrid',
    lede: 'First, race a server order against a cloud request. Then move workloads between your own datacenter and Azure and watch the cloud model change.',
    objectives: ['c1', 'c3', 'c4'],
    memory: [
      { term: 'Cloud computing', rule: 'Compute, storage, networking and more — delivered over the internet, on demand, paid by use.', icon: 'cloud' },
      { term: 'Public cloud', rule: 'Built and run by a provider; you rent it over the internet.', icon: 'globe' },
      { term: 'Private cloud', rule: 'Cloud resources used by one organization only.', icon: 'building' },
      { term: 'Hybrid cloud', rule: 'Public + private, connected and working together.', icon: 'link' }
    ],
    exams: [
      {
        id: 'cm-x1', concept: 'cm-hybrid', short: 'Data on-site, website in Azure → hybrid',
        prompt: 'Regulations force a company to keep its customer database in its own datacenter. It wants the public website to run in Azure and read from that database.',
        answer: 'hybrid',
        why: 'Hybrid cloud combines on-premises (private) infrastructure with public cloud resources and connects them so they work together.',
        choices: [
          { id: 'public', label: 'Public cloud', art: () => miniModel('public'), note: 'Would move the database out of the datacenter.' },
          { id: 'private', label: 'Private cloud', art: () => miniModel('private'), note: 'Keeps everything in-house; the website wouldn’t be in Azure.' },
          { id: 'hybrid', label: 'Hybrid cloud', art: () => miniModel('hybrid'), note: 'Both environments, connected.' },
          { id: 'multi', label: 'Two public clouds', art: () => miniModel('multi'), note: 'That’s multi-cloud; the database must stay on-site.' }
        ]
      }
    ],
    render(root, api) {
      /* ---------- part 1: what cloud computing is ---------- */
      const why1 = AZ.whyBox(['Race them', 'Both teams need one new server for a project. Press “Request a server”.']);
      const lane = (name, steps) => h('div', { class: 'cm-lane' }, h('div', { class: 'cm-lane-h' }, name),
        h('ol', { class: 'cm-steps' }, steps.map((s) => h('li', { class: 'cm-step' }, h('span', { class: 'cm-step-t' }, s[0]), h('span', { class: 'cm-step-d' }, s[1])))));
      const own = lane('Own it: on-premises', [['Get budget approved', 'week 1'], ['Order hardware', 'week 2'], ['Wait for delivery', 'weeks 3–6'], ['Rack, cable, install', 'week 7'], ['Ready', 'week 8']]);
      const rent = lane('Rent it: cloud', [['Choose a size', 'minute 1'], ['Click Create', 'minute 2'], ['Ready', 'minute 5']]);
      const bRace = AZ.btn('Request a server', race, { cls: 'primary', icon: 'play' });
      root.append(AZ.part('What cloud computing is', 'Renting computing power over the internet instead of owning it.'),
        h('div', { class: 'lab-grid' }, h('div', { class: 'lab-main' }, h('div', { class: 'cm-race' }, own, rent)), h('aside', { class: 'lab-side' }, h('div', { class: 'btn-row' }, bRace), why1)));
      let raced = false;
      async function race() {
        bRace.disabled = true;
        [own, rent].forEach((l) => l.querySelectorAll('.cm-step').forEach((s) => s.classList.remove('done')));
        const a = own.querySelectorAll('.cm-step'), b = rent.querySelectorAll('.cm-step');
        for (let i = 0; i < a.length; i++) {
          if (!api.alive) return;
          a[i].classList.add('done');
          if (b[i]) b[i].classList.add('done');
          if (i === b.length - 1) why1.set('Cloud: ready in minutes', 'On-demand, self-service: the provider already owns the hardware. You rent what you need, when you need it.', 'ok');
          await AZ.wait(550);
        }
        why1.set('Cloud computing', 'Delivering computing services — servers, storage, databases, networking, software — over the internet. You get them on demand and pay for what you use.', 'ok');
        bRace.disabled = false;
        raced = true;
      }

      /* ---------- part 2: move workloads between environments ---------- */
      const where = { web: 'onprem', db: 'onprem', files: 'onprem', hr: 'onprem', test: 'onprem' };
      const why2 = AZ.whyBox();
      const envs = {
        onprem: h('div', { class: 'cm-env onprem', 'data-drop': 'onprem' }, h('div', { class: 'cm-env-h' }, AZ.icon('building'), h('span', null, 'Your datacenter'), h('span', { class: 'cm-env-s' }, 'dedicated to you')), h('div', { class: 'cm-wl-grid', 'data-slot': '' })),
        azure: h('div', { class: 'cm-env azure', 'data-drop': 'azure' }, h('div', { class: 'cm-env-h' }, AZ.icon('cloud'), h('span', null, 'Azure public cloud'), h('span', { class: 'cm-env-s' }, 'shared, rented')), h('div', { class: 'cm-wl-grid', 'data-slot': '' }))
      };

      const users = h('div', { class: 'cm-users' }, AZ.icon('users'), h('span', null, 'Employees & customers'));
      const badge = h('div', { class: 'cm-badge', 'aria-live': 'polite' });
      const tiles = {};
      WL.forEach((w) => {
        const b = h('button', { type: 'button', class: 'cm-wl', 'aria-label': w.name + ': tap to move to the other environment' }, AZ.icon(w.icon), h('span', null, w.name));
        b.addEventListener('click', () => move(w.id, where[w.id] === 'onprem' ? 'azure' : 'onprem'));
        AZ.draggable(b, { dropSelector: '.cm-env', onDrop: (el, r) => move(w.id, el.dataset.drop, r) });
        tiles[w.id] = b;
      });
      root.append(h('div', { class: 'chal-block' }, AZ.part('Public, private or hybrid?', 'Tap a workload to move it — or drag it to the other side.'),
        h('div', { class: 'lab-grid' },

          h('aside', { class: 'lab-side' }, badge, h('div', { class: 'btn-row' },
            AZ.btn('All on-premises', () => setAll('onprem'), { cls: 'ghost small' }),
            AZ.btn('All in Azure', () => setAll('azure'), { cls: 'ghost small' })), why2))));
      const seen = new Set();
      function model() {
        const v = Object.values(where);
        return v.every((x) => x === 'onprem') ? 'private' : v.every((x) => x === 'azure') ? 'public' : 'hybrid';
      }
      function draw(from) {

        WL.forEach((w) => envs[where[w.id]].querySelector('[data-slot]').append(tiles[w.id]));
        if (from) Object.keys(tiles).forEach((k) => AZ.flip(tiles[k], from[k] || before[k], 520));
        const m = model();
        seen.add(m);
        link.classList.toggle('on', m === 'hybrid');
        envs.onprem.classList.toggle('empty', m === 'public');
        envs.azure.classList.toggle('empty', m === 'private');
        badge.className = 'cm-badge ' + m;
        badge.replaceChildren(h('span', { class: 'ctl-k' }, 'Your cloud model'), h('strong', null, MODELS[m].name));

        if (seen.size === 3) api.complete();

        if (!to || where[id] === to) return;
        where[id] = to;
        const from = {};
        if (rect) from[id] = rect;

      root.append(h('div', { class: 'chal-block' }, AZ.part('Place each scenario'),

      const W = {
        public: 'Public cloud would move everything onto shared provider infrastructure.',

        hybrid: 'Hybrid means both environments in use and connected. This scenario lives in just one.'

      AZ.sorter({
        tray, feedback: why3, moduleId: 'cloud-models', domain: 'cloud',

          { id: 'bank', text: 'A bank must run everything on hardware dedicated to it, in its own building', short: 'Dedicated hardware only', target: 'private', why: 'Dedicated to one organization and under its own control: private cloud.' },
          { id: 'reg', text: 'Keep the customer database on-site for regulators; run the website in Azure', short: 'Database on-site + web in Azure', target: 'hybrid', why: 'Both environments, connected: hybrid.' },
          { id: 'burst', text: 'Burst into Azure during peak season, while core systems stay on-site', short: 'Burst to Azure at peak', target: 'hybrid', why: 'Extending on-premises capacity into public cloud when needed is a classic hybrid use.' },
          { id: 'global', text: 'A new app must reach users worldwide, fast, without buying servers', short: 'Global app, no servers', target: 'public', why: 'The provider already has datacenters worldwide: public cloud.' },
          { id: 'control', text: 'An agency requires complete control over the physical hardware', short: 'Full hardware control', target: 'private', why: 'Only a private cloud gives you control of the physical hardware.' }
        ]
      });
    }
  });
})();

        }

        else if (what === 'cx-vms') why.set(vms + ' VMs', 'More VMs means a bigger upfront purchase on the left — before a single workload runs. On the right, the meter just moves.');
        else if (what === 'cx-tb') why.set(tb + ' TB of storage', 'In your datacenter you buy disks for the capacity you expect. In Azure you pay for the terabytes you actually store.');
        else if (what === 'pricing') why.set(PRICING[pricing].name, PRICING[pricing].line, pricing === 'spot' ? 'warn' : 'info');

    }

})();

<script>/* js/m-benefits.js */
/* Module 6 — High availability, reliability and the other cloud benefits */
(function () {
  'use strict';
  const { h, s } = AZ;
  const BEN = {
    ha: { name: 'High availability', q: 'Is it up when users need it?', icon: 'pulse' },
    rel: { name: 'Reliability', q: 'Can it recover and keep working?', icon: 'reset' },

  function specSingle() {

      nodes: [
        { id: 'u', x: 180, y: 34, w: 140, label: 'Users', icon: 'users', kind: 'user' },
        { id: 'v1', x: 180, y: 230, w: 150, label: 'app-vm-1', sub: 'one server', icon: 'vm' }

      links: [{ from: 'u', to: 'v1' }]

  }
  function specHA() {
    return {
      h: 330, label: 'Users reaching an app through a load balancer that spreads traffic across three servers in three zones',

        { id: 'z3', x: 238, y: 200, w: 104, h: 112, kind: 'subnet', label: 'ZONE 3' }

      nodes: [
        { id: 'u', x: 180, y: 34, w: 140, label: 'Users', icon: 'users', kind: 'user' },
        { id: 'lb', x: 180, y: 146, w: 150, label: 'Load balancer', icon: 'gateway', kind: 'edge' },
        { id: 'v1', x: 70, y: 262, w: 92, label: 'vm-1', icon: 'vm' },
        { id: 'v2', x: 180, y: 262, w: 92, label: 'vm-2', icon: 'vm' },
        { id: 'v3', x: 290, y: 262, w: 92, label: 'vm-3', icon: 'vm' }
      ],
      links: [{ from: 'u', to: 'lb' }, { from: 'lb', to: 'v1' }, { from: 'lb', to: 'v2' }, { from: 'lb', to: 'v3' }]

  }
  function miniBen(k) {

      sv.append(s('rect', { x: 14, y: 40, width: 132, height: 16, rx: 4, class: 'mt m-off' }));
      sv.append(s('rect', { x: 14, y: 40, width: 131, height: 16, rx: 4, class: 'mt m-hl' }));

    } else if (k === 'rel') {
      sv.append(AZ.gIcon('x', 44, 44, 26, 'm-badic'));
      sv.append(s('path', { d: 'M62 44 H98', class: 'mlink private' }));
      sv.append(AZ.gIcon('check', 116, 44, 26));
      sv.append(s('text', { x: 80, y: 82, class: 'mtext', 'text-anchor': 'middle' }, 'fail → recover'));
    } else if (k === 'scale') {
      [0, 1, 2].forEach((i) => sv.append(s('rect', { x: 40 + i * 30, y: 34, width: 22, height: 30, rx: 3, class: 'mt ' + (i === 2 ? 'm-hl' : 'm-in') })));
      sv.append(s('text', { x: 80, y: 82, class: 'mtext', 'text-anchor': 'middle' }, 'add servers'));
    } else {
      sv.append(AZ.gIcon('dollar', 80, 42, 30));
      sv.append(s('text', { x: 80, y: 82, class: 'mtext', 'text-anchor': 'middle' }, 'forecast the bill'));
    }
    return sv;
  }

  AZ.register({
    id: 'reliability', num: 6, domain: 'cloud', icon: 'pulse',
    title: 'High availability, reliability and cloud benefits', short: 'Availability vs reliability',
    lede: 'Fail the only server and watch the app go dark. Then run three copies behind a load balancer and fail one again. Finally, sort the six cloud benefits — they are not interchangeable.',
    objectives: ['c8', 'c9', 'c10', 'c11'],
    memory: [
      { term: 'High availability', rule: 'Stays up when a part fails. Measured as uptime, promised in an SLA.', icon: 'pulse' },
      { term: 'Reliability', rule: 'Recovers from failure and keeps functioning.', icon: 'reset' },
      { term: 'Predictability', rule: 'You can forecast performance and cost.', icon: 'dollar' },
      { term: 'Security & governance', rule: 'Templates, policies and platform patching keep you compliant and protected.', icon: 'shield' },
      { term: 'Manageability', rule: 'Manage OF the cloud (autoscale, alerts) and IN the cloud (portal, CLI, API).', icon: 'gear' }
    ],
    exams: [
      {
        id: 'ben-x1', concept: 'ben-rel', pair: 'avail-rel', short: 'Recover from failure and keep working → reliability',
        prompt: 'Which benefit describes a system’s ability to recover from a failure and continue to function?',
        answer: 'rel',
        why: 'Reliability is about recovering and continuing to work — for example by designing across regions so a disaster in one doesn’t stop you.',
        choices: ['ha', 'rel', 'scale', 'pred'].map((k) => ({ id: k, label: BEN[k].name, art: () => miniBen(k), note: { ha: 'Availability: how much of the time it’s up (uptime, SLA).', rel: 'Recover and keep working.', scale: 'Handling more demand.', pred: 'Forecasting cost and performance.' }[k] }))
      },
      {
        id: 'ben-x2', concept: 'ben-ha', pair: 'avail-rel', short: 'Guaranteed uptime percentage → high availability',
        prompt: 'A service promises 99.99% uptime in its service-level agreement. Which benefit is that promise about?',
        answer: 'ha',
        why: 'Uptime guarantees (SLAs) describe availability: how much of the time the service is up and reachable.',
        choices: ['ha', 'rel', 'scale', 'pred'].map((k) => ({ id: k, label: BEN[k].name, art: () => miniBen(k), note: { ha: 'Uptime, measured and guaranteed.', rel: 'Recovery after failure — related, but not the uptime number.', scale: 'Capacity, not uptime.', pred: 'Forecasts, not guarantees of uptime.' }[k] }))
      }
    ],
    render(root, api) {
      let ha = false, failed = new Set(), served = 0, lost = 0, running = true, flow = null;
      const flags = { singleFail: false, haFail: false };
      const why = AZ.whyBox(['One server', 'Traffic flows to a single server. Press “Fail server”.']);
      const stage = h('div', { class: 'net-stage' });
      const counter = h('div', { class: 'sc-read' });
      const tHA = AZ.toggle({ label: 'High availability: 3 servers in 3 zones', on: false, onChange: (v) => { ha = v; failed.clear(); build(); why.set(v ? 'Three copies behind a load balancer' : 'Back to one server', v ? 'Each server sits in its own availability zone. Now fail one.' : 'A single point of failure again.'); } });
      const bFail = AZ.btn('Fail server', failOne, { cls: 'danger-ghost', icon: 'bolt' });

      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, counter, stage),

      api.onCleanup(() => { running = false; if (flow) flow.destroy(); });

      function build() {
        if (flow) flow.destroy();
        stage.replaceChildren();
        flow = new AZ.Flow(stage, ha ? specHA() : specSingle());
        served = 0; lost = 0;
        paint();
      }
      function paint() {
        ['v1', 'v2', 'v3'].forEach((v) => { if (flow.nodes[v]) flow.node(v, failed.has(v) ? 'down' : ''); });
        ['v1', 'v2', 'v3'].forEach((v) => { if (flow.links['lb>' + v]) flow.link('lb>' + v, failed.has(v) ? 'off' : ''); });
        const total = served + lost;
        const pct = total ? (served / total) * 100 : 100;
        const allDown = ha ? failed.size === 3 : failed.has('v1');
        counter.replaceChildren(
          stat('App status', allDown ? 'Offline' : 'Online', allDown ? 'bad' : 'ok'),
          stat('Servers healthy', (ha ? 3 - failed.size : failed.has('v1') ? 0 : 1) + ' of ' + (ha ? 3 : 1)),
          stat('Requests served', AZ.fmt(served)),
          stat('Availability now', pct.toFixed(1) + '%', pct < 99 ? 'bad' : 'ok'));
      }
      function stat(k, v, tone) { return h('div', { class: 'sc-stat ' + (tone || '') }, h('span', { class: 'sc-k' }, k), h('span', { class: 'sc-v' }, v)); }

          flags.singleFail = true;
          why.set('The app is offline', 'One server was a single point of failure. Every request now fails until someone repairs it.', 'bad');
        } else {
          const alive = ['v1', 'v2', 'v3'].filter((v) => !failed.has(v));
          if (!alive.length) return;
          failed.add(alive[0]);

          if (failed.size < 3) why.set(alive[0].replace('v', 'vm-') + ' failed. Users didn’t notice.', 'The load balancer stops sending traffic to the failed server and uses the healthy ones. That is high availability: no single point of failure.', 'ok');

          { id: 'dr', text: 'After a regional disaster, the app is restored and keeps working from another region', short: 'Recover in another region', target: 'rel', pair: 'avail-rel', why: 'Recovering from failure and continuing to function is reliability.' },
          { id: 'grow', text: 'Traffic doubles, so more resources are added to meet the demand', short: 'Add resources for demand', target: 'scale', pair: 'scal-elas', why: 'Adding resources to handle demand is scalability.' },
          { id: 'bill', text: 'Estimate next month’s bill before you deploy anything', short: 'Forecast the bill', target: 'pred', why: 'Cost predictability: forecasting spend with tools like the pricing calculator.' },
          { id: 'std', text: 'Templates and policies enforce company standards; the provider patches the platform', short: 'Standards + patching', target: 'sec', why: 'Governance and security capabilities are built into the cloud.' },
          { id: 'mgmt', text: 'Manage everything from a web portal, CLI or API, with automatic alerts', short: 'Portal, CLI, API, alerts', target: 'man', why: 'Manageability: management of the cloud and in the cloud.' }
        ]

(function () {

<script>/* js/m-identity.js */
/* Module 13 — Microsoft Entra ID, authentication methods, external identities, Entra Domain Services */
(function () {
  'use strict';
  const { h } = AZ;
  const METHODS = {
    password: { name: 'Password only', factors: [['key', 'Something you know', 'password']], line: 'One factor. If the password is stolen or guessed, the account is open.' },
    mfa: { name: 'MFA', factors: [['key', 'Something you know', 'password'], ['phone', 'Something you have', 'phone approval']], line: 'Two or more different kinds of proof. A stolen password alone isn’t enough.' },
    pwless: { name: 'Passwordless', factors: [['phone', 'Something you have', 'device or key'], ['finger', 'Something you are / PIN', 'fingerprint, face or PIN']], line: 'No password at all: Windows Hello, Microsoft Authenticator or a FIDO2 key. Strong and convenient.' }
  };
  const APPS = [['mail', 'Outlook'], ['users', 'Teams'], ['cloud', 'Azure portal'], ['doc', 'HR app']];

  function miniId(k) {
    if (k === 'sso') return AZ.mini({ nodes: [{ x: 26, y: 50, icon: 'key', cls: 'm-hl', label: 'once' }, { x: 96, y: 22, icon: 'mail', r: 9 }, { x: 132, y: 50, icon: 'users', r: 9 }, { x: 96, y: 78, icon: 'cloud', r: 9 }], links: [{ a: 0, b: 1 }, { a: 0, b: 2 }, { a: 0, b: 3 }] });

    if (k === 'ext') return AZ.mini({ boxes: [{ x: 70, y: 14, w: 84, h: 72, label: 'Your tenant', cls: 'm-in' }], nodes: [{ x: 30, y: 50, icon: 'user', label: 'partner', cls: 'm-hl' }, { x: 112, y: 52, icon: 'doc' }], links: [{ a: 0, b: 1 }] });
    if (k === 'ds') return AZ.mini({ boxes: [{ x: 30, y: 14, w: 100, h: 72, label: 'Managed domain', cls: 'm-in' }], nodes: [{ x: 60, y: 54, icon: 'server', r: 11 }, { x: 100, y: 54, icon: 'vm', r: 11 }], texts: [{ x: 80, y: 96, t: 'LDAP · Kerberos' }] });
    return AZ.mini({ nodes: [{ x: 80, y: 44, icon: 'shield', r: 18, cls: 'm-hl' }], texts: [{ x: 80, y: 90, t: 'Entra ID' }] });
  }

  AZ.register({
    id: 'identity', num: 13, domain: 'arch', icon: 'shield',
    title: 'Microsoft Entra ID and sign-in methods', short: 'Entra ID & sign-in',
    lede: 'Follow a sign-in from the user to Microsoft Entra ID to the app. Switch methods and send an attacker with a stolen password. Then sign in once and open four apps.',
    objectives: ['a20', 'a21', 'a22'],
    memory: [
      { term: 'Microsoft Entra ID', rule: 'Azure’s cloud identity and access service. Signs users in to Azure, Microsoft 365 and other apps.', icon: 'shield' },
      { term: 'MFA', rule: 'Two or more kinds of proof: know + have + are.', icon: 'phone' },
      { term: 'Passwordless', rule: 'Prove it’s you without a password: device + biometric or PIN.', icon: 'finger' },
      { term: 'Single sign-on', rule: 'Sign in once, use many apps.', icon: 'key' },
      { term: 'External identities', rule: 'Partners and customers sign in with their own accounts.', icon: 'users' },
      { term: 'Entra Domain Services', rule: 'Managed domain join, LDAP and Kerberos for legacy apps — no domain controllers to run.', icon: 'server' }
    ],
    exams: [
      {
        id: 'id-x1', concept: 'id-sso', short: 'One sign-in, many apps → SSO',
        prompt: 'Employees complain about typing credentials into every business app. After one sign-in, they want the other apps to just open.',
        answer: 'sso',
        why: 'Single sign-on lets a user authenticate once and access multiple applications without signing in again.',
        choices: ['sso', 'mfa', 'ext', 'ds'].map((k) => ({ id: k, label: { sso: 'Single sign-on', mfa: 'Multifactor authentication', ext: 'External identities', ds: 'Entra Domain Services' }[k], art: () => miniId(k), note: { sso: 'Once, then everywhere.', mfa: 'Adds proof — more steps, not fewer.', ext: 'For people outside your organization.', ds: 'Legacy domain features, not SSO.' }[k] }))
      },
      {
        id: 'id-x2', concept: 'id-ds', short: 'Legacy app needs domain join + LDAP → Entra Domain Services',
        prompt: 'An old app moved to Azure VMs still needs domain join, Kerberos and LDAP. The company doesn’t want to deploy and patch domain controllers.',
        answer: 'ds',
        why: 'Microsoft Entra Domain Services provides managed domain services — domain join, group policy, LDAP, Kerberos/NTLM — without running domain controllers yourself.',
        choices: ['ds', 'sso', 'ext', 'entra'].map((k) => ({ id: k, label: { sso: 'Single sign-on', ext: 'External identities', ds: 'Entra Domain Services', entra: 'Microsoft Entra ID alone' }[k], art: () => miniId(k), note: { ds: 'Managed legacy domain features.', sso: 'Doesn’t add LDAP or domain join.', ext: 'For outside users.', entra: 'Entra ID uses modern protocols; it doesn’t offer traditional domain join or LDAP by itself.' }[k] }))
      },
      {
        id: 'id-x3', concept: 'id-ext', short: 'Partner signs in with own account → external identities',
        prompt: 'A partner company’s staff need access to one of your apps. They should use their own work accounts, not new ones you create.',
        answer: 'ext',
        why: 'External identities (B2B collaboration) let people outside your organization sign in with their own identities.',
        choices: ['ext', 'sso', 'mfa', 'ds'].map((k) => ({ id: k, label: { sso: 'Single sign-on', mfa: 'Multifactor authentication', ext: 'External identities', ds: 'Entra Domain Services' }[k], art: () => miniId(k), note: { ext: 'Bring your own identity.', sso: 'Fewer sign-ins for your own users.', mfa: 'Stronger proof, not guest access.', ds: 'Legacy domain services.' }[k] }))
      }
    ],
    render(root, api) {
      /* ---------- part 1: sign-in methods ---------- */
      let method = 'password', busy = false;
      const tried = new Set();
      const why = AZ.whyBox();
      const steps = ['User', 'Microsoft Entra ID', 'Authentication', 'Application'];
      const pipe = h('ol', { class: 'id-pipe' }, steps.map((t, i) => h('li', { class: 'id-step' }, AZ.icon(['user', 'shield', 'key', 'web'][i]), h('span', null, t))));
      const factors = h('div', { class: 'id-factors' });
      const result = h('div', { class: 'id-result', 'aria-live': 'polite' });
      const seg = AZ.seg({ label: 'Sign-in method', value: method, cls: 'seg-wrap', options: Object.keys(METHODS).map((k) => ({ id: k, label: METHODS[k].name })), onChange: (v) => { method = v; drawFactors(); } });
      const bUser = AZ.btn('Sign in as Dana', () => run(false), { cls: 'primary', icon: 'user' });
      const bAtk = AZ.btn('Attacker with stolen password', () => run(true), { cls: 'danger-ghost', icon: 'warn' });
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, pipe, factors, result),
        h('aside', { class: 'lab-side' }, h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Method'), seg), h('div', { class: 'btn-row' }, bUser, bAtk), why)));
      function drawFactors() {
        factors.replaceChildren(...METHODS[method].factors.map(([ic, k, d], i) => h('div', { class: 'id-factor' }, h('span', { class: 'id-fn' }, 'Factor ' + (i + 1)), AZ.icon(ic), h('strong', null, k), h('span', null, d))));
        why.set(METHODS[method].name, METHODS[method].line);
        result.replaceChildren();
        pipe.querySelectorAll('.id-step').forEach((s) => s.classList.remove('on', 'bad'));
      }
      async function run(attacker) {
        if (busy) return;
        busy = true;
        result.replaceChildren();
        const li = pipe.querySelectorAll('.id-step');
        li.forEach((s) => s.classList.remove('on', 'bad'));
        AZ.reveal(pipe);
        for (let i = 0; i < 3; i++) { li[i].classList.add('on'); await AZ.wait(420); if (!api.alive) return; }
        const blocked = attacker && method !== 'password';
        const fs = factors.querySelectorAll('.id-factor');
        for (let i = 0; i < fs.length; i++) {
          const fail = attacker && (method === 'pwless' || i > 0);
          fs[i].classList.add(fail ? 'bad' : 'ok');
          await AZ.wait(450);
          if (!api.alive) return;
          if (fail) break;
        }
        if (blocked) {
          li[2].classList.add('bad');
          result.replaceChildren(h('div', { class: 'id-out ok' }, AZ.icon('shield'), h('span', null, h('strong', null, 'Attacker stopped. '), method === 'pwless' ? 'There is no password to steal.' : 'The password was right, but they don’t have Dana’s phone.')));
          why.set('Stolen password, no entry', method === 'pwless' ? 'Passwordless removes the thing attackers steal most.' : 'MFA needs a second kind of proof the attacker doesn’t have.', 'ok');
