          h('span', { class: 'hz-rtop' }, AZ.icon(RT[r.t][0]), h('span', { class: 'hz-rname' }, r.name)),
          h('span', { class: 'hz-rtype' }, RT[r.t][1]), badges(r.id));
        b.addEventListener('click', () => tapRes(r.id));
        AZ.draggable(b, { dropSelector: '[data-drop]', onDrop: (el, rect) => doMove(r.id, el.dataset.drop, rect) });
        return b;
      }
      function box(id, kids) {
        const n = nodes[id];
        const cls = ['hz', 'hz-' + n.type, scope === id ? 'sel' : '', scope ? (inScope(id) ? 'in' : 'out') : '',
          deleted.has(id) ? 'gone' : '', scope && inScope(id) && animBadges ? 'pulse' : '', mode === 'move' && n.type === 'rg' && moving ? 'armed' : ''].join(' ');
        const head = h('button', { type: 'button', class: 'hz-head', 'aria-pressed': String(scope === id) },
          AZ.icon(TYPE_ICON[n.type]),
          h('span', { class: 'hz-hl' }, h('span', { class: 'hz-kind' }, TYPE[n.type]), h('span', { class: 'hz-name' }, n.name + (deleted.has(id) ? ' (deleted)' : ''))),
          n.bill ? h('span', { class: 'hz-bill' }, AZ.icon('dollar'), n.bill) : null,
          badges(id));
        head.addEventListener('click', () => pick(id));
        const el = h('div', { class: cls, 'data-node': id, style: animBadges && inScope(id) ? { animationDelay: ancestors(id).indexOf(scope) * 170 + 'ms' } : null }, head, kids);
        if (n.type === 'rg') el.dataset.drop = id;
        return el;
      }
      function draw() {
        const before = {};
        tree.querySelectorAll('[data-res]').forEach((el) => (before[el.dataset.res] = el.getBoundingClientRect()));
        curBadges = new Set();
        const t = box('mg', h('div', { class: 'hz-subs' }, ['sub-prod', 'sub-dev'].map((sid) =>
          box(sid, h('div', { class: 'hz-rgs' }, Object.values(nodes).filter((n) => n.parent === sid).map((rg) =>
            box(rg.id, h('div', { class: 'hz-tiles' }, deleted.has(rg.id)
              ? h('p', { class: 'hz-empty' }, 'Group and contents deleted')
              : res.filter((r) => r.rg === rg.id).map(tileFor)))))))));
        tree.replaceChildren(t);
        prevBadges = curBadges;
        tree.querySelectorAll('[data-res]').forEach((el) => AZ.flip(el, flipFrom[el.dataset.res] || before[el.dataset.res], 520));
        flipFrom = {};
        // ladder highlights the chosen level and every level below it
        const lv = scope ? ['mg', 'sub', 'rg', 'res'].indexOf(nodeOf(scope).type) : -1;
        ladder.querySelectorAll('.ladder-step').forEach((li, i) => { li.classList.toggle('on', lv >= 0 && i >= lv); li.classList.toggle('at', i === lv); });
        const isRg = scope && nodes[scope] && nodes[scope].type === 'rg' && !deleted.has(scope);
        [bPolicy, bRole, bLock].forEach((b) => (b.disabled = !scope || mode !== 'govern' || deleted.has(scope)));
        bDel.hidden = !isRg || mode !== 'govern';
        scopeLabel.replaceChildren(scope && mode === 'govern'
          ? h('span', null, h('span', { class: 'ctl-k' }, 'Selected scope'), h('strong', null, nameOf(scope)), ' · ', TYPE[nodeOf(scope).type])
          : h('span', { class: 'muted' }, mode === 'move' ? (moving ? 'Moving ' + nameOf(moving) + ' — tap a resource group' : 'Tap a resource to pick it up') : 'No scope selected'));
      }
      let flipFrom = {};

      function counts() {
        const rs = res.filter((r) => inScope(r.id) && !deleted.has(r.rg));
        const rgs = Object.values(nodes).filter((n) => n.type === 'rg' && inScope(n.id) && !deleted.has(n.id));
        const subs = Object.values(nodes).filter((n) => n.type === 'sub' && inScope(n.id));
        return { rs, rgs, subs };
      }
      function explainScope() {
        if (!scope) { why.set('Pick a scope', 'Tap a header — Contoso, Production, rg-web-prod — or a resource tile. Everything that inherits from it lights up.'); return; }
        const n = nodeOf(scope);
        const { rs, rgs, subs } = counts();
        const t = {
          mg: `A management group sits above subscriptions. It reaches ${subs.length} subscriptions, ${rgs.length} resource groups and ${rs.length} resources — plus any subscription added under it later.`,
          sub: `A subscription is a billing and access boundary with its own bill. It reaches its ${rgs.length} resource groups and ${rs.length} resources. The other subscription is untouched.`,
          rg: `A resource group holds resources that share a lifecycle. It reaches only its own ${rs.length} resources.`,
          res: `A single resource. Anything assigned here affects ${nameOf(scope)} and nothing else.`
        }[n.type];
        why.set('Scope: ' + nameOf(scope), t);
      }

      /* --- interactions --- */
      function pick(id) {
        if (challenge) return answer(id);
        if (mode === 'move') {
          if (moving && nodes[id].type === 'rg') doMove(moving, id);
          else why.set(nodes[id].type === 'rg' ? 'Pick a resource first' : 'Resources move between resource groups', nodes[id].type === 'rg' ? 'Tap a resource tile, then tap this group.' : 'Only resources move. Tap a resource, then a resource group.', 'warn');
          return;
        }
        scope = scope === id ? null : id;
        draw();
        explainScope();
      }
      function tapRes(id) {
        if (challenge) return answer(id);
        if (mode === 'move') {
          moving = moving === id ? null : id;
          draw();
          if (moving) why.set('Moving ' + nameOf(id), 'Now tap the resource group it should live in.');
          return;
        }
        scope = scope === id ? null : id;
        draw();
        explainScope();
      }
      function assign(kind) {
        if (!scope) { why.set('Pick a scope first', 'Tap a header or tile, then assign.', 'warn'); return; }
        if (assigns.some((a) => a.kind === kind && a.scope === scope)) { why.set('Already assigned here', 'This scope already has that rule. Try a different level to compare how far it reaches.', 'warn'); return; }
        assigns.push({ kind, scope });
        animBadges = true;
        draw();
        animBadges = false;
        const { rs } = counts();
        const outside = res.filter((r) => !deleted.has(r.rg)).length - rs.length;
        why.set(CTRL[kind].long + ' → ' + nameOf(scope),
          `Assigned once. ${rs.length} resource${rs.length === 1 ? '' : 's'} below inherit it (dashed badges). ${outside} resource${outside === 1 ? '' : 's'} outside this scope ${outside === 1 ? 'is' : 'are'} unaffected.`, 'ok');
        used.assign++;
        checkDone();
      }
      function doMove(rid, rgId, fromRect) {
        const r = res.find((x) => x.id === rid);
        if (!r || !nodes[rgId] || nodes[rgId].type !== 'rg') return;
        if (deleted.has(rgId)) { why.set('That group was deleted', 'Reset to bring it back.', 'warn'); return; }
        if (deleted.has(r.rg)) return;
        if (r.rg === rgId) { moving = null; draw(); return; }
        const before = effective(rid).map((a) => a.kind + '@' + a.scope);
        const old = r.rg;
        r.rg = rgId;
        moving = null;
        if (fromRect) flipFrom[rid] = fromRect;
        draw();
        const after = effective(rid).map((a) => a.kind + '@' + a.scope);
        const gained = after.filter((k) => !before.includes(k)).map((k) => CTRL[k.split('@')[0]].long + ' (from ' + nameOf(k.split('@')[1]) + ')');
        const lost = before.filter((k) => !after.includes(k)).map((k) => CTRL[k.split('@')[0]].long);
        const crossSub = nodes[old].parent !== nodes[rgId].parent;
        why.set(r.name + ' moved to ' + rgId,
          `A resource is in exactly one resource group, so it left ${old}.` +
          (crossSub ? ' It also changed subscription — its cost now lands on the ' + nodes[nodes[rgId].parent].name + ' bill.' : '') +
          (gained.length ? ' Now inherits: ' + gained.join(', ') + '.' : '') +
          (lost.length ? ' No longer inherits: ' + lost.join(', ') + '.' : ''), 'ok');
        used.move++;
        checkDone();
      }
      function deleteRg() {
        if (!scope || !nodes[scope] || nodes[scope].type !== 'rg') return;
        const locks = effective(scope).filter((a) => a.kind === 'lock');
        if (locks.length) {
          AZ.pop(tree.querySelector(`[data-node="${scope}"]`), 'nope', 600);
          why.set('Delete blocked by a lock', `A delete lock ${locks[0].inherited ? 'inherited from ' + nameOf(locks[0].scope) : 'on this group'} stops the deletion — even for an Owner. Locks guard against accidents; they are not permissions.`, 'bad');
          return;
        }
        const inside = res.filter((r) => r.rg === scope);
        const el = tree.querySelector(`[data-node="${scope}"]`);
        el.querySelectorAll('.hz-res').forEach((t) => t.classList.add('poof'));
        const target = scope;
        setTimeout(() => {
          if (!api.alive) return;
          deleted.add(target);
          draw();
        }, AZ.reduced ? 0 : 520);
        why.set('Deleted ' + nameOf(scope) + ' and everything in it', `${inside.length} resource${inside.length === 1 ? '' : 's'} went with it. A resource group and its contents share one lifecycle — so group things you create and delete together.`, 'warn');
        api.concept('hier-rg-lifecycle-seen', true, 'Deleting a resource group deletes its resources');
      }
      function resetAll() {
        res = START.map((r) => ({ ...r }));
        assigns = []; scope = null; moving = null; deleted = new Set(); challenge = null;
        mode = 'govern'; modeSeg.set('govern');
        renderChallenge();
        draw();
        why.set('Reset', 'Back to the starting organization.');
      }
      function checkDone() { if (used.assign >= 1 && used.move >= 1) api.complete(); }

      /* --- quick check: click the right level --- */
      const CH = [
        { q: 'Tap the one box where a single assignment covers every subscription, including ones added next year.', ok: (id) => id === 'mg', c: 'hier-mg', label: 'Management group covers all subscriptions', good: 'Management groups sit above subscriptions; assignments there flow to all of them.', bad: 'That reaches only part of the organization. Go higher.' },
        { q: 'Tap the smallest scope that covers the production database and storage, but not the web tier.', ok: (id) => id === 'rg-data-prod', c: 'hier-rg', label: 'Resource group as a narrow scope', good: 'rg-data-prod holds just those two resources.', bad: 'Too wide or too narrow. Find the group that holds exactly those two.' },
        { q: 'Tap a level that gets its own bill.', ok: (id) => nodes[id] && nodes[id].type === 'sub', c: 'hier-sub', pair: 'rg-sub', label: 'Subscription = billing boundary', good: 'Subscriptions are billing boundaries: each produces its own invoice.', bad: 'Billing happens at the subscription level. Resource groups only organize.' }
      ];
      let ci = 0;
      function renderChallenge() {
        if (!challenge) {
          chalBox.replaceChildren(h('div', { class: 'chal-k' }, AZ.icon('star'), 'Quick check'), h('p', null, 'Three taps on the tree. No text answers.'),
            AZ.btn('Start quick check', () => { if (mode !== 'govern') { mode = 'govern'; modeSeg.set('govern'); } challenge = CH[0]; ci = 0; scope = null; draw(); renderChallenge(); }, { icon: 'play', cls: 'primary' }));
        } else {
          chalBox.replaceChildren(h('div', { class: 'chal-k' }, AZ.icon('star'), 'Quick check ' + (ci + 1) + ' of ' + CH.length), h('p', { class: 'chal-q' }, challenge.q),
            AZ.btn('Stop', () => { challenge = null; renderChallenge(); }, { cls: 'ghost small' }));
        }
      }
      function answer(id) {
        const ok = challenge.ok(id);
        api.concept(challenge.c, ok, challenge.label, challenge.pair);
        scope = id;
        draw();
        const el = tree.querySelector(`[data-node="${id}"]`) || tree.querySelector(`[data-res="${id}"]`);
        if (el) AZ.pop(el, ok ? 'yes' : 'nope', 700);
        why.set(ok ? 'Right' : 'Not that one', ok ? challenge.good : challenge.bad, ok ? 'ok' : 'bad');
        if (ok) {
          ci++;
          if (ci >= CH.length) {
            challenge = null;
            chalBox.replaceChildren(h('div', { class: 'chal-k' }, AZ.icon('check'), 'Quick check done'), h('p', null, 'Try the exam scenarios below.'));
            api.complete();
          } else { challenge = CH[ci]; renderChallenge(); }
        }
      }

      renderChallenge();
      draw();
    }
  });
})();

</script>
<script>/* js/m-service-models.js */
/* Module 2 — IaaS vs PaaS vs SaaS  and  Module 1 — Shared responsibility */
(function () {
  'use strict';
  const { h } = AZ;
  const META = {
    onprem: { name: 'On-premises', tag: 'You own it all' },
    iaas: { name: 'IaaS', tag: 'Rent the infrastructure', ex: 'Azure Virtual Machines' },
    paas: { name: 'PaaS', tag: 'Rent the platform', ex: 'Azure App Service, Azure SQL Database' },
    saas: { name: 'SaaS', tag: 'Rent the finished app', ex: 'Microsoft 365' }
  };
  const L = AZ.STACK;

  function stackChoice(model, note, hl) {
    return { id: model, label: META[model].name, art: () => AZ.miniStack(AZ.YOU[model], hl), note };
  }

  /* ================= IaaS / PaaS / SaaS ================= */
  AZ.register({
    id: 'service-models', num: 2, domain: 'cloud', icon: 'layers',
    title: 'IaaS vs PaaS vs SaaS', short: 'IaaS vs PaaS vs SaaS',
    lede: 'Three buildings, same ten floors. The line between “you manage” and “Microsoft manages” drops as you move from IaaS to SaaS. Place each workload where it belongs.',
    objectives: ['c12', 'c13', 'c14', 'c15'],
    memory: [
      { term: 'IaaS', rule: 'You get the virtual machine. You manage the OS and everything above it.', icon: 'vm' },
      { term: 'PaaS', rule: 'You bring code and data. Microsoft runs the OS and runtime.', icon: 'gear' },
      { term: 'SaaS', rule: 'You use finished software. You still own your data and who can access it.', icon: 'mail' }
    ],
    exams: [
      {
        id: 'svc-x1', concept: 'svc-paas', pair: 'iaas-paas-saas', short: 'Own code, no OS patching → PaaS',
        prompt: 'A team will write its own web API. It does not want to install operating system updates or manage servers.',
        answer: 'paas',
        why: 'PaaS moves the OS and runtime to Microsoft, while you still deploy your own application code.',
        choices: [
          stackChoice('iaas', 'IaaS: you would still patch the OS yourself.', [4]),
          stackChoice('paas', 'PaaS: Microsoft patches the OS; you deploy the code.'),
          stackChoice('saas', 'SaaS: finished software. You cannot deploy your own API.'),
          stackChoice('onprem', 'On-premises: you manage everything, down to the building.')
        ]
      },
      {
        id: 'svc-x2', concept: 'svc-iaas', pair: 'iaas-paas-saas', short: 'Most control in the cloud → IaaS',
        prompt: 'An app needs a custom kernel setting and a specific OS version. The company wants to run it in Azure, not in its own datacenter.',
        answer: 'iaas',
        why: 'Only IaaS gives you the operating system itself. It is the cloud model with the most control — and the most management work for you.',
        choices: [
          stackChoice('iaas', 'IaaS: the OS is yours to configure.'),
          stackChoice('paas', 'PaaS: the OS is managed for you; you cannot change it.'),
          stackChoice('saas', 'SaaS: you only use the application.'),
          stackChoice('onprem', 'On-premises gives control but is not running in Azure.')
        ]
      }
    ],
    render(root, api) {
      const why = AZ.whyBox(['Read the buildings', 'Cyan floors are yours to manage. Blue floors are run by Microsoft. Notice the line drops from IaaS to SaaS.']);
      const labels = h('div', { class: 'sm-col sm-labels', 'aria-hidden': 'true' },
        h('div', { class: 'sm-roof sm-roof-blank' }, h('span', { class: 'legend' }, h('i', { class: 'lg you' }), 'You'), h('span', { class: 'legend' }, h('i', { class: 'lg ms' }), 'Microsoft')),
        L.map((l) => h('div', { class: 'sm-lab' }, AZ.icon(l.icon), h('span', null, l.label))));
      const cols = {};
      ['iaas', 'paas', 'saas'].forEach((m) => {
        const you = AZ.YOU[m];
        cols[m] = h('div', { class: 'sm-col sm-bld', 'data-model': m },
          h('div', { class: 'sm-roof' }, h('span', { class: 'sm-name' }, META[m].name), h('span', { class: 'sm-tag' }, META[m].tag), h('span', { class: 'sm-count' }, 'You: ' + you + ' of 10')),
          L.map((l, i) => h('div', { class: 'sm-floor ' + (i < you ? 'you' : 'ms') + (i === you - 1 ? ' edge' : ''), 'data-layer': l.id },
            h('span', { class: 'sr' }, l.label + ': ' + (i < you ? 'you manage' : 'Microsoft manages')))),
          h('div', { class: 'sm-slot', 'data-slot': '' }));
      });
      const tray = h('div', { class: 'tray' });
      root.append(
        h('div', { class: 'sm-wrap' }, labels, cols.iaas, cols.paas, cols.saas),
        h('div', { class: 'lab-grid' },
          h('div', { class: 'lab-main' }, AZ.part('Place each workload', null), tray),
          h('aside', { class: 'lab-side' }, why)));

      const W = {
        iaas: 'IaaS hands you a whole virtual machine — you would patch the OS and runtime yourself. The scenario doesn’t need that control.',
        paas: 'PaaS hides the operating system. You could not control the OS, and you would still build and deploy an app yourself.',
        saas: 'SaaS is finished software. You cannot bring your own code or change the operating system.'
      };
      const items = [
        { id: 'os', text: 'I need complete control over the operating system', short: 'Full OS control', target: 'iaas', spot: ['os'], concept: 'svc-iaas', why: 'IaaS gives you the virtual machine, so the OS floor is yours to configure and patch. Example: Azure Virtual Machines.' },
        { id: 'lift', text: 'Move an old server to the cloud without changing it', short: 'Lift and shift', target: 'iaas', spot: ['os', 'runtime', 'apps'], concept: 'svc-iaas-lift', why: 'Lift-and-shift keeps the same OS and software exactly as they were, which needs VM-level control: IaaS.' },
        { id: 'deploy', text: 'Deploy my web app without managing the OS', short: 'Deploy code, no OS', target: 'paas', spot: ['runtime', 'os'], concept: 'svc-paas', why: 'PaaS runs the OS and runtime floors for you. You bring the app and data. Example: Azure App Service.' },
        { id: 'db', text: 'A managed database: no patching, just my tables and queries', short: 'Managed database', target: 'paas', spot: ['os', 'runtime'], concept: 'svc-paas-db', why: 'A managed database is a platform: Microsoft patches the engine and OS; you manage schema and data. Example: Azure SQL Database.' },
        { id: 'mail', text: 'I just want to use email software', short: 'Use email', target: 'saas', spot: ['apps'], concept: 'svc-saas', why: 'SaaS is a finished application. You sign in and use it — but your data and who can access it are still yours. Example: Microsoft 365.' },
        { id: 'crm', text: 'Sales staff need an online app: sign in and go', short: 'Ready-made app', target: 'saas', spot: ['apps'], concept: 'svc-saas-2', why: 'Ready-made software you configure and use, with nothing to build or host: SaaS.' }
      ].map((it) => ({ ...it, pair: 'iaas-paas-saas', wrong: W }));

      AZ.sorter({
        items, tray, feedback: why, moduleId: 'service-models', domain: 'cloud', pair: 'iaas-paas-saas',
        targets: ['iaas', 'paas', 'saas'].map((m) => ({ id: m, el: cols[m], label: META[m].name })),
        wrong: (it, t) => W[t.id],
        onPlaced: (it, tid) => {
          const col = cols[tid];
          col.querySelectorAll('.sm-floor').forEach((f) => f.classList.toggle('spot', it.spot.includes(f.dataset.layer)));
          setTimeout(() => col.querySelectorAll('.spot').forEach((f) => f.classList.remove('spot')), 2600);
        },
        doneText: 'All six placed. The deciding question each time: who manages the OS?',
        onDone: () => api.complete()
      });
    }
  });

  /* ================= Shared responsibility ================= */
  AZ.register({
    id: 'shared-resp', num: 1, domain: 'cloud', icon: 'users',
    title: 'Shared responsibility model', short: 'Shared responsibility',
    lede: 'Switch the service model and watch each layer slide to whoever manages it. The two top layers never move.',
    objectives: ['c2', 'c12', 'c13', 'c14'],
    memory: [
      { term: 'Shared responsibility', rule: 'The more “as a service”, the more Microsoft manages.', icon: 'users' },
      { term: 'Always yours', rule: 'Your data and your identities & access — in every model.', icon: 'key' }
    ],
    exams: [
      {
        id: 'sr-x1', concept: 'sr-always', short: 'Data and identities are always the customer’s',
        prompt: 'Which responsibility stays with the customer in every cloud service model — IaaS, PaaS and SaaS?',
        answer: 'data',
        why: 'Microsoft never takes ownership of your information or decides who gets access. Data, accounts and access stay with the customer in every model.',
        choices: [
          { id: 'dc', label: 'Physical datacenter security', art: () => AZ.miniStack(2, [9]), note: 'Microsoft’s job in every cloud model.' },
          { id: 'os', label: 'Operating system patching', art: () => AZ.miniStack(3, [4]), note: 'Yours only in IaaS.' },
          { id: 'data', label: 'Data, identities and access', art: () => AZ.miniStack(2, [0, 1]), note: 'Always the customer’s.' },
          { id: 'hw', label: 'Replacing failed hardware', art: () => AZ.miniStack(5, [8]), note: 'Microsoft replaces hardware in all cloud models.' }
        ]
      }
    ],
    render(root, api) {
      let model = 'onprem';
      let seen = new Set(['onprem']);
      const why = AZ.whyBox();
      const WHY = {
        onprem: ['On-premises', 'You own everything from the building up: buy it, cool it, patch it, replace it.'],
        iaas: ['IaaS', 'Microsoft takes the datacenter, hardware and virtualization. You still manage the OS, runtime, apps, identities and data.'],
        paas: ['PaaS', 'Microsoft also takes the OS and runtime. You focus on your application, identities and data.'],
        saas: ['SaaS', 'Microsoft runs the application itself. You still own your data and control who can access it.']
      };
      const seg = AZ.seg({
        label: 'Service model', value: model, cls: 'seg-lg',
        options: ['onprem', 'iaas', 'paas', 'saas'].map((m) => ({ id: m, label: META[m].name })),
        onChange: (m) => setModel(m)
      });
      const rows = L.map((l, i) => h('div', { class: 'sr-row', 'data-layer': l.id },
        h('div', { class: 'sr-tile' }, AZ.icon(l.icon), h('span', { class: 'sr-l' }, l.label), i < 2 ? h('span', { class: 'sr-pin' }, 'always yours') : null,
          h('span', { class: 'sr-who sr' }, ''))));
      const split = h('div', { class: 'sr-split' }, h('span', { class: 'sr-bar-you' }), h('span', { class: 'sr-bar-ms' }));
      const countYou = h('strong'), countMs = h('strong');
      const stack = h('div', { class: 'sr-stack', role: 'list', 'aria-label': 'Technology stack' },
        h('div', { class: 'sr-heads', 'aria-hidden': 'true' }, h('span', { class: 'sr-h you' }, 'Customer'), h('span', { class: 'sr-h ms' }, 'Microsoft')),
        rows);
      rows.forEach((r) => r.setAttribute('role', 'listitem'));
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Service model'), seg), stack),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'sr-count' }, h('div', null, 'Customer manages ', countYou), h('div', null, 'Microsoft manages ', countMs), split),
          why)));

      function setModel(m) {
        const prevYou = AZ.YOU[model];
        model = m;
        seen.add(m);
        const you = AZ.YOU[m];
        const down = you < prevYou; // responsibility moving to Microsoft
        rows.forEach((r, i) => {
          const mine = i < you;
          const order = down ? L.length - 1 - i : i;
          r.querySelector('.sr-tile').style.transitionDelay = AZ.reduced ? '0ms' : order * 45 + 'ms';
          r.classList.toggle('ms', !mine);
          r.classList.toggle('you', mine);
          r.querySelector('.sr-who').textContent = mine ? ': customer manages' : ': Microsoft manages';
        });
        countYou.textContent = you + ' layers';
        countMs.textContent = 10 - you + ' layers';
        split.style.setProperty('--split', you * 10 + '%');
        why.set(WHY[m][0], WHY[m][1]);
        if (seen.size === 4) api.complete();
      }
      setModel('onprem');

      /* --- challenge: tap the layers the customer manages --- */
      const CH = [
        { m: 'iaas', q: 'Contoso runs its app on Azure Virtual Machines (IaaS). Tap every layer Contoso manages. Then look at the OS row: who patches it?', c: 'sr-iaas', label: 'IaaS: the customer patches the OS', done: 'The OS row is on Contoso’s side. In IaaS the customer patches the operating system.' },
        { m: 'paas', q: 'Contoso moves the app to Azure App Service (PaaS). Tap every layer Contoso still manages.', c: 'sr-paas', label: 'PaaS: the customer manages apps, identities and data', done: 'Only the app, identities and data remain. Microsoft now patches the OS and runtime.' },
        { m: 'saas', q: 'Contoso’s staff switch to Microsoft 365 (SaaS) for email. Tap every layer Contoso still manages.', c: 'sr-saas', label: 'SaaS: the customer keeps data and access', done: 'Even in SaaS the customer owns the data and decides who can access it.' }
      ];
      let ci = 0;
      const picked = new Set();
      const cWhy = AZ.whyBox();
      const cRows = L.map((l) => {
        const b = h('button', { type: 'button', class: 'sr-crow', 'aria-pressed': 'false' }, AZ.icon(l.icon), h('span', null, l.label), h('span', { class: 'sr-cmark' }));
        b.addEventListener('click', () => {
          if (b.classList.contains('locked')) return;
          const on = !picked.has(l.id);
          on ? picked.add(l.id) : picked.delete(l.id);
          b.setAttribute('aria-pressed', String(on));
        });
        return b;
      });
      const cq = h('p', { class: 'chal-q' });
      const cHead = h('div', { class: 'chal-k' });
      const checkBtn = AZ.btn('Check', check, { cls: 'primary', icon: 'check' });
      const nextBtn = AZ.btn('Next scenario', next, { cls: 'ghost', icon: 'arrowR' });
      nextBtn.hidden = true;
      root.append(h('div', { class: 'lab-grid chal-block' },
        h('div', { class: 'lab-main' }, AZ.part('Your turn', 'No hints: every layer starts neutral. Tap a layer to mark it “customer manages”.'),
          h('div', { class: 'sr-chal' }, cHead, cq, h('div', { class: 'sr-crows' }, cRows), h('div', { class: 'btn-row' }, checkBtn, nextBtn))),
        h('aside', { class: 'lab-side' }, cWhy)));
      function load() {
        const c = CH[ci];
        picked.clear();
        cRows.forEach((b) => { b.className = 'sr-crow'; b.setAttribute('aria-pressed', 'false'); b.querySelector('.sr-cmark').textContent = ''; });
        cHead.replaceChildren(AZ.icon('star'), 'Scenario ' + (ci + 1) + ' of ' + CH.length);
        cq.textContent = c.q;
        checkBtn.hidden = false; nextBtn.hidden = true;
        cWhy.set('Tap, then check', 'Mark what the customer manages. Everything you leave unmarked is Microsoft’s.');
      }
      function check() {
        const c = CH[ci];
        const you = AZ.YOU[c.m];
        let wrong = 0;
        cRows.forEach((b, i) => {
          const should = i < you;
          const mine = picked.has(L[i].id);
          b.classList.add('locked', should ? 'is-you' : 'is-ms');
          if (should !== mine) { wrong++; b.classList.add('bad'); }
          b.querySelector('.sr-cmark').textContent = should ? 'Customer' : 'Microsoft';
        });
        api.concept(c.c, wrong === 0, c.label);
        if (wrong === 0) cWhy.set('All layers right', c.done, 'ok');
        else cWhy.set(wrong + ' layer' + (wrong === 1 ? '' : 's') + ' off', c.done + ' Red outlines show the layers you marked differently.', 'bad');
        checkBtn.hidden = true;
        nextBtn.hidden = false;
        nextBtn.querySelector('span').textContent = ci < CH.length - 1 ? 'Next scenario' : 'Start over';
      }
      function next() { ci = (ci + 1) % CH.length; load(); }
      load();
    }
  });
})();

</script>
<script>/* js/m-global.js */
/* Module 7 — Azure global infrastructure: geography → region → availability zone → datacenter */
(function () {
  'use strict';
  const { h, s } = AZ;
  const LEVELS = ['world', 'geo', 'region', 'zone', 'dc'];
  const LNAME = { world: 'World', geo: 'Geography', region: 'Region', zone: 'Availability zone', dc: 'Datacenter' };
  const LDEF = {
    world: 'Azure divides the world into geographies.',
    geo: 'A market such as the United States. Usually two or more regions. Keeps data residency boundaries.',
    region: 'A set of datacenters in one area, linked by a low-latency network. You pick a region when you deploy.',
    zone: 'A physically separate location INSIDE a region, with its own power, cooling and networking.',
    dc: 'The physical building full of servers. You never pick a datacenter directly.'
  };
  const REGIONS = [
    ['wus2', 'West US 2', 58, 62, 0, -14, 'middle'],
    ['wus', 'West US', 40, 150, 10, 4, 'start'],
    ['wus3', 'West US 3', 96, 196, 0, 20, 'middle'],
    ['wcus', 'West Central US', 138, 104, 0, -14, 'middle'],
    ['cus', 'Central US', 206, 124, 0, 20, 'middle'],
    ['ncus', 'North Central US', 252, 84, 0, -14, 'middle'],
    ['scus', 'South Central US', 190, 220, 0, 20, 'middle'],
    ['eus', 'East US', 318, 132, -2, -14, 'end'],
    ['eus2', 'East US 2', 306, 180, 6, 20, 'end']
  ];
  const PAIRS = [['eus', 'wus'], ['eus2', 'cus'], ['ncus', 'scus'], ['wus2', 'wcus'], ['wus3', 'eus']];

  function hit(el, label, fn) {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', label);
    el.classList.add('gi-hit');
    el.addEventListener('click', fn);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } });
    return el;
  }
  function T(x, y, t, cls, anchor) { return s('text', { x, y, class: cls || 'gt', 'text-anchor': anchor || 'start' }, t); }

  function miniRZ(kind) {
    // small region/zone illustrations for exam choices
    const sp = { w: 160, h: 100, boxes: [], nodes: [], links: [], texts: [] };
    if (kind === 'az') {
      sp.boxes.push({ x: 6, y: 8, w: 148, h: 84, label: 'Region', cls: 'm-in' });
      [14, 62, 110].forEach((x, i) => sp.boxes.push({ x, y: 24, w: 38, h: 58, label: 'Z' + (i + 1), cls: 'm-hl' }));

      sp.boxes.push({ x: 6, y: 20, w: 62, h: 60, label: 'Region A', cls: 'm-in' }, { x: 92, y: 20, w: 62, h: 60, label: 'Region B', cls: 'm-in' });
      sp.nodes.push({ x: 37, y: 56, icon: 'vm', r: 10 }, { x: 123, y: 56, icon: 'vm', r: 10 });
      sp.links.push({ a: 0, b: 1, cls: 'dash' });

    } else if (kind === 'sov') {
      sp.boxes.push({ x: 20, y: 12, w: 120, h: 76, label: 'Isolated cloud', cls: 'm-hl dbl' });
      sp.nodes.push({ x: 80, y: 56, icon: 'lock', r: 13 });
    } else {
      sp.boxes.push({ x: 40, y: 12, w: 80, h: 76, label: 'One datacenter', cls: 'm-in' });

    return AZ.mini(sp);
  }

  AZ.register({
    id: 'global-infra', num: 7, domain: 'arch', icon: 'globe',
    title: 'Regions vs availability zones', short: 'Region vs availability zone',
    lede: 'Zoom from the whole world down to one datacenter. At the region level, fail a zone and then the whole region to see what each one protects against.',
    objectives: ['a1', 'a2', 'a3'],
    memory: [
      { term: 'Region', rule: 'A geographic area with one or more datacenters. You choose it when you deploy.', icon: 'map' },
      { term: 'Availability zone', rule: 'Separate physical locations INSIDE an Azure region.', icon: 'layers' },
      { term: 'Region pair', rule: 'Two regions in one geography, usually 300+ miles apart, paired for recovery.', icon: 'link' },
      { term: 'Sovereign region', rule: 'An isolated instance of Azure, e.g. Azure Government.', icon: 'lock' },
      { term: 'Datacenter', rule: 'The physical building. Zones contain one or more of them.', icon: 'building' }
    ],
    exams: [
      {
        id: 'geo-x1', concept: 'geo-az', pair: 'region-az', short: 'Survive a datacenter failure with low latency → availability zones',
        prompt: 'An app must keep running if one datacenter in its region loses power. Copies must stay close together with very low latency.',
        answer: 'az',
        why: 'Availability zones are separate locations inside one region, each with independent power, cooling and networking, joined by a low-latency network.',
        choices: [
          { id: 'az', label: 'Spread across availability zones', art: () => miniRZ('az'), note: 'Separate buildings, same region, low latency.' },
          { id: 'pair', label: 'Copy to the paired region', art: () => miniRZ('pair'), note: 'Protects against a whole-region outage, but hundreds of miles away.' },
          { id: 'sov', label: 'Use a sovereign region', art: () => miniRZ('sov'), note: 'Sovereign regions are about isolation and compliance, not failover.' },
          { id: 'one', label: 'Add VMs in the same datacenter', art: () => miniRZ('one'), note: 'If that building loses power, every VM goes with it.' }
        ]
      },
      {
        id: 'geo-x2', concept: 'geo-sov', short: 'Isolated Azure for government → sovereign region',
        prompt: 'A US government agency needs Azure services that are physically and logically isolated from public Azure.',
        answer: 'sov',
        why: 'Sovereign regions such as Azure Government are separate instances of Azure, isolated from the public cloud for compliance and legal needs.',
        choices: [
          { id: 'az', label: 'Availability zones', art: () => miniRZ('az'), note: 'Zones add resilience inside a public region; they don’t isolate you.' },
          { id: 'pair', label: 'Region pair', art: () => miniRZ('pair'), note: 'Pairs help disaster recovery, not isolation.' },
          { id: 'sov', label: 'Sovereign region', art: () => miniRZ('sov'), note: 'An isolated instance of Azure.' },
          { id: 'one', label: 'A dedicated datacenter', art: () => miniRZ('one'), note: 'Customers can’t choose or reserve a datacenter building.' }
        ]
      }
    ],
    render(root, api) {
      let level = 'world';
      let maxLevel = 0;
      let showPairs = false, showSov = false;
      let deploy = 'zones';
      let failed = null; // 'z1' | 'region'
      let failedOnce = false;
      const why = AZ.whyBox();
      const stage = h('div', { class: 'gi-stage' });
      const crumbs = h('ol', { class: 'gi-ladder', 'aria-label': 'Zoom level' });
      const side = h('div', { class: 'gi-ctl' });
      const sideAfter = h('div', { class: 'gi-ctl after' });
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, crumbs, stage, h('p', { class: 'gi-hint muted small' }, 'Tap the highlighted item to zoom in. Tap a level above to zoom out.')),
        h('aside', { class: 'lab-side' }, side, sideAfter, why)));

      function drawCrumbs() {
        crumbs.replaceChildren(...LEVELS.map((l, i) => {
          const b = h('button', { type: 'button', class: 'gi-step' + (l === level ? ' at' : '') + (i < LEVELS.indexOf(level) ? ' outer' : ''), disabled: i > maxLevel },
            h('span', { class: 'gi-step-n' }, LNAME[l]));
          if (l === level) b.setAttribute('aria-current', 'step');
          b.addEventListener('click', () => { if (l !== level) go(l); });
          return h('li', null, b);
        }));
      }

      /* ---------- scenes ---------- */
      function sceneWorld() {
        const sv = s('svg', { viewBox: '0 0 360 400', class: 'gi-svg', role: 'img', 'aria-label': 'World divided into Azure geographies' });
        const geos = ['United States', 'Europe', 'Asia Pacific', 'Canada', 'Brazil', 'Australia', 'Japan', 'United Kingdom'];
        geos.forEach((g, i) => {
          const x = i % 2 ? 188 : 12, y = 14 + Math.floor(i / 2) * 96;
          const us = i === 0;
          const grp = s('g', { class: 'gi-geo' + (us ? ' go' : '') });
          grp.append(s('rect', { x, y, width: 160, height: 84, rx: 12, class: 'gi-geo-box' }));
          grp.append(T(x + 12, y + 24, g, 'gt-b'));
          [0, 1, 2].forEach((k) => grp.append(s('circle', { cx: x + 22 + k * 20, cy: y + 56, r: 5, class: 'gi-dot' })));
          grp.append(T(x + 82, y + 60, 'regions', 'gt-s'));
          if (us) hit(grp, 'Zoom into the United States geography', () => go('geo', [x + 80, y + 42]));
          else grp.addEventListener('click', () => why.set(g, 'Every geography works the same way. Tap United States to zoom in.'));
          sv.append(grp);
        });
        return sv;
      }
      function sceneGeo() {
        const sv = s('svg', { viewBox: '0 0 360 400', class: 'gi-svg', role: 'img', 'aria-label': 'United States geography with Azure regions' });
        sv.append(s('rect', { x: 8, y: 8, width: 344, height: 262, rx: 16, class: 'gi-geo-box big' }));
        sv.append(T(20, 30, 'UNITED STATES · GEOGRAPHY', 'gt-k'));
        const pos = {};
        REGIONS.forEach((r) => (pos[r[0]] = [r[2], r[3]]));
        if (showPairs) {
          PAIRS.forEach(([a, b]) => {
            const [x1, y1] = pos[a], [x2, y2] = pos[b];
            const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 40;
            sv.append(s('path', { d: `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`, class: 'gi-pair' }));
          });
        }
        REGIONS.forEach(([id, name, x, y, dx, dy, an]) => {
          const g = s('g', { class: 'gi-pin' + (id === 'eus2' ? ' go' : '') });
          g.append(s('circle', { cx: x, cy: y, r: 20, class: 'gi-hitpad' }));
          g.append(s('circle', { cx: x, cy: y, r: id === 'eus2' ? 9 : 6, class: 'gi-pin-c' }));
          g.append(T(x + dx, y + dy, name, 'gt-pin', an));
          if (id === 'eus2') hit(g, 'Zoom into the East US 2 region', () => go('region', [x, y]));
          else g.addEventListener('click', () => why.set(name, 'A region: datacenters in one area. Tap East US 2 to look inside one.'));
          sv.append(g);
        });
        if (showPairs) sv.append(T(20, 258, 'Dashed arcs: region pairs', 'gt-s'));
        if (showSov) {
          const g = s('g', { class: 'gi-sov' });
          g.append(s('rect', { x: 8, y: 282, width: 344, height: 110, rx: 14, class: 'gi-sov-box' }));
          g.append(AZ.gIcon('lock', 26, 302, 18));
          g.append(T(42, 307, 'AZURE GOVERNMENT · SOVEREIGN', 'gt-k'));
          g.append(T(20, 326, 'Isolated instance of Azure for US government', 'gt-s'));
          [['US Gov Virginia', 70], ['US Gov Arizona', 180], ['US Gov Texas', 290]].forEach(([n, x]) => {
            g.append(s('circle', { cx: x, cy: 352, r: 6, class: 'gi-pin-c sov' }));
            g.append(T(x, 375, n, 'gt-pin', 'middle'));
          });
          sv.append(g);
        } else {
          sv.append(T(180, 300, 'Turn on “Sovereign regions” to see', 'gt-s', 'middle'));
          sv.append(T(180, 318, 'isolated clouds such as Azure Government', 'gt-s', 'middle'));
        }
        return sv;
      }
      function sceneRegion() {
        const sv = s('svg', { viewBox: '0 0 360 400', class: 'gi-svg', role: 'img', 'aria-label': 'East US 2 region containing three availability zones' });
        const regDown = failed === 'region';
        sv.append(s('rect', { x: 8, y: 8, width: 344, height: 288, rx: 16, class: 'gi-region' + (regDown ? ' down' : '') }));
        sv.append(T(22, 32, 'REGION · EAST US 2', 'gt-k'));
        sv.append(T(22, 50, 'one area · several datacenters', 'gt-s'));
        const zx = [20, 128, 236];
        zx.forEach((x, i) => {
          const z = 'z' + (i + 1);
          const down = regDown || failed === z;
          const g = s('g', { class: 'gi-zone' + (down ? ' down' : '') + (i === 0 ? ' go' : '') });
          g.append(s('rect', { x, y: 64, width: 104, height: 196, rx: 12, class: 'gi-zone-box' }));
          g.append(T(x + 52, 86, 'ZONE ' + (i + 1), 'gt-z', 'middle'));
          g.append(AZ.gIcon('building', x + 36, 116, 28, 'gi-bld'));
          g.append(AZ.gIcon('building', x + 68, 116, 28, 'gi-bld'));
          g.append(T(x + 52, 146, 'datacenters', 'gt-s', 'middle'));
          [['bolt', 30], ['gear', 52], ['vnet', 74]].forEach(([ic, dx]) => g.append(AZ.gIcon(ic, x + dx, 166, 15, 'gi-util')));
          g.append(T(x + 52, 188, 'own power,', 'gt-xs', 'middle'));
          g.append(T(x + 52, 200, 'cooling, network', 'gt-xs', 'middle'));
          const hasApp = deploy === 'zones' || i === 0;
          if (hasApp) {
            const ok = !down;
            g.append(s('rect', { x: x + 14, y: 214, width: 76, height: 32, rx: 8, class: 'gi-app ' + (ok ? 'ok' : 'bad') }));
            g.append(AZ.gIcon(ok ? 'vm' : 'x', x + 30, 230, 16));
            g.append(T(x + 42, 235, ok ? 'app' : 'down', 'gt-app'));
          }
          if (i === 0) hit(g, 'Zoom into availability zone 1', () => go('zone', [x + 52, 150]));
          sv.append(g);
        });
        sv.append(s('path', { d: 'M72 272 H288', class: 'gi-fiber' }));
        sv.append(T(180, 288, 'private fiber between zones · under 2 ms', 'gt-s', 'middle'));
        // paired region
        const pairUp = regDown;
        sv.append(s('rect', { x: 8, y: 310, width: 344, height: 82, rx: 14, class: 'gi-pairreg' + (pairUp ? ' live' : '') }));
        sv.append(T(22, 334, 'PAIRED REGION · CENTRAL US', 'gt-k'));
        sv.append(T(22, 352, pairUp ? 'Recovering here after the regional outage' : 'Standby copy for regional disasters', 'gt-s'));
        sv.append(s('rect', { x: 244, y: 330, width: 94, height: 34, rx: 8, class: 'gi-app ' + (pairUp ? 'warn' : 'idle') }));
        sv.append(AZ.gIcon(pairUp ? 'vm' : 'reset', 262, 347, 16));
        sv.append(T(276, 352, pairUp ? 'failover' : 'standby', 'gt-app'));
        return sv;
      }
      function sceneZone() {
        const sv = s('svg', { viewBox: '0 0 360 400', class: 'gi-svg', role: 'img', 'aria-label': 'Availability zone 1 containing two datacenters' });
        sv.append(s('rect', { x: 8, y: 8, width: 344, height: 384, rx: 16, class: 'gi-zone-box solo' }));
        sv.append(T(22, 32, 'AVAILABILITY ZONE 1 · EAST US 2', 'gt-k'));
        sv.append(T(22, 50, 'one or more datacenters', 'gt-s'));
        [[26, 'Datacenter A'], [190, 'Datacenter B']].forEach(([x, n], i) => {
          const g = s('g', { class: 'gi-dcb' + (i === 0 ? ' go' : '') });
          g.append(s('path', { d: `M${x} 300 V120 l72 -28 l72 28 V300 Z`, class: 'gi-dc-shape' }));
          for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) g.append(s('rect', { x: x + 24 + c * 36, y: 140 + r * 34, width: 22, height: 16, rx: 2, class: 'gi-win' }));
          g.append(T(x + 72, 324, n, 'gt-b', 'middle'));
          [['bolt', 40], ['gear', 72], ['vnet', 104]].forEach(([ic, dx]) => g.append(AZ.gIcon(ic, x + dx, 352, 16, 'gi-util')));
          if (i === 0) hit(g, 'Zoom into Datacenter A', () => go('dc', [x + 72, 200]));
          sv.append(g);
        });
        sv.append(T(180, 382, 'power · cooling · network', 'gt-s', 'middle'));
        return sv;
      }
      function sceneDC() {
        const sv = s('svg', { viewBox: '0 0 360 400', class: 'gi-svg', role: 'img', 'aria-label': 'Inside a datacenter: racks of servers' });
        sv.append(s('rect', { x: 8, y: 8, width: 344, height: 384, rx: 16, class: 'gi-dc-in' }));
        sv.append(T(22, 32, 'DATACENTER A · INSIDE', 'gt-k'));
        sv.append(T(22, 50, 'racks of physical servers', 'gt-s'));
        for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) {
          const x = 24 + c * 64, y = 68 + r * 160;
          sv.append(s('rect', { x, y, width: 52, height: 144, rx: 4, class: 'gi-rack' }));
          for (let k = 0; k < 8; k++) {
            sv.append(s('rect', { x: x + 5, y: y + 6 + k * 17, width: 42, height: 12, rx: 2, class: 'gi-srv' }));
            sv.append(s('circle', { cx: x + 12, cy: y + 12 + k * 17, r: 1.8, class: 'gi-led' + ((k + c + r) % 3 ? '' : ' blink') }));
          }
        }
        return sv;
      }
      const SCENES = { world: sceneWorld, geo: sceneGeo, region: sceneRegion, zone: sceneZone, dc: sceneDC };

      /* ---------- side controls per level ---------- */
      function drawSide() {
        const kids = [h('div', { class: 'gi-def' }, h('span', { class: 'ctl-k' }, LNAME[level]), h('p', null, LDEF[level]))];
        const NEXT = { world: ['geo', 'Zoom into United States'], geo: ['region', 'Zoom into East US 2'], region: ['zone', 'Zoom into zone 1'], zone: ['dc', 'Zoom into Datacenter A'] };
        const nav = h('div', { class: 'btn-row' });
        if (NEXT[level]) nav.append(AZ.btn(NEXT[level][1], () => { AZ.reveal(stage); go(NEXT[level][0]); }, { icon: 'search', cls: 'primary' }));
        if (level !== 'world') nav.append(AZ.btn('Zoom out', () => go(LEVELS[LEVELS.indexOf(level) - 1]), { icon: 'minus', cls: 'ghost' }));
        kids.push(nav);
        if (level === 'geo') {
          kids.push(h('div', { class: 'ctl-col' },
            AZ.toggle({ label: 'Region pairs', on: showPairs, onChange: (v) => { showPairs = v; redraw(); if (v) why.set('Region pairs', 'Most regions pair with another region in the same geography, usually at least 300 miles away. Updates roll out to one region of a pair at a time, and one region of each pair is prioritized for recovery in a wide outage.'); } }),
            AZ.toggle({ label: 'Sovereign regions', on: showSov, onChange: (v) => { showSov = v; redraw(); if (v) why.set('Sovereign regions', 'Isolated instances of Azure for compliance or legal needs — for example Azure Government for US agencies, and Azure in China operated by 21Vianet.'); } })));
        }
        if (level === 'region') {
          kids.push(h('div', { class: 'ctl-col after' },
            h('span', { class: 'ctl-k' }, 'Where the app runs'),
            AZ.seg({ label: 'App deployment', value: deploy, options: [{ id: 'one', label: 'Zone 1 only' }, { id: 'zones', label: 'All 3 zones' }], onChange: (v) => { deploy = v; failed = null; redraw(); explainFail(); } }),
            h('span', { class: 'ctl-k' }, 'Break something'),
            h('div', { class: 'btn-row' },
              AZ.btn('Fail zone 1', () => { failed = 'z1'; failedOnce = true; redraw(); explainFail(); AZ.reveal(stage); }, { cls: 'danger-ghost', icon: 'bolt' }),
              AZ.btn('Fail whole region', () => { failed = 'region'; failedOnce = true; redraw(); explainFail(); AZ.reveal(stage); }, { cls: 'danger-ghost', icon: 'warn' }),
              AZ.btn('Restore', () => { failed = null; redraw(); explainFail(); }, { cls: 'ghost', icon: 'reset' }))));
        }
        side.replaceChildren(...kids.filter((k) => !k.classList.contains('after')));
        sideAfter.replaceChildren(...kids.filter((k) => k.classList.contains('after')));
      }
      function explainFail() {
        if (!failed) { why.set('Region contains zones', 'The outer box is the REGION. The three inner boxes are AVAILABILITY ZONES — separate buildings inside it. Fail one to see the difference.'); return; }

      const modeSeg = AZ.seg({
        label: 'Scaling direction', value: 'out',
        options: [{ id: 'out', label: 'Horizontal (out)', icon: 'server' }, { id: 'up', label: 'Vertical (up)', icon: 'arrowD' }],

      const bAdd = AZ.btn('Add server', () => manual(+1), { icon: 'plus' });

      const sceneBox = h('div', { class: 'cv-box sc-scene' });
      const chartBox = h('div', { class: 'cv-box sc-chart' });

      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, readout,
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Traffic'), h('div', { class: 'btn-row' }, bSpike, bUp, bDown)),
          sceneBox,
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Capacity by hand'), h('div', { class: 'btn-row' }, bAdd, bRem)),
          h('div', { class: 'sc-legend', 'aria-hidden': 'true' },
            h('span', null, h('i', { class: 'lg demand' }), 'Demand (users)'),
            h('span', null, h('i', { class: 'lg cap' }), 'Capacity'),
            h('span', null, h('i', { class: 'lg short' }), 'Unmet demand'),
            h('span', null, h('i', { class: 'lg idle' }), 'Idle capacity you pay for')),
          chartBox),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Direction'), modeSeg),
          h('div', { class: 'ctl' }, tAuto),
          why)));

      function setTarget(v) {
        target = v;
        if (v === 10000 && !auto) why.set('10,000 users arriving', 'Watch the server load. The system can scale, but with autoscale off, someone has to add capacity.');
        if (v < demand && !auto && cap() > v * 2) setTimeout(() => { if (api.alive && !auto && cap() > demand * 2) why.set('Traffic dropped. Capacity didn’t.', 'Without autoscale, the extra servers keep running and you keep paying for them until someone removes them.', 'warn'); }, 1500);
      }

          return;

        if (m === 'up') { size = Math.max(0, SIZES.findIndex((z) => z.cap >= c)); if (size < 0) size = SIZES.length - 1; }

          ? 'One server gets more CPU and memory. Simple, but there is a ceiling, and resizing a VM usually means a restart.'
          : 'More servers share the load behind a load balancer. There is no single-machine ceiling.');
      }
      function labels() {
        bAdd.querySelector('span').textContent = mode === 'out' ? 'Add server' : 'Bigger server';
        bRem.querySelector('span').textContent = mode === 'out' ? 'Remove server' : 'Smaller server';
        bAdd.disabled = auto || (mode === 'out' ? servers >= 8 : size >= SIZES.length - 1);
        bRem.disabled = auto || (mode === 'out' ? servers <= 1 : size <= 0);
      }
      function manual(d) {
        if (mode === 'out') {
          const n = Math.max(1, Math.min(8, servers + d));
          if (n > servers) vis.push({ a: 0 });

        } else size = Math.max(0, Math.min(SIZES.length - 1, size + d));
        labels();
        if (d > 0 && demand > 5000 && cap() >= demand) why.set('That’s scalability', 'You added resources to meet demand. It worked — because someone was watching and clicked.', 'ok');
      }
      function setAuto(v) {
        auto = v;

        labels();
        why.set(v ? 'Autoscale on' : 'Autoscale off', v ? 'Rules now add a server when load passes 85% and remove one when load drops below 30%. Change the traffic and watch capacity follow.' : 'Back to manual. Capacity only changes when you click.', v ? 'info' : 'warn');
      }

      /* ---------- simulation ---------- */
      function step(dt) {

        if (auto) {

            else if (u < 0.3 && servers > 1) { servers--; flags.autoRemove = true; why.set('Elasticity: scaled in automatically', 'Load fell below 30%, so autoscale removed a server. You stop paying for it.', 'ok'); }

        vis = vis.filter((v, i) => i < servers || v.a > 0.02);

        histT += dt;
        let tickUi = false;

      }
      function drawScene(ctx, w, hh, t, dt) {
        step(dt);
        const C = { ink: AZ.tok('ink'), ink2: AZ.tok('ink-2'), line: AZ.tok('line'), surf: AZ.tok('surface-2'), cyan: AZ.tok('cyan'), az: AZ.tok('azure'), ok: AZ.tok('ok'), warn: AZ.tok('warn'), bad: AZ.tok('bad') };

        const load = demand / c;

        ctx.font = '600 12px Barlow, system-ui, sans-serif';
        ctx.fillText('USERS', L.ux, 20);
        ctx.fillStyle = C.ink;
        ctx.font = '700 22px "Barlow Semi Condensed", system-ui, sans-serif';
        ctx.fillText(AZ.fmt(demand), L.ux, 44);

          AZ.rr(ctx, L.lbx - 22, L.lby - 22, 44, 44, 10); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = C.ink2; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(L.lbx - 10, L.lby); ctx.lineTo(L.lbx + 10, L.lby - 9); ctx.moveTo(L.lbx - 10, L.lby); ctx.lineTo(L.lbx + 10, L.lby); ctx.moveTo(L.lbx - 10, L.lby); ctx.lineTo(L.lbx + 10, L.lby + 9); ctx.stroke();
          ctx.fillStyle = C.ink2; ctx.font = '600 11px Barlow, system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('Load', L.lbx, L.lby + 36); ctx.fillText('balancer', L.lbx, L.lby + 49); ctx.textAlign = 'left';
        }

        if (AZ.reduced) {
          const served = Math.min(1, c / demand);
          ctx.lineWidth = 2 + 10 * Math.min(1, Math.log10(demand / 100) / 2);
          ctx.strokeStyle = C.cyan; ctx.globalAlpha = 0.6;

        } else {
          const rate = 4 + 20 * Math.min(1, Math.max(0, (Math.log10(demand) - 2) / 2));

            ctx.globalAlpha = q.drop && q.p > 0.5 ? 1 - (q.p - 0.5) * 2 : 1;
            ctx.fillStyle = q.drop && q.p > 0.5 ? C.bad : C.cyan;
            ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
          });
          if (demand > c * 1.02) { ctx.fillStyle = C.bad; ctx.font = '700 12px Barlow, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('503 · rejected', hub[0] - 10, Math.min(hh - 8, hub[1] + 74)); ctx.textAlign = 'left'; }
        }
        // servers
        ctx.fillStyle = C.ink2; ctx.font = '600 12px Barlow, system-ui, sans-serif';
        ctx.fillText(mode === 'out' ? 'SERVERS · ' + servers : 'SIZE ' + SIZES[size].n + ' · ' + SIZES[size].cpu, L.sx, 20);
        rects.forEach((r) => {
          ctx.globalAlpha = r.a;
          ctx.fillStyle = C.surf; ctx.strokeStyle = load > 1 ? C.bad : load < 0.3 && c > PER ? C.warn : C.line; ctx.lineWidth = load > 1 ? 2.5 : 1.5;
          if (load < 0.3 && c > PER) ctx.setLineDash([5, 4]);
          AZ.rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
          const u = Math.min(1, load);
          const bh = Math.max(6, Math.min(14, r.h * 0.22));
          ctx.fillStyle = C.line; AZ.rr(ctx, r.x + 8, r.y + r.h - bh - 7, r.w - 16, bh, 3); ctx.fill();
          ctx.fillStyle = load > 1 ? C.bad : load > 0.8 ? C.warn : C.ok;
          AZ.rr(ctx, r.x + 8, r.y + r.h - bh - 7, Math.max(4, (r.w - 16) * u), bh, 3); ctx.fill();
          ctx.fillStyle = C.ink; ctx.font = '700 ' + (mode === 'up' ? 16 : 13) + 'px "Barlow Semi Condensed", system-ui, sans-serif';
          ctx.fillText((load > 1 ? '100%+' : Math.round(u * 100) + '%') + ' load', r.x + 8, r.y + (mode === 'up' ? 26 : Math.min(20, r.h - bh - 12)));
          ctx.globalAlpha = 1;
        });
      }
      /* ---------- drawing: timeline chart ---------- */
      function drawChart(ctx, w, hh) {
        const C = { ink2: AZ.tok('ink-2'), line: AZ.tok('line'), cyan: AZ.tok('cyan'), az: AZ.tok('azure'), bad: AZ.tok('bad'), warn: AZ.tok('warn') };

        const W = w - pad.l - pad.r, H = hh - pad.t - pad.b;
        const max = 12500;
        const X = (i) => pad.l + (i / 159) * W;
        const Y = (v) => pad.t + H - (Math.min(v, max) / max) * H;
        ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.fillStyle = C.ink2; ctx.font = '11px Barlow, system-ui, sans-serif'; ctx.textAlign = 'right';
        [0, 5000, 10000].forEach((v) => { ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke(); ctx.fillText(v ? v / 1000 + 'k' : '0', pad.l - 6, Y(v) + 4); });
        ctx.textAlign = 'left';
        ctx.fillText('last 40 seconds →', pad.l, hh - 4);
        const off = 160 - hist.length;
        for (let i = 1; i < hist.length; i++) {
          const a = hist[i - 1], b = hist[i];
          const x0 = X(off + i - 1), x1 = X(off + i);
          if (b.d > b.c) { ctx.fillStyle = C.bad; ctx.globalAlpha = 0.28; ctx.fillRect(x0, Y(b.d), x1 - x0 + 0.5, Y(b.c) - Y(b.d)); }
          else if (b.c > b.d * 1.6) { ctx.fillStyle = C.warn; ctx.globalAlpha = 0.18; ctx.fillRect(x0, Y(b.c), x1 - x0 + 0.5, Y(b.d) - Y(b.c)); }
          ctx.globalAlpha = 1;
        }
        const line = (key, color, stepwise, width) => {
          ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
          hist.forEach((p, i) => {
            const x = X(off + i), y = Y(p[key]);
            if (!i) ctx.moveTo(x, y);
            else if (stepwise) { ctx.lineTo(x, Y(hist[i - 1][key])); ctx.lineTo(x, y); }
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        };
        if (hist.length > 1) { line('c', C.az, true, 2.5); line('d', C.cyan, false, 2.5); }
      }

      const scene = AZ.canvas(sceneBox, { height: (w) => (w < 420 ? 250 : 280), draw: drawScene, label: 'Users sending requests through a load balancer to servers' });
      const chart = AZ.canvas(chartBox, { height: () => 150, draw: drawChart, label: 'Demand versus capacity over time' });
      api.onCleanup(() => { scene.destroy(); chart.destroy(); });
      labels();
    }
  });
})();

        ctl.append(h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Storage account uses'), sub), box);
        function draw() {
          flows.forEach((f) => f.destroy()); flows = []; stage.replaceChildren(); box.replaceChildren();
          const f = new AZ.Flow(stage, specEndpoint(priv)); flows.push(f);
          const bNet = AZ.btn('Request from the internet', async () => {
            busy([bNet, bVm], true);
            const ok = priv ? await f.send(['any', 'guard'], { blockAt: 'guard', blockText: 'Public access off' }) : await f.send(['any', 'st']);
            if (!f.alive) return;
            why.set(ok ? 'Reached from the internet' : 'Blocked from the internet', ok ? 'A public endpoint is reachable over the public network. Anyone with the address (and credentials) can try to connect.' : 'With a private endpoint and public access disabled, the service has no door on the internet.', ok ? 'warn' : 'ok');
            mark(priv ? 'pe-net' : 'pub-net');
            busy([bNet, bVm], false);
          }, { icon: 'globe' });
          const bVm = AZ.btn('Request from app-vm', async () => {
            busy([bNet, bVm], true);
            await f.send(priv ? ['vm', 'pe', 'st'] : ['vm', 'st'], { cls: priv ? 'priv' : '' });
            if (!f.alive) return;
            why.set(priv ? 'Stayed private' : 'Left the VNet', priv ? 'The VM called 10.0.1.5 — a private IP in its own subnet — and Private Link carried it to the service.' : 'The VM reached the service at its public endpoint, outside the VNet.', 'ok');
            mark(priv ? 'pe-vm' : 'pub-vm');
            busy([bNet, bVm], false);
          }, { icon: 'vm' });
          box.append(h('div', { class: 'btn-row' }, bNet, bVm));
          why.set(priv ? 'Private endpoint' : 'Public endpoint', priv ? 'The service gets a network interface with a private IP inside your VNet.' : 'The service is addressed by a public IP. Traffic can start from anywhere on the public network.');
        }
        draw();
      }

      /* ---------- scene: compare ---------- */
      function sceneCompare() {
        let pair = 'vpn-er';
        const sub = AZ.seg({ label: 'Comparison', value: pair, options: [{ id: 'vpn-er', label: 'VPN vs ExpressRoute' }, { id: 'pub-priv', label: 'Public vs private endpoint' }], onChange: (v) => { pair = v; draw(); } });
        const bBoth = AZ.btn('Send both', runBoth, { cls: 'primary', icon: 'play' });
        ctl.append(h('div', { class: 'ctl' }, sub), h('div', { class: 'ctl' }, bBoth));
        let cols = [];
        function draw() {
          flows.forEach((f) => f.destroy()); flows = []; stage.replaceChildren();
          const defs = pair === 'vpn-er'
            ? [['VPN Gateway', 'Encrypted tunnel · public internet', specVpn()], ['ExpressRoute', 'Private connection · no internet', specEr()]]
            : [['Public endpoint', 'Reachable from the public network', specEndpoint(false)], ['Private endpoint', 'Private IP inside your VNet', specEndpoint(true)]];
          const wrap = h('div', { class: 'split' });
          cols = defs.map(([t, sub2, spec]) => {
            const c = h('div', { class: 'split-col' }, h('div', { class: 'split-h' }, h('strong', null, t), h('span', null, sub2)));
            wrap.append(c);
            const f = new AZ.Flow(c, spec); flows.push(f);
            return f;
          });
          stage.append(wrap);
          why.set(pair === 'vpn-er' ? 'Same goal, different road' : 'Same service, different door', pair === 'vpn-er'
            ? 'Both connect on-premises to Azure. VPN encrypts traffic over the internet; ExpressRoute avoids the internet entirely.'
            : 'Public endpoint: anyone on the public network can reach it. Private endpoint: only traffic from your private network gets there.');
        }
        async function runBoth() {
          busy([bBoth], true);
          if (pair === 'vpn-er') {
            await Promise.all([cols[0].send(['srv', 'dev', 'net', 'gw', 'vm'], { lock: true, cls: 'enc' }), cols[1].send(['srv', 'rtr', 'ckt', 'gw', 'vm'], { cls: 'priv' })]);
          } else {
            await Promise.all([cols[0].send(['any', 'st']), cols[1].send(['any', 'guard'], { blockAt: 'guard', blockText: 'Public access off' })]);
            if (!api.alive) return;
            await Promise.all([cols[0].send(['vm', 'st']), cols[1].send(['vm', 'pe', 'st'], { cls: 'priv' })]);
          }
          if (!api.alive) return;
          mark('cmp-' + pair);
          busy([bBoth], false);
        }
        draw();
      }

      function show(v) {
        reset();
        ({ path: scenePath, connect: sceneConnect, endpoints: sceneEndpoints, compare: sceneCompare })[v]();
      }
      show('path');
    }
  });
})();
