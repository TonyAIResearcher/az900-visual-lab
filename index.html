<style>
/* AZ-900 Visual Lab — styles
   Palette: Azure blue, dark navy, white, soft gray, cyan highlights.
   Green = healthy/allowed · amber = warning · red = denied/broken only. */

/* design tokens live in skin.css */

/* ---------------- base ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 16px/1.5 var(--f-b);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { font-family: var(--f-d); line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--azure); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 200; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.ic { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.gi { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------- type + headings ---------------- */
.eyebrow { display: flex; align-items: center; gap: 8px; font: 600 13px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.mod-head { display: grid; gap: 10px; margin-bottom: 18px; }
.mod-title { font-size: clamp(30px, 5.2vw, 44px); font-weight: 700; letter-spacing: -.005em; }
.lede { font-size: 17.5px; color: var(--ink-2); max-width: 68ch; }
.objs { font-size: 14.5px; color: var(--ink-2); }
.objs summary { cursor: pointer; font-weight: 600; color: var(--ink-2); min-height: 32px; display: flex; align-items: center; }
.objs ul { margin: 6px 0 0; padding-left: 20px; }
.part-h { display: grid; gap: 4px; margin-bottom: 12px; }
.part-k { font: 700 22px var(--f-d); }
.part-hint { color: var(--ink-3); font-size: 15px; max-width: 68ch; }
.h3 { font-size: 18px; margin: 4px 0 10px; }
.err { color: var(--bad); font-weight: 600; }

/* ---------------- lab layout ---------------- */
.lab { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 18px; min-width: 0; }
.lab-grid { display: grid; gap: 16px; min-width: 0; }
.lab-main, .lab-side { min-width: 0; display: grid; gap: 14px; align-content: start; }
@media (max-width: 899px) {
  .lab-grid { display: flex; flex-direction: column; }
  .lab-side { display: contents; }
  .lab-main { order: 2; }
  .lab-side > * { order: 1; }
  .lab-side > .why, .lab-side > .after { order: 3; }
}
.chal-block { border-top: 1px solid var(--line); padding-top: 18px; }
@media (min-width: 900px) {
  .lab { padding: 20px; }
  .lab-grid { grid-template-columns: minmax(0, 1fr) minmax(270px, 340px); gap: 22px; }
  .lab-side { position: sticky; top: 76px; }
}
.mod-sec { margin-top: 28px; }
.mod-sec.two { display: grid; gap: 20px; }
@media (min-width: 900px) { .mod-sec.two { grid-template-columns: 1fr 1fr; } }

/* ---------------- controls ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font: 600 15px var(--f-b); text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--azure); border-color: var(--azure); color: var(--on-azure); }
.btn.primary:hover { background: var(--azure-2); border-color: var(--azure-2); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; font-size: 14px; padding: 0 12px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger-ghost:hover { background: var(--bad-soft); }
.btn.danger-ghost[aria-pressed="true"] { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl { display: grid; gap: 8px; }
.ctl-col { display: grid; gap: 10px; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.ctl-k { font: 700 12px var(--f-b); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-3); max-width: 100%; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14.5px; cursor: pointer; text-align: left; }
.seg-btn:hover { color: var(--ink); }
.seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(11, 31, 58, .14); }
.seg-btn[aria-pressed="true"] .ic { color: var(--azure); }
.seg-lg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.seg-lg .seg-btn { min-height: 46px; font: 700 18px var(--f-d); padding: 0 6px; justify-content: center; text-align: center; }
@media (max-width: 480px) { .seg-lg .seg-btn { font-size: 16px; } }

.tgl { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; }
.tgl-track { position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--line-2); flex: none; transition: background .2s; }
.tgl-thumb { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.tgl[aria-checked="true"] .tgl-track { background: var(--azure); }
.tgl[aria-checked="true"] .tgl-thumb { transform: translateX(18px); }

.sl { display: grid; gap: 4px; }
.sl-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px; }
.sl-out { font: 700 16px var(--f-d); font-variant-numeric: tabular-nums; }
.sl input { width: 100%; accent-color: var(--azure); min-height: 32px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font: 600 12.5px var(--f-b); background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.ok, .pill.st-done { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.st-seen { background: var(--azure-soft); color: var(--azure-2); }

/* why panel */
.why { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.why-k { display: flex; align-items: center; gap: 8px; font: 700 18px/1.2 var(--f-d); }
.why-k .ic { color: var(--azure); }
.why-b { color: var(--ink-2); font-size: 15.5px; }
.why.tone-ok { background: var(--ok-soft); border-color: transparent; }
.why.tone-ok .why-k .ic { color: var(--ok); }
.why.tone-bad { background: var(--bad-soft); border-color: transparent; }
.why.tone-bad .why-k .ic { color: var(--bad); }
.why.tone-warn { background: var(--warn-soft); border-color: transparent; }
.why.tone-warn .why-k .ic { color: var(--warn); }

/* ---------------- sorter chips ---------------- */
.tray { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.tray-hint { font-size: 14px; color: var(--ink-3); }
.tray-done { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ok); font-size: 15px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 8px 12px; max-width: 100%;
  border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
  box-shadow: var(--shadow); font-size: 15px; font-weight: 500; text-align: left; line-height: 1.3;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.chip[aria-pressed="true"] { border-color: var(--azure); background: var(--azure-soft); box-shadow: 0 0 0 2px var(--azure); }
.chip.missed { border-style: dashed; border-color: var(--bad); }
.chip.lifting { opacity: .35; }
.chip.placed { cursor: default; box-shadow: none; background: var(--ok-soft); border-color: transparent; color: var(--ink); font-size: 13.5px; min-height: 0; padding: 5px 8px; gap: 5px; width: 100%; }
.chip.placed .ic { color: var(--ok); }
.chip.placed.was-missed { background: var(--warn-soft); }
.chip.placed.was-missed .ic { color: var(--warn); }
.drag-ghost { position: fixed !important; left: 0; top: 0; z-index: 1000; pointer-events: none; margin: 0; opacity: .95; box-shadow: 0 12px 28px rgba(6, 17, 31, .3) !important; }
.drop { transition: outline-color .15s, background-color .15s; }
.drop.armed { outline: 2px dashed var(--azure); outline-offset: 3px; cursor: pointer; }
.drop.drop-over, [data-drop].drop-over { outline: 3px solid var(--azure); outline-offset: 3px; }
.nope { animation: nope .5s ease; outline: 3px solid var(--bad) !important; outline-offset: 3px; }
.yes { animation: yes .7s ease; }
.pop { animation: pop .5s ease; }
@keyframes nope { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes yes { 0% { box-shadow: 0 0 0 0 var(--ok); } 100% { box-shadow: 0 0 0 12px transparent; } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: none; } }

.chal { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; justify-items: start; }
.chal-k { display: flex; align-items: center; gap: 6px; font: 700 13px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--azure); }
.chal-q { font: 600 18px/1.3 var(--f-d); }

/* ---------------- hierarchy ---------------- */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ladder-step { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink-3); font: 600 13px/1.15 var(--f-d); letter-spacing: .02em; text-transform: uppercase; position: relative; min-width: 0; }
.ladder-step span { min-width: 0; }
@media (max-width: 560px) { .ladder { grid-template-columns: 1fr 1fr; } .ladder-step .ic { display: none; } }
.hz-bar { display: grid; gap: 8px; }
@media (max-width: 899px) { .hz-bar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 8; background: var(--surface); padding: 8px 0; border-bottom: 1px solid var(--line); } }
.ladder-step.on { background: var(--azure-soft); color: var(--ink); }
.ladder-step.at { background: var(--azure); color: #fff; }
.hz-tree { min-width: 0; }
.hz { border: 1.5px solid var(--line-2); border-radius: 14px; padding: 6px; display: grid; gap: 6px; background: var(--surface); transition: opacity .3s, background-color .3s, border-color .3s; min-width: 0; }
.hz-mg { background: var(--surface-2); }
.hz-rg { border-style: dashed; background: var(--surface-2); }
.hz-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 4px 6px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; flex-wrap: wrap; }
.hz-head:hover { background: var(--surface-3); }
.hz-head > .ic { width: 22px; height: 22px; color: var(--azure); }
.hz-hl { display: grid; line-height: 1.15; margin-right: auto; min-width: 0; }
.hz-kind { font: 600 11.5px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.hz-name { font: 700 18px var(--f-d); overflow-wrap: anywhere; }
.hz-rg .hz-name { font-family: var(--f-m); font-size: 14px; font-weight: 500; }
.hz-bill { display: inline-flex; align-items: center; gap: 3px; font: 600 12px var(--f-b); color: var(--ink-2); background: var(--surface-3); padding: 2px 8px; border-radius: 999px; }
.hz-subs, .hz-rgs { display: grid; gap: 8px; min-width: 0; }
.hz-tiles { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); padding: 2px; }
@media (min-width: 720px) { .hz-subs { grid-template-columns: 1fr 1fr; } .hz { padding: 8px; } }
.hz-res { display: grid; gap: 2px; align-content: start; text-align: left; padding: 8px; min-height: 62px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: opacity .3s, border-color .3s, background-color .3s; touch-action: none; min-width: 0; }
.hz-res:hover { border-color: var(--azure); }
.hz-rtop { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; min-width: 0; }
.hz-rtop .ic { color: var(--azure); }
.hz-rname { font-family: var(--f-m); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.hz-rtype { font-size: 12px; color: var(--ink-3); }
.hz.in, .hz-res.in { border-color: var(--azure); }
.hz.in { background: var(--azure-soft); }
.hz-res.in { background: var(--surface); box-shadow: inset 0 0 0 1px var(--azure); }
.hz.out > .hz-head, .hz-res.out { opacity: .38; }
.hz.sel { box-shadow: 0 0 0 3px var(--azure); }
.hz-res.sel { box-shadow: 0 0 0 3px var(--azure); }
.hz.pulse, .hz-res.pulse { animation: flowdown .8s ease both; }
@keyframes flowdown { 0% { background-color: var(--cyan-fill); } 100% { } }
.hz-res.moving { box-shadow: 0 0 0 3px var(--azure); transform: translateY(-2px); }
.hz.armed { outline: 2px dashed var(--azure); outline-offset: 2px; }
.hz.gone { opacity: .6; background: repeating-linear-gradient(135deg, var(--bad-soft) 0 8px, transparent 8px 16px); }
.hz-empty { font-size: 13px; color: var(--bad); padding: 6px; }
.hz-res.poof { animation: poof .5s ease forwards; }
@keyframes poof { to { transform: scale(.6); opacity: 0; } }
.hz-scope { font-size: 15px; display: flex; gap: 6px; }
.hz-scope strong { font-family: var(--f-m); font-weight: 500; }
.hz-scope .ctl-k { margin-right: 6px; }
.hz-assign { display: grid; gap: 8px; }
.bdgs { display: flex; flex-wrap: wrap; gap: 4px; }
.bdg { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 5px; border-radius: 999px; font: 600 12px/1.3 var(--f-b); border: 1.5px solid transparent; }
.bdg .ic { width: 13px; height: 13px; }
.bdg-policy { background: var(--cyan-fill); color: #052A38; border-color: var(--cyan-fill); }
.bdg-rbac { background: var(--azure); color: #fff; border-color: var(--azure); }
.bdg-lock { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bdg.inh { background: transparent; border-style: dashed; color: var(--ink); }
.bdg-policy.inh { border-color: var(--cyan); }
.bdg-rbac.inh { border-color: var(--azure); }
.bdg-lock.inh { border-color: var(--ink-2); }
.bdg-new { animation: bdgin .5s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes bdgin { from { transform: scale(.2) translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.as-policy .ic { color: var(--cyan); }
.as-rbac .ic { color: var(--azure); }

/* ---------------- service models ---------------- */
.sm-wrap { display: grid; grid-template-columns: minmax(96px, 1.25fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: start; }
@media (min-width: 700px) { .sm-wrap { gap: 12px; } }
.sm-col { display: grid; gap: 3px; padding: 4px; border: 2px solid transparent; border-radius: 14px; align-content: start; min-width: 0; }
.sm-roof { height: 86px; margin-bottom: 4px; border-radius: 12px 12px 4px 4px; background: var(--navy); color: #E8F1FB; display: grid; align-content: center; justify-items: center; text-align: center; padding: 6px 4px; gap: 1px; }
.sm-roof-blank { background: none; color: var(--ink-2); align-content: end; justify-items: start; gap: 4px; }
.sm-name { font: 700 22px/1 var(--f-d); }
.sm-tag { font-size: 11.5px; line-height: 1.2; opacity: .85; overflow-wrap: anywhere; }
.sm-count { font: 700 12.5px var(--f-b); color: #50E6FF; }
.sm-lab { height: 30px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); line-height: 1.1; min-width: 0; }
.sm-lab .ic { color: var(--ink-3); width: 16px; height: 16px; }
.sm-floor { height: 30px; border-radius: 3px; transition: outline-color .2s; }
.sm-floor.you { background: var(--you); }
.sm-floor.ms { background: var(--ms); }
.sm-floor.edge { box-shadow: 0 3px 0 0 var(--ink); }
.sm-floor.spot { outline: 3px solid var(--ink); outline-offset: -3px; animation: spot .9s ease 2; }
@keyframes spot { 50% { transform: scaleX(1.06); } }
.sm-slot { display: grid; gap: 4px; margin-top: 6px; }
.sm-bld { cursor: default; }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.lg { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
.lg.you { background: var(--you); }
.lg.ms { background: var(--ms); }
@media (max-width: 520px) {
  .sm-lab { font-size: 12px; }
  .sm-name { font-size: 20px; }
  .sm-tag { display: none; }
  .sm-roof { height: 64px; }
}

/* ---------------- shared responsibility ---------------- */
.sr-stack { background: var(--surface-2); border-radius: 14px; padding: 10px; }
.sr-heads { display: flex; justify-content: space-between; margin-bottom: 6px; }
.sr-h { font: 700 15px var(--f-d); letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.sr-h.you { background: var(--you); color: var(--you-ink); }
.sr-h.ms { background: var(--ms); color: var(--ms-ink); }
.sr-row { height: 42px; margin: 4px 0; }
.sr-tile { width: 60%; height: 100%; border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 600; font-size: 15px; background: var(--you); color: var(--you-ink); transition: transform .6s cubic-bezier(.3, .7, .2, 1), background-color .6s; min-width: 0; }
.sr-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-row.ms .sr-tile { transform: translateX(66.667%); background: var(--ms); color: var(--ms-ink); }
.sr-pin { margin-left: auto; font: 700 10.5px var(--f-b); letter-spacing: .06em; text-transform: uppercase; background: rgba(5, 42, 56, .12); padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
@media (max-width: 480px) { .sr-tile { width: 64%; font-size: 14px; } .sr-row.ms .sr-tile { transform: translateX(56.25%); } .sr-pin { display: none; } }
.sr-count { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.sr-count strong { font: 700 18px var(--f-d); }
.sr-split { --split: 100%; position: relative; height: 12px; border-radius: 6px; background: var(--ms); overflow: hidden; }
.sr-bar-you { position: absolute; inset: 0 auto 0 0; width: var(--split); background: var(--you); transition: width .6s; }
.sr-chal { display: grid; gap: 10px; }
.sr-crows { display: grid; gap: 4px; }
.sr-crow { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1.5px dashed var(--line-2); background: var(--surface); text-align: left; cursor: pointer; font-weight: 600; font-size: 15px; }

/* ---------------- global infrastructure ---------------- */
.gi-ladder { list-style: none; margin: 0; padding: 0 0 4px; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px; align-items: center; scrollbar-width: thin; }

.gi-step { min-height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 700 14px var(--f-d); letter-spacing: .03em; text-transform: uppercase; cursor: pointer; color: var(--ink-2); }
.gi-step.at { background: var(--azure); border-color: var(--azure); color: #fff; }
.gi-step.outer { color: var(--ink); }
.gi-step:disabled { opacity: .45; cursor: default; }
.gi-stage { position: relative; width: 100%; max-width: 540px; aspect-ratio: 360 / 400; margin: 0 auto; overflow: hidden; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }

.gi-hint { text-align: center; }
.gi-def { display: grid; gap: 4px; }
.gi-def p { font-size: 15px; color: var(--ink-2); }
.gt { font: 500 12px var(--f-b); fill: var(--ink-2); }
.gt-b { font: 700 16px var(--f-d); fill: var(--ink); }
.gt-s { font: 500 11.5px var(--f-b); fill: var(--ink-3); }
.gt-xs { font: 500 10.5px var(--f-b); fill: var(--ink-3); }
.gt-k { font: 700 13px var(--f-d); letter-spacing: .06em; fill: var(--ink); }
.gt-z { font: 700 14px var(--f-d); letter-spacing: .06em; fill: var(--ink); }
.gt-pin { font: 600 11.5px var(--f-b); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.gt-app { font: 700 12px var(--f-b); fill: var(--ink); }
.gi-svg .gi { color: var(--ink-2); }
.gi-geo-box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; }
.gi-geo-box.big { fill: var(--surface); }
.gi-geo.go .gi-geo-box { fill: var(--azure-soft); stroke: var(--azure); stroke-width: 2.5; }
.gi-dot { fill: var(--azure); }
.gi-hit { cursor: pointer; }
.gi-hit:focus { outline: none; }
.gi-hit:focus-visible .gi-geo-box, .gi-hit:focus-visible .gi-zone-box, .gi-hit:focus-visible .gi-pin-c, .gi-hit:focus-visible .gi-dc-shape { stroke: var(--focus); stroke-width: 4; }
.gi-pin-c { fill: var(--azure); stroke: var(--surface); stroke-width: 2; }
.gi-pin.go .gi-pin-c { fill: var(--cyan-fill); stroke: var(--ink); stroke-width: 2.5; animation: ping 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 50% { transform: scale(1.25); } }
.gi-pin-c.sov { fill: var(--ink-2); }
.gi-pin { cursor: pointer; }
.gi-hitpad { fill: transparent; stroke: none; }
.gi-pair { fill: none; stroke: var(--cyan); stroke-width: 2.2; stroke-dasharray: 6 5; }
.gi-sov-box { fill: var(--surface); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 3; }
.gi-sov .gi { color: var(--ink); }
.gi-region { fill: var(--azure-soft); stroke: var(--azure); stroke-width: 2.5; }
.gi-region.down { fill: var(--bad-soft); stroke: var(--bad); stroke-dasharray: 7 5; }
.gi-zone-box { fill: var(--surface); stroke: var(--azure); stroke-width: 1.6; }
.gi-zone-box.solo { fill: var(--surface); stroke-width: 2.5; }
.gi-zone.go .gi-zone-box { stroke-width: 2.5; }
.gi-zone.down .gi-zone-box { fill: var(--bad-soft); stroke: var(--bad); stroke-dasharray: 6 4; }
.gi-svg .gi-bld { color: var(--azure); }
.gi-zone.down .gi-bld { color: var(--bad); }
.gi-svg .gi-util { color: var(--ink-3); }
.gi-app { stroke-width: 1.8; }
.gi-app.ok { fill: var(--ok-soft); stroke: var(--ok); }
.gi-app.bad { fill: var(--bad-soft); stroke: var(--bad); }
.gi-app.warn { fill: var(--warn-soft); stroke: var(--warn); }
.gi-app.idle { fill: var(--surface); stroke: var(--line-2); stroke-dasharray: 4 3; }
.gi-fiber { stroke: var(--cyan); stroke-width: 3; stroke-dasharray: 2 5; stroke-linecap: round; fill: none; }
.gi-pairreg { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 6 4; }
.gi-pairreg.live { fill: var(--warn-soft); stroke: var(--warn); }
.gi-dc-shape { fill: var(--surface); stroke: var(--azure); stroke-width: 2; }
.gi-win { fill: var(--cyan-soft); stroke: var(--line-2); stroke-width: 1; }
.gi-dc-in { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; }
.gi-rack { fill: var(--surface-3); stroke: var(--line-2); stroke-width: 1.2; }
.gi-srv { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.gi-led { fill: var(--ok); }
.gi-led.blink { animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ---------------- scaling ---------------- */
.cv-box { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cv { display: block; }
.sc-read { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .sc-read { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sc-stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; min-width: 0; }
.sc-k { font: 700 11.5px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.sc-v { font: 700 21px/1.15 var(--f-d); font-variant-numeric: tabular-nums; }
.sc-stat.ok .sc-v { color: var(--ok); }
.sc-stat.warn .sc-v { color: var(--warn); }
.sc-stat.bad .sc-v { color: var(--bad); }
.sc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); }

.lg.demand { background: var(--cyan); height: 4px; }
.lg.cap { background: var(--azure); height: 4px; }
.lg.short { background: var(--bad); opacity: .45; }
.lg.idle { background: var(--warn); opacity: .35; }

/* ---------------- flow diagrams ---------------- */
.net-tabs .seg { width: 100%; }
.net-rail { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.net-rail[hidden] { display: none; }
.net-step { font: 700 13px var(--f-d); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); transition: background .3s, color .3s; }
.net-step + .net-step::before { content: '→ '; }
.net-step.on { background: var(--azure-soft); color: var(--ink); }
.net-step.at { background: var(--azure); color: #fff; }
.net-stage { width: 100%; max-width: 480px; margin: 0 auto; }
.flow { display: block; width: 100%; height: auto; }
.fz-box { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.fz-internet .fz-box { fill: var(--surface-2); stroke: var(--ink-3); stroke-dasharray: 6 5; }
.fz-azure .fz-box { fill: var(--azure-soft); stroke: var(--azure); }
.fz-vnet .fz-box { fill: var(--surface); stroke: var(--cyan); stroke-width: 2.2; }
.fz-subnet .fz-box { fill: var(--cyan-soft); stroke: var(--cyan); stroke-dasharray: 5 4; }
.fz-onprem .fz-box { fill: var(--surface-3); stroke: var(--ink-3); }
.fz-provider .fz-box { fill: var(--surface-2); stroke: var(--ink-2); stroke-dasharray: 3 3; }
.fz.off { opacity: .35; }
.fz-label { font: 700 12.5px var(--f-d); letter-spacing: .08em; fill: var(--ink-2); }
.fz-sub { font: 500 10.5px var(--f-m); fill: var(--ink-3); }
.fn-box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
.fn-user .fn-box, .fn-net .fn-box { fill: var(--surface-2); }
.fn-edge .fn-box { stroke: var(--azure); stroke-width: 2; }
.fn-svc .fn-box { stroke: var(--cyan); stroke-width: 2; }
.fn-ghost { display: none; }
.fn.dim { opacity: .45; }
.fn-label { font: 600 13px var(--f-b); fill: var(--ink); }
.fn-sub { font: 500 10.5px var(--f-m); fill: var(--ink-3); }
.flow .fn-ic { color: var(--azure); }
.fn.is-off { opacity: .3; }
.fn.hit .fn-box { animation: hit .6s ease; }
@keyframes hit { 0% { stroke: var(--ok); stroke-width: 4; fill: var(--ok-soft); } 100% { } }
.fl-line { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linejoin: round; }
.fl-thin .fl-line { stroke-width: 1.5; stroke-dasharray: 3 4; }
.fl-tunnel .fl-tube { fill: none; stroke: var(--cyan); stroke-opacity: .22; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
.fl-tunnel .fl-line { stroke: var(--cyan); stroke-dasharray: 7 5; stroke-width: 2.4; }
.fl-private .fl-tube { fill: none; stroke: var(--azure); stroke-opacity: .22; stroke-width: 12; stroke-linejoin: round; stroke-linecap: round; }
.fl-private .fl-line { stroke: var(--azure); stroke-width: 3.5; }
.fl.is-off .fl-line { stroke: var(--line-2); stroke-dasharray: 4 6; stroke-width: 2; }
.fl.is-off .fl-tube, .fl.is-off .fl-label { display: none; }
.fl-label, .pkt-text, .burst-t, .fx-note { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.fl-label { font: 600 11.5px var(--f-b); fill: var(--ink-2); }
.pkt-dot { fill: var(--cyan); stroke: var(--surface); stroke-width: 2; }
.pkt-halo { fill: var(--cyan); opacity: .25; }
.pkt.reply .pkt-dot, .pkt.reply .pkt-halo { fill: var(--ok); }
.pkt.priv .pkt-dot, .pkt.priv .pkt-halo { fill: var(--azure); }
.pkt .gi { color: var(--ink); }
.pkt-text { font: 500 11px var(--f-m); fill: var(--ink); }
.pkt.dead { animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 0; } }
.burst-c { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2; }
.burst .gi { color: var(--bad); stroke-width: 2.6; }
.burst-t { font: 700 12.5px var(--f-b); fill: var(--bad); }
.fx-note { font: 700 12px var(--f-b); fill: var(--ink); }
.split { display: grid; gap: 16px; }
@media (min-width: 760px) { .split { grid-template-columns: 1fr 1fr; } }
.split-col { min-width: 0; display: grid; gap: 6px; align-content: start; }
.split-h { display: grid; }
.split-h strong { font: 700 20px var(--f-d); }
.split-h span { font-size: 14px; color: var(--ink-2); }
.net-stage:has(.split) { max-width: none; }

/* ---------------- redundancy ---------------- */
.rd-map { display: grid; gap: 6px; }
.rd-region { border: 2px solid var(--azure); border-radius: 14px; padding: 10px; background: var(--azure-soft); display: grid; gap: 8px; transition: opacity .4s; }
.rd-region.sec { border-style: dashed; }
.rd-region.inactive { opacity: .3; }
.rd-region-h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.rd-k { font: 700 14px var(--f-d); letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
.rd-zones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rd-zones.one { grid-template-columns: minmax(0, 1fr); max-width: 220px; }
.rd-zone { background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 10px; padding: 6px; display: grid; gap: 6px; min-width: 0; }
.rd-zone.plain { border: 0; padding: 0; background: none; }
.rd-zone-h { font: 700 14px var(--f-d); letter-spacing: .05em; text-transform: uppercase; }
.rd-dc { border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--surface-2); display: grid; gap: 6px; }
.rd-dc-h { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; min-width: 0; }
.rd-dc-h span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rd-disks { display: grid; gap: 4px; }
.rd-disk { position: relative; height: 34px; border: 1.5px dashed var(--line-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.rd-disk-l { font-size: 11px; color: var(--ink-3); }
.rd-disk:has(.rd-copy:not([hidden])) .rd-disk-l { display: none; }
.rd-copy { display: inline-grid; place-items: center; width: 32px; height: 26px; border-radius: 6px; background: var(--azure); color: #fff; }
.rd-copy .ic { width: 16px; height: 16px; }
.rd-copy.lost { background: var(--bad); opacity: .55; }
.rd-copy.lost::after { content: ''; position: absolute; width: 36px; height: 2px; background: var(--bad); transform: rotate(-25deg); }
.rd-region.down, .rd-zone.down, .rd-dc.down { background: repeating-linear-gradient(135deg, var(--bad-soft) 0 8px, var(--surface) 8px 15px); border-color: var(--bad); }
.rd-disk.down { border-color: var(--bad); border-style: solid; }
.rd-repl { display: flex; align-items: center; gap: 8px; justify-content: center; opacity: .2; transition: opacity .4s; height: 34px; }
.rd-repl.on { opacity: 1; }
.rd-repl-line { width: 3px; height: 34px; background: repeating-linear-gradient(to bottom, var(--cyan) 0 5px, transparent 5px 9px); background-size: 3px 18px; }
.rd-repl.on .rd-repl-line { animation: dash 1s linear infinite; }
@keyframes dash { to { background-position: 0 18px; } }
.rd-repl-t { font: 600 13px var(--f-b); color: var(--ink-2); }
.rd-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 16px; background: var(--surface-2); }
.rd-banner .ic { width: 22px; height: 22px; }
.rd-banner.ok { background: var(--ok-soft); }
.rd-banner.ok .ic { color: var(--ok); }
.rd-banner.warn { background: var(--warn-soft); }
.rd-banner.warn .ic { color: var(--warn); }
.rd-banner.bad { background: var(--bad-soft); }
.rd-banner.bad .ic { color: var(--bad); }
.rd-tablewrap { overflow-x: auto; display: grid; gap: 6px; }
.rd-table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.rd-table th, .rd-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); }
.rd-table th[scope="row"] { text-align: left; font: 700 15px var(--f-d); }
.rd-table thead th { font: 700 11.5px var(--f-b); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.rd-cell { display: inline-block; min-width: 58px; padding: 2px 6px; border-radius: 999px; font-weight: 600; font-size: 12.5px; }
.rd-cell.q { background: var(--surface-3); color: var(--ink-3); }
.rd-cell.ok { background: var(--ok-soft); color: var(--ok); }
.rd-cell.failover { background: var(--warn-soft); color: var(--warn); }
.rd-cell.down { background: var(--bad-soft); color: var(--bad); }

/* ---------------- authentication vs authorization ---------------- */
.az-bld { background: var(--surface-2); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.az-band { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; border-radius: 10px; }
.az-band.authn { background: var(--azure); color: #fff; }
.az-band.authz { background: var(--card-strong); color: #E8F1FB; }
.az-band-k { font: 700 19px var(--f-d); letter-spacing: .06em; text-transform: uppercase; }
.az-band-q { font: 600 19px var(--f-d); }
.az-band-s { font-size: 13px; opacity: .85; margin-left: auto; }
.az-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }
.az-out { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 10px; min-height: 120px; display: grid; align-content: start; gap: 6px; }
.az-zone-k { font: 700 12px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.az-person { display: inline-grid; justify-items: center; gap: 2px; font-weight: 700; transition: transform .8s cubic-bezier(.3, .7, .2, 1), opacity .5s; justify-self: center; }
.az-person .ic { width: 40px; height: 40px; color: var(--azure); }
.az-person.walking { transform: translateX(30%); }
.az-person.in { opacity: .35; }
.az-person.rejected .ic { color: var(--bad); }
.az-person.rejected { animation: nope .5s ease; }
.az-gate { border: 2px solid var(--azure); border-radius: 12px; overflow: hidden; background: var(--surface); display: grid; }
.az-gate-top { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--azure); color: #fff; font: 700 15px var(--f-d); }
.az-gate-door { display: grid; place-items: center; padding: 14px 8px; text-align: center; }
.az-gate-state { font: 700 19px var(--f-d); }
.az-gate.checking .az-gate-door { animation: scan 1s ease infinite; }
@keyframes scan { 50% { background: var(--azure-soft); } }
.az-gate.pass { border-color: var(--ok); }
.az-gate.pass .az-gate-top { background: var(--ok); }
.az-gate.pass .az-gate-state { color: var(--ok); }
.az-gate.fail { border-color: var(--bad); }
.az-gate.fail .az-gate-top { background: var(--bad); }
.az-gate.fail .az-gate-state { color: var(--bad); }
.az-hall { border: 1.5px solid var(--line-2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; background: var(--surface); transition: opacity .4s, border-color .4s; }
.az-hall.lit { border-color: var(--ok); }
.az-hall.never { opacity: .5; background: repeating-linear-gradient(135deg, var(--surface-3) 0 8px, var(--surface) 8px 16px); }
.az-badge { display: flex; align-items: center; gap: 8px; background: var(--ok-soft); border-radius: 8px; padding: 6px 10px; font-size: 14.5px; }
.az-badge .ic { color: var(--ok); }
.az-doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .az-doors { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.az-door { display: grid; justify-items: center; gap: 4px; min-height: 104px; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--surface-2); cursor: pointer; transition: background .3s, border-color .3s; }
.az-door:disabled { cursor: not-allowed; opacity: .6; }
.az-door-ic .ic { width: 28px; height: 28px; color: var(--ink-2); }
.az-door-l { font: 700 18px var(--f-d); }
.az-door-st { display: inline-flex; align-items: center; gap: 4px; font: 700 12px var(--f-b); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.az-door.open { background: var(--ok-soft); border-color: var(--ok); animation: pop .4s ease; }
.az-door.open .az-door-st, .az-door.open .az-door-ic .ic { color: var(--ok); }
.az-door.denied { background: var(--bad-soft); border-color: var(--bad); animation: nope .45s ease; }
.az-door.denied .az-door-st, .az-door.denied .az-door-ic .ic { color: var(--bad); }

/* ---------------- RBAC / Policy / Lock ---------------- */
.cg-pipe { display: grid; gap: 18px; }
.cg-req, .cg-gate, .cg-target { position: relative; border-radius: 12px; padding: 10px 12px; }
.cg-gate::before, .cg-target::before { content: ''; position: absolute; left: 50%; top: -17px; width: 2px; height: 14px; background: var(--line-2); }
.cg-req { background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.cg-req-k { font: 700 12px var(--f-b); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.cg-req-b { display: flex; align-items: center; gap: 6px; font-size: 15px; flex-wrap: wrap; }
.cg-gate { border: 2px solid var(--line-2); background: var(--surface); display: grid; gap: 4px; transition: border-color .3s, background .3s, opacity .3s; }
.cg-top { display: flex; align-items: center; gap: 8px; font: 700 19px var(--f-d); }
.cg-top .ic { width: 22px; height: 22px; }
.cg-rbac .cg-top .ic { color: var(--azure); }
.cg-policy .cg-top .ic { color: var(--cyan); }
.cg-lock .cg-top .ic { color: var(--ink); }
.cg-q { font: 600 15px var(--f-d); letter-spacing: .03em; color: var(--ink-2); text-transform: uppercase; }
.cg-rule { font-size: 13.5px; color: var(--ink-3); }
.cg-res { display: flex; align-items: flex-start; gap: 6px; font-weight: 600; font-size: 14.5px; }
.cg-res:empty { display: none; }
.cg-gate.checking { border-color: var(--azure); box-shadow: 0 0 0 4px var(--azure-soft); }
.cg-gate.pass { border-color: var(--ok); }

/* ---------------- memory cards ---------------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

}

/* compute */

.pt-ic { width: 38%; height: auto; max-width: 84px; stroke-width: 1.15; color: var(--ink); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.pt:hover .pt-img, .pt:focus-visible .pt-img { background: var(--ink); }
.pt:hover .pt-ic, .pt:focus-visible .pt-ic { color: var(--ground); transform: scale(1.08); }
.pt-mk { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background: var(--c); }
.pt-tag { position: absolute; top: 7px; left: 7px; padding: 3px 5px; background: var(--ground); color: var(--ink); font: 500 9px/1 var(--f-m); letter-spacing: .06em; text-transform: uppercase; }
.pt-tag.ok { background: var(--ok); color: #fff; }
.pt-tag.hot { top: auto; bottom: 7px; }
.pt-k { font: 500 9.5px/1.2 var(--f-m); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.pt-t { font: 500 16px/1.2 var(--f-h); letter-spacing: -.01em; }
.pt-m { display: grid; gap: 5px; font: 500 9.5px/1.3 var(--f-m); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.pt-bar { display: block; height: 2px; background: var(--line); }
.pt-bar i { display: block; height: 100%; background: var(--c); }
.st-done .pt-t::after { content: ' ✓'; color: var(--ok); }

.kps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 900px) { .kps { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
.kp { display: grid; gap: 4px; align-content: start; padding: 12px; min-height: 120px; background: var(--surface-2); border: 1px solid transparent; color: var(--ink); text-decoration: none; text-align: left; cursor: pointer; font: inherit; border-radius: 0; }
.kp-k { font: 500 10.5px var(--f-m); letter-spacing: .07em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.kp-k::before { content: ''; width: 5px; height: 5px; border: 1px solid currentColor; }
.kp-v { font: 500 clamp(36px, 5vw, 58px)/1 var(--f-h); letter-spacing: -.04em; margin-top: auto; }
.kp-s { display: flex; align-items: center; justify-content: space-between; gap: 6px; font: 500 10px var(--f-m); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.kp-s .ic { width: 14px; height: 14px; color: var(--ink); transition: transform .2s; }
.kp:hover { border-color: var(--ink); }
.kp[aria-expanded="true"] { background: var(--ink); color: var(--ground); }
.kp[aria-expanded="true"] .kp-s, .kp[aria-expanded="true"] .kp-s .ic { color: inherit; }
.kp[aria-expanded="true"] .kp-s .ic { transform: rotate(180deg); }
.kp-panel { margin-top: 12px; padding: 14px; border: 1px solid var(--ink); background: var(--surface); scroll-margin-top: calc(var(--top-h) + 12px); }
.kp-panel .band-h { border: 0; padding: 0; margin-bottom: 4px; }
.kp-panel .band-t { font: 500 clamp(22px, 3vw, 30px)/1.1 var(--f-h); letter-spacing: -.025em; text-transform: none; }
.kp-panel .band-t::before { display: none; }
.kp-desc { color: var(--ink-2); margin-bottom: 12px; font-size: 15px; }

/* ---------------- progress report ---------------- */
.pg-top { display: grid; gap: 24px; margin-bottom: 18px; }
@media (min-width: 900px) { .pg-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: end; } }
.pg-bigwrap { display: grid; gap: 4px; }
.pg-big { display: flex; align-items: flex-start; }
.pg-num { font: 400 clamp(110px, 22vw, 240px)/0.82 var(--f-h); letter-spacing: -.06em; }
.pg-pct { font: 400 clamp(32px, 5vw, 56px)/1 var(--f-h); margin-top: .2em; }
.pg-doms { display: grid; gap: 8px; }
.pg-dom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px; background: var(--surface-2); border: 1px solid transparent; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.pg-dom:hover { border-color: var(--ink); }
.pg-dom[aria-expanded="true"] { border-color: var(--ink); background: var(--surface); }
.pg-dom-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.pg-dom-h strong { font: 500 17px/1.2 var(--f-h); letter-spacing: -.01em; }
.pg-dom-h .mono { font-size: 10px; color: var(--ink-3); }
.pg-dom.weak .pg-dom-h .mono { color: var(--bad); }
.pg-dom-v { font: 500 34px/1 var(--f-h); letter-spacing: -.04em; grid-row: span 2; align-self: center; }
.pg-dom-v small { font-size: 16px; }
.pg-bar { display: block; height: 6px; background: var(--line); grid-column: 1; }
.pg-bar i { display: block; height: 100%; background: var(--c); }
.pg-facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 10px var(--f-m); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.pg-facts b { color: var(--ink); font-weight: 500; }

/* ---------------- module pager ---------------- */
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 48px; }
.pager-a { position: relative; display: grid; gap: 8px; align-content: space-between; min-height: 120px; padding: 14px; background: var(--surface-2); color: var(--ink); text-decoration: none; border: 0; border-radius: 0; }
.pager-a.next { text-align: right; }
.pager-k { font: 500 10px var(--f-m); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pager-t { font: 500 clamp(17px, 2.4vw, 26px)/1.1 var(--f-h); letter-spacing: -.02em; }
.pager-a .ic { width: 18px; height: 18px; }
.pager-a.prev .ic { transform: scaleX(-1); }
.pager-a.next .ic { justify-self: end; }
.pager-a:hover { background: var(--ink); color: var(--ground); }
.pager-a:hover .pager-k { color: inherit; opacity: .7; }

/* ---------------- search / menu overlay ---------------- */
.fd-open { overflow: hidden; }
.finder { position: fixed; inset: 0; z-index: 100; }
.fd-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
.fd-panel {
  position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
  display: flex; flex-direction: column; gap: 0;
  background: #1C1C1C; color: #ECEAE4; border: 1px solid #3A3A3A;
  padding: 16px; overflow-y: auto; overscroll-behavior: contain;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6); transform-origin: 90% 0;
}
@media (min-width: 700px) {
  .fd-panel { top: calc(30px + var(--top-h) + 10px); left: auto; right: max(44px, calc((100vw - 1480px) / 2 + 20px)); bottom: auto; width: 440px; max-height: calc(100vh - var(--top-h) - 70px); }
}
.fd-panel :focus-visible { outline-color: #FFFFFF; }
.fd-top { display: flex; align-items: center; justify-content: space-between; }
.fd-title { font: 500 11px var(--f-m); letter-spacing: .08em; text-transform: uppercase; }
.fd-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #ECEAE4; color: #111; cursor: pointer; }
.fd-x .ic { width: 16px; height: 16px; }
.fd-field { display: block; margin: 12px 0 6px; }
.fd-in {
  width: 100%; min-height: 46px; padding: 0 12px; border-radius: 0;
  background: #121212; color: #FFFFFF; border: 1px solid #4A4A4A;
  font: 500 13px var(--f-m); letter-spacing: .05em; caret-color: #FFFFFF; -webkit-appearance: none; appearance: none;
}
.fd-in::placeholder { color: #A9A69E; text-transform: uppercase; }
.fd-in:focus { outline: none; border-color: #ECEAE4; }
.fd-k { font: 500 10px var(--f-m); letter-spacing: .08em; text-transform: uppercase; color: #A9A69E; margin: 16px 0 8px; }
.fd-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #3A3A3A; border-left: 1px solid #3A3A3A; }
.fd-tile {
  position: relative; display: grid; grid-template-rows: 1fr auto auto; justify-items: start; gap: 2px;
  aspect-ratio: 1 / 1; padding: 10px; border: 0; border-right: 1px solid #3A3A3A; border-bottom: 1px solid #3A3A3A;
  background: transparent; color: #ECEAE4; cursor: pointer; text-align: left; transition: background .15s, color .15s;
}
.fd-tile-ic { justify-self: center; align-self: center; }
.fd-tile-ic .ic { width: 34px; height: 34px; stroke-width: 1.2; }
.fd-tile-l { font: 500 9.5px/1.2 var(--f-m); letter-spacing: .06em; text-transform: uppercase; }
.fd-tile-s { font: 500 9px/1.2 var(--f-m); letter-spacing: .05em; text-transform: uppercase; color: #A9A69E; }
.fd-mk { position: absolute; top: 7px; left: 7px; width: 5px; height: 5px; background: currentColor; }
.fd-tile:hover, .fd-tile:focus-visible { background: #F2F1EC; color: #111; outline: none; }
.fd-tile:hover .fd-tile-s, .fd-tile:focus-visible .fd-tile-s { color: #555; }
.fd-port .fd-tile { aspect-ratio: 1 / .78; }
.fd-port .fd-tile-ic { display: none; }
.fd-port .fd-tile-l { font: 400 13px/1 var(--f-w); letter-spacing: .02em; justify-self: center; align-self: center; grid-row: 1; }
.fd-port .fd-tile-s { justify-self: start; }
.fd-rows { display: grid; }
.fd-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 11px 8px; border-bottom: 1px solid #333; color: #ECEAE4; text-decoration: none; }
.fd-row:hover, .fd-row:focus-visible { background: #F2F1EC; color: #111; outline: none; }
.fd-row:hover .fd-rw, .fd-row:focus-visible .fd-rw { color: #555; }
.fd-type { font: 500 9px/1 var(--f-m); letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; padding: 3px 5px; margin-top: 2px; min-width: 22px; text-align: center; }
.fd-rt { font: 500 14.5px/1.3 var(--f-h); }
.fd-rw { display: block; font: 400 12.5px/1.35 var(--f-b); color: #A9A69E; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fd-row .ic { width: 15px; height: 15px; margin-top: 3px; }
.fd-st { font: 500 9px var(--f-m); letter-spacing: .05em; text-transform: uppercase; color: #A9A69E; margin-top: 4px; white-space: nowrap; }
.fd-st.st-done { color: #6FD394; }
.fd-row:hover .fd-st.st-done, .fd-row:focus-visible .fd-st.st-done { color: #17803D; }
.fd-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 6px; }
.fd-head .fd-k { margin: 0; text-align: right; }
.fd-backbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #5A5A5A; background: transparent; color: #ECEAE4; font: 500 10px var(--f-m); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.fd-backbtn:hover, .fd-backbtn:focus-visible { background: #ECEAE4; color: #111; }
.fd-backbtn .ic { width: 14px; height: 14px; }
.fd-empty { color: #C9C6BE; font-size: 15px; padding: 8px 0; }
.fd-wire { position: fixed; inset: 0; pointer-events: none; animation: fdwire 1s ease forwards; }
.fd-wire line, .fd-wire polygon, .fd-wire rect { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1; vector-effect: non-scaling-stroke; }
.fd-wire line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: fddraw .35s ease-out forwards; }
.fd-wire .fd-slice { stroke: rgba(255, 255, 255, .28); opacity: 0; animation: fdslice .5s ease forwards; }
@keyframes fdwire { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fddraw { to { stroke-dashoffset: 0; } }
@keyframes fdslice { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: .2; } }

/* ---------------- sign in + profile ---------------- */
.si { max-width: 680px; gap: 20px; margin-top: 8px; }
.si-art { height: 96px; background: #050505; overflow: hidden; }
.si-card { border-color: var(--line); background: var(--surface); }
.si-user { border-radius: 999px; border: 1px solid var(--line-2); font: 500 17px var(--f-h); }
.si-user:hover { border-color: var(--ink); background: var(--ink); color: var(--ground); }
.si-user .acct-av { width: 30px; height: 30px; border-radius: 50%; font-size: 13px; }
.si-user:hover .acct-av { background: var(--ground); color: var(--ink); }
.si-code > summary { font: 500 11px var(--f-m); letter-spacing: .05em; text-transform: uppercase; }
.txt { border-radius: 0; }
.acct-title { font-size: clamp(36px, 6vw, 64px); }

/* ---------------- tutor ---------------- */
@media (min-width: 980px) { .tu-side { top: calc(var(--top-h) + 16px); } }
.tu-msg.me { background: var(--ink); color: var(--ground); border-radius: 2px; }
.tu-who { font: 500 10px var(--f-m); letter-spacing: .08em; color: var(--ink-2); }
.tu-h { font: 500 21px/1.15 var(--f-h); letter-spacing: -.015em; }
.tu-lab { border-radius: 999px; background: var(--ink); color: var(--ground); font: 500 10.5px var(--f-m); letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; }
.tu-lab:hover { background: var(--ink-2); }
.tu-divider { font: 500 10.5px var(--f-m); letter-spacing: .08em; }
.tu-step { border-radius: 0; }
.tu-step.at { background: var(--ink); color: var(--ground); }
.tu-n { border-radius: 0; font: 500 10.5px var(--f-m); }
.tu-step.at .tu-n { background: var(--ground); color: var(--ink); }
.tu-rel > li { border-radius: 0; }
.tu-rel > li::before { color: var(--ink); }

/* ---------------- memory cards + objectives ---------------- */
.flip-term { font-family: var(--f-h); font-weight: 500; letter-spacing: -.01em; }
.obj-h { font: 500 22px/1.15 var(--f-h); letter-spacing: -.02em; }

/* ---------------- fixes ---------------- */
.view:focus, .view:focus-visible { outline: none; }
.seg { border-radius: 22px; }
.tu-actions .btn { border-radius: 18px; height: auto; padding-block: 7px; line-height: 1.3; }
@media (max-width: 899px) {
  .tnav { gap: 13px; }
  .tnav .tl { letter-spacing: .02em; font-size: 10.5px; gap: 5px; }
  .pt-img { aspect-ratio: 16 / 10; }
  .pt-ic { width: 30%; }
}
.pager-a { min-width: 0; }
.pager-t, .pager-k { overflow-wrap: anywhere; }
.si-card { min-width: 0; }
.si-card .btn, .reset-wrap .btn { white-space: normal; text-align: left; height: auto; padding-block: 8px; line-height: 1.25; }
.mx-chip { border-radius: 999px; }
.mx-chip[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
body[data-page="signin"] .tright .hide-sm { display: none; }

/* ---------------- motion polish ---------------- */
.veil { position: fixed; z-index: 90; pointer-events: none; image-rendering: pixelated; }
.scr-tail { color: var(--ink-3); opacity: .55; }
.pill-f, .pill-b, .search-btn, .lbl, .fd-backbtn, .tu-lab, .btn { transition: background-color .28s cubic-bezier(.2, .8, .2, 1), border-color .28s cubic-bezier(.2, .8, .2, 1), color .28s cubic-bezier(.2, .8, .2, 1), transform .12s; }
.pt-img { transition: background-color .38s cubic-bezier(.2, .8, .2, 1); }
.pt-ic { transition: transform .5s cubic-bezier(.16, 1, .3, 1), color .38s cubic-bezier(.2, .8, .2, 1); }
.kp, .pg-dom, .pager-a { transition: background-color .32s cubic-bezier(.2, .8, .2, 1), border-color .32s cubic-bezier(.2, .8, .2, 1), color .32s cubic-bezier(.2, .8, .2, 1); }
.kp-s .ic { transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
.pager-a .ic { transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
.pager-a.next:hover .ic { transform: translateX(4px); }
.pager-a.prev:hover .ic { transform: scaleX(-1) translateX(4px); }
.ft-media .dither { transition: transform .9s cubic-bezier(.16, 1, .3, 1), filter .5s ease; }
.fd-tile, .fd-row { transition: background-color .22s ease, color .22s ease; }
.fd-panel { will-change: transform, opacity; backface-visibility: hidden; }
.fd-wire { animation: fdwire 1.25s cubic-bezier(.4, 0, .2, 1) forwards; }
.fd-wire line { animation: fddraw .55s cubic-bezier(.16, 1, .3, 1) forwards; }
.fd-wire .fd-slice { animation: fdslice .8s cubic-bezier(.16, 1, .3, 1) forwards; }
@keyframes fdwire { 0% { opacity: 0; } 12%, 50% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ================= touch + small screens ================= */
/* let the page scroll when a finger lands on a draggable; drag starts on press-and-hold */
.chip, .hz-res, .draggable { touch-action: manipulation; -webkit-touch-callout: none; }
.draggable.press-ready { transform: scale(1.03); box-shadow: 0 10px 24px rgba(0, 0, 0, .18); }
.chip { border-radius: 2px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--ground); box-shadow: 0 0 0 2px var(--ink); }
.chip[aria-pressed="true"] .ic { color: inherit; }
.drop.armed { outline-color: var(--ink); }
.drop.drop-over, [data-drop].drop-over { outline-color: var(--ember); }
[data-concepts] { scroll-margin-top: calc(var(--top-h) + 64px); }

@media (pointer: coarse), (max-width: 899px) {
  .btn, .btn.small, .seg-btn, .gi-step, .mx-chip, .pill-f, .pill-b { min-height: 44px; }
  .pill-b.ic-only { width: 44px; }
  .rb-x { width: 44px; height: 44px; margin: -6px -6px -6px auto; }
  .tgl { min-height: 44px; }
  .objs summary, .si-code > summary { min-height: 44px; }
  /* bigger slider thumb and track */
  .sl input[type="range"] { -webkit-appearance: none; appearance: none; height: 44px; background: transparent; }
  .sl input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: var(--line-2); border-radius: 3px; }
  .sl input[type="range"]::-moz-range-track { height: 6px; background: var(--line-2); border-radius: 3px; }
  .sl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--ink); border: 3px solid var(--ground); box-shadow: 0 0 0 1px var(--ink); }
  .sl input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 3px solid var(--ground); }
  .scn-choice { min-height: 56px; }
  .flip { min-height: 150px; }
}

@media (max-width: 899px) {
  .lab { padding: 12px; gap: 14px; }
  .mod-head { margin-bottom: 18px; padding-bottom: 16px; }
  .mod-title { font-size: clamp(32px, 9vw, 44px); }
  .lede { font-size: 16.5px; }
  .part-k { font-size: 23px; }
  .why { padding: 12px; }
  .why-b { font-size: 15.5px; }

  /* one part of the lab at a time */
  .lab.paged { gap: 0; padding-top: 0; }
  .pp-bar {
    position: sticky; top: var(--top-h); z-index: 9;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity;
    margin: 0 -12px 12px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .pp-bar::-webkit-scrollbar { display: none; }
  .pp-tab {
    flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; max-width: 70vw; padding: 0 14px 0 6px;
    border: 1px solid var(--line-2); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; scroll-snap-align: start;
    font: 500 14px/1.15 var(--f-h); text-align: left;
  }
  .pp-tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  .pp-n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--ink); font: 500 12px var(--f-m); flex: none; }
  .pp-tab[aria-selected="true"] .pp-n { background: var(--ground); color: var(--ink); }
  .pp-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-part { display: grid; gap: 14px; min-width: 0; }
  .pp-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pp-next { flex: 1 1 auto; justify-content: space-between; max-width: 100%; white-space: normal; text-align: left; line-height: 1.2; padding-block: 8px; }

  /* card tray docks to the bottom of the screen while its boxes scroll past */
  .tray.dockable {
    position: sticky; bottom: 0; z-index: 8;
    flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scrollbar-width: none;
    margin: 0 -12px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--ground); border-top: 1px solid var(--ink); box-shadow: 0 -10px 24px rgba(0, 0, 0, .08);
  }
  .tray.dockable::-webkit-scrollbar { display: none; }
  .tray.dockable .chip { flex: 0 0 auto; width: min(74vw, 280px); min-height: 60px; scroll-snap-align: start; align-items: flex-start; font-size: 14.5px; }
  .tray.dockable .tray-done { flex: 1 0 100%; }
  .tray.dockable:has(.tray-done) { position: static; box-shadow: none; }
  .drop.armed { outline-width: 3px; }
}

/* result toast: what just happened, even when the explanation is off screen */

  /* ---------------- drag (pointer) with tap fallback ----------------

  /* ---------------- sorter: place scenario cards on the right part of a diagram ---------------- */
  let sorterSeq = 0;
  AZ.small = () => window.innerWidth < 900;
  AZ.sorter = (cfg) => {
    const items = cfg.shuffle === false ? cfg.items.slice() : AZ.shuffle(cfg.items.slice());

    const chips = new Map();
    const left = new Set(items.map((i) => i.id));
    const tray = cfg.tray;
    tray.classList.add('tray');

      const t = cfg.targets.find((x) => x.id === tid);

      const ok = Array.isArray(it.target) ? it.target.includes(tid) : it.target === tid;

        cfg.onWrong && cfg.onWrong(it, tid);

      const placed = h('span', { class: 'chip placed' + (chip.classList.contains('missed') ? ' was-missed' : '') },

      const hh = Math.max(1, Math.floor(opt.height(w)));

      st.w = w; st.h = hh; st.dpr = dpr;

      c.height = Math.round(hh * dpr);

      c.style.height = hh + 'px';

    }
    function frame(now) {
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      st.t += dt;
      ctx.clearRect(0, 0, st.w, st.h);

      canvas: c, st,

    };

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + hh, r);
    ctx.arcTo(x + w, y + hh, x, y + hh, r);
    ctx.arcTo(x, y + hh, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
})();

<script>/* js/fx.js */
/* AZ-900 Visual Lab — visual effects for the storefront look:

    opts = opts || {};

    const dur = opts.dur || Math.min(1250, 520 + total * 18);
    const TAIL = 7; // characters still decoding ahead of the settled text
    const t0 = performance.now() + (opts.delay || 0);
    const easeOut = (x) => 1 - Math.pow(1 - x, 3);

      if (!el.isConnected) return;
      const p = Math.min(1, Math.max(0, (now - t0) / dur));
      const pos = easeOut(p) * (total + TAIL);
      const done = Math.floor(pos - TAIL), head = Math.floor(pos);
      const tick = Math.floor(now / 70); // each glyph flips about 14 times a second
      const key = done + ':' + head + ':' + tick;
      if (key !== lastKey || p >= 1) {
        lastKey = key;
        const frag = document.createDocumentFragment();
        let k = 0;
        lines.forEach((l, li) => {
          if (li) frag.append(h('br'));

          for (let i = 0; i < l.length; i++, k++) {
            const c = l[i];

            else if (k < head) tail += c === ' ' ? ' ' : GLYPHS[(hashN(k * 131 + tick * 17) * GLYPHS.length) | 0];

          if (tail) frag.append(h('span', { class: 'scr-tail' }, tail));

  };
  function hashN(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }

  /* ---------------- ordered dither artwork ---------------- */
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

    const m = iconMask(name, W, H, opts.pad == null ? 0.18 : opts.pad);
    const lx = opts.lx == null ? 0.3 : opts.lx;
    return AZ.dither({
      w: W, h: H, palette: opts.palette || AZ.PAL.mono, cls: opts.cls, animate: opts.animate, fps: 8,
      field: (x, y, t) => {
        const u = x / W, v = y / H;

        const floor = v > 0.8 ? 0.06 * (1 - Math.abs(u - 0.5) * 2) : 0;

    const frame = (now) => {
      if (veil !== cv) return;
      const p = Math.min(1, (now - t0) / dur);
      const front = easeIO(p) * (1 + BAND);
      for (let i = 0; i < dist.length; i++) {
        const v = (front - dist[i]) / BAND; // 0 → veil solid, 1 → fully cleared
        d[i * 4 + 3] = v >= thr[i] ? 0 : 255;
      }
      ctx.putImageData(img, 0, 0);
      if (p < 1) requestAnimationFrame(frame); else { cv.remove(); veil = null; }
    };
    requestAnimationFrame(frame);
    setTimeout(() => { if (cv.isConnected) cv.remove(); if (veil === cv) veil = null; }, dur + 500);
  };
  AZ.dissolve = (host) => AZ.pageIn(document.getElementById('view'));

  /* gentle staggered entrance for freshly drawn lists (filters, tabs, panels) */
  AZ.rise = (els, opts) => {
    opts = opts || {};

      if (el.animate) el.animate([{ opacity: 0, transform: 'translate3d(0, ' + (opts.y || 10) + 'px, 0)' }, { opacity: 1, transform: 'none' }],

<script>/* js/flow.js */
/* AZ-900 Visual Lab — flow diagrams with animated packets.
   Portrait-first SVG (360 units wide) so labels stay readable on phones. */
(function () {
  'use strict';
  const { s } = AZ;

  function polyLen(pts) {
    let t = 0;
    for (let i = 1; i < pts.length; i++) t += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return t;
  }
  function pointAt(pts, d) {
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (d <= acc + L || i === pts.length - 1) {
        const f = L ? Math.max(0, Math.min(1, (d - acc) / L)) : 1;
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
      }
      acc += L;
    }
    return pts[pts.length - 1];
  }

  class Flow {
    constructor(parent, spec) {
      this.spec = spec;
      this.W = spec.w || 360;
      this.H = spec.h || 480;
      this.svg = s('svg', { viewBox: `0 0 ${this.W} ${this.H}`, class: 'flow ' + (spec.cls || ''), role: 'img', 'aria-label': spec.label || 'Diagram' });
      this.gZ = s('g'); this.gL = s('g'); this.gN = s('g'); this.gP = s('g'); this.gF = s('g');
      this.svg.append(this.gZ, this.gL, this.gN, this.gP, this.gF);
      this.ns = {};
      (spec.nodes || []).forEach((n) => (this.ns[n.id] = n));
      this.zones = {}; this.links = {}; this.nodes = {};
      (spec.zones || []).forEach((z) => this.addZone(z));
      (spec.links || []).forEach((l) => this.addLink(l));
      (spec.nodes || []).forEach((n) => this.addNode(n));
      parent.append(this.svg);
      this.alive = true;
    }
    addZone(z) {
      const g = s('g', { class: 'fz fz-' + (z.kind || 'plain') });
      g.append(s('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: z.rx != null ? z.rx : 12, class: 'fz-box' }));
      if (z.label) g.append(s('text', { x: z.x + 10, y: z.y + 17, class: 'fz-label' }, z.label));
      if (z.sub) g.append(s('text', { x: z.x + 10, y: z.y + 31, class: 'fz-sub' }, z.sub));
      this.gZ.append(g);
      this.zones[z.id] = { spec: z, g };
      return g;
    }
    addNode(n) {
      const w = n.w || 120, ht = n.h || 40;
      const g = s('g', { class: 'fn fn-' + (n.kind || 'res'), transform: `translate(${n.x} ${n.y})` });
      g.append(s('rect', { x: -w / 2, y: -ht / 2, width: w, height: ht, rx: 9, class: 'fn-box' }));
      let tx = 0, anchor = 'middle';
      if (n.icon) {
        g.append(AZ.gIcon(n.icon, -w / 2 + 17, 0, 18, 'fn-ic'));
        tx = -w / 2 + 31;
        anchor = 'start';
      }
      if (n.sub) {
        g.append(s('text', { x: tx, y: -7, class: 'fn-label', 'text-anchor': anchor, 'dominant-baseline': 'central' }, n.label));
        g.append(s('text', { x: tx, y: 9, class: 'fn-sub', 'text-anchor': anchor, 'dominant-baseline': 'central' }, n.sub));
      } else {
        g.append(s('text', { x: tx, y: 0, class: 'fn-label', 'text-anchor': anchor, 'dominant-baseline': 'central' }, n.label));
      }
      this.gN.append(g);
      this.nodes[n.id] = { spec: n, g };
      return g;
    }
    pt(id) { const n = this.ns[id]; return [n.x, n.y]; }
    addLink(l) {
      const pts = [this.pt(l.from)].concat(l.via || [], [this.pt(l.to)]);
      const d = 'M' + pts.map((p) => p.join(' ')).join(' L');
      const g = s('g', { class: 'fl fl-' + (l.style || 'solid') });
      if (l.style === 'tunnel' || l.style === 'private') g.append(s('path', { d, class: 'fl-tube' }));
      g.append(s('path', { d, class: 'fl-line' }));
      if (l.label) {
        const at = l.labelAt || pointAt(pts, polyLen(pts) / 2);
        g.append(s('text', { x: at[0], y: at[1], class: 'fl-label', 'text-anchor': l.anchor || 'middle' }, l.label));
      }
      this.gL.append(g);
      const id = l.id || l.from + '>' + l.to;
      this.links[id] = { spec: l, g, pts };
      return g;
    }
    seg(a, b) {
      for (const k in this.links) {
        const L = this.links[k];
        if (L.spec.from === a && L.spec.to === b) return L.pts;
        if (L.spec.from === b && L.spec.to === a) return L.pts.slice().reverse();
      }
      return [this.pt(a), this.pt(b)];
    }
    route(ids) {
      let pts = [this.pt(ids[0])];
      const hop = [0];
      for (let i = 1; i < ids.length; i++) {
        pts = pts.concat(this.seg(ids[i - 1], ids[i]).slice(1));
        hop.push(polyLen(pts));
      }
      return { pts, hop };
    }
    _state(map, id, st) {
      const o = map[id];
      if (!o) return;
      [...o.g.classList].forEach((c) => { if (c.startsWith('is-')) o.g.classList.remove(c); });
      if (st) st.split(' ').forEach((c) => c && o.g.classList.add('is-' + c));
    }
    node(id, st) { this._state(this.nodes, id, st); }
    link(id, st) { this._state(this.links, id, st); }
    zone(id, st) { this._state(this.zones, id, st); }
    show(id, on) {
      const o = this.nodes[id] || this.links[id] || this.zones[id];
      if (o) o.g.style.display = on ? '' : 'none';
    }
    send(ids, opt) {
      opt = opt || {};
      const bi = opt.blockAt ? ids.indexOf(opt.blockAt) : -1;
      const path = bi >= 0 ? ids.slice(0, bi + 1) : ids;
      const { pts, hop } = this.route(path);
      const total = polyLen(pts);
      const pk = s('g', { class: 'pkt ' + (opt.cls || '') });
      pk.append(s('circle', { r: 11, class: 'pkt-halo' }), s('circle', { r: 6.5, class: 'pkt-dot' }));
      if (opt.lock) pk.append(AZ.gIcon('lock', 0, -16, 13, 'pkt-lock'));
      if (opt.text) pk.append(s('text', { x: 12, y: -10, class: 'pkt-text' }, opt.text));
      this.gP.append(pk);
      const place = (p) => pk.setAttribute('transform', `translate(${p[0]} ${p[1]})`);
      place(pts[0]);
      const speed = opt.speed || 230;
      return new Promise((resolve) => {
        const finish = () => {
          if (!this.alive) { pk.remove(); return resolve(false); }
          if (bi >= 0) {
            this.burst(pts[pts.length - 1], opt.blockText || 'Blocked');
            pk.classList.add('dead');
            setTimeout(() => pk.remove(), 700);
            resolve(false);
          } else {
            this.ping(path[path.length - 1]);
            setTimeout(() => pk.remove(), opt.keep || 260);
            resolve(true);
          }
        };
        let fired = 0;
        const fire = (d) => {
          while (fired < hop.length && d >= hop[fired] - 0.01) {
            opt.onHop && opt.onHop(path[fired], fired);
            fired++;
          }
        };
        if (AZ.reduced) {
          let i = 0;
          const step = () => {
            if (!this.alive) return resolve(false);
            place(pointAt(pts, hop[i]));
            fire(hop[i]);
            i++;
            if (i < hop.length) setTimeout(step, 280);
            else finish();
          };
          step();
          return;
        }
        const t0 = performance.now();
        const tick = (now) => {
          if (!this.alive) { pk.remove(); return resolve(false); }
          const d = Math.min(total, ((now - t0) / 1000) * speed);
          place(pointAt(pts, d));
          fire(d);
          if (d < total) requestAnimationFrame(tick);
          else finish();
        };
        requestAnimationFrame(tick);
      });
    }
    burst(p, text) {
      const g = s('g', { class: 'burst', transform: `translate(${p[0]} ${p[1]})` });
      g.append(s('circle', { r: 13, class: 'burst-c' }), AZ.gIcon('x', 0, 0, 16, 'burst-x'));
      if (text) {
        const below = p[1] < 44;
        const x = Math.max(50, Math.min(this.W - 50, p[0])) - p[0];
        g.append(s('text', { x, y: below ? 30 : -20, class: 'burst-t', 'text-anchor': 'middle' }, text));
      }
      this.gF.append(g);
      setTimeout(() => g.remove(), 2400);
    }
    ping(id) {
      const o = this.nodes[id];
      if (!o) return;
      o.g.classList.remove('hit');
      void o.g.getBoundingClientRect();
      o.g.classList.add('hit');
      setTimeout(() => o.g.classList.remove('hit'), 700);
    }
    note(id, text, tone, ms) {
      const n = this.ns[id];
      if (!n) return;
      const y = n.y - (n.h || 40) / 2 - 10;
      const t = s('text', { x: Math.max(60, Math.min(this.W - 60, n.x)), y, class: 'fx-note ' + (tone || ''), 'text-anchor': 'middle' }, text);
      this.gF.append(t);
      setTimeout(() => t.remove(), ms || 1800);
    }
    destroy() { this.alive = false; }
  }
  AZ.Flow = Flow;
})();

/* Module 8 — Azure resource hierarchy */

        const b = h('button', { type: 'button', class: cls, 'data-res': r.id, 'aria-pressed': String(scope === r.id || moving === r.id),
