/* Module 15 — Azure RBAC: who has what access at which scope */
(function () {
  'use strict';
  const { h } = AZ;
  const USERS = { alex: { name: 'Alex', title: 'Administrator' }, dev: { name: 'Sam', title: 'Developer' }, riley: { name: 'Riley', title: 'Auditor' } };
  const ROLES = {
    owner: { name: 'Owner', can: ['read', 'create', 'delete', 'assign'], rank: 3 },
    contributor: { name: 'Contributor', can: ['read', 'create', 'delete'], rank: 2 },
    reader: { name: 'Reader', can: ['read'], rank: 1 }
  };
  const ACTIONS = { read: 'Read', create: 'Create / change', delete: 'Delete', assign: 'Grant access to others' };
  const SCOPES = {
    sub: { name: 'Subscription · Contoso', kind: 'Subscription', parent: null },
    'rg-app': { name: 'rg-app', kind: 'Resource group', parent: 'sub' },
    'rg-data': { name: 'rg-data', kind: 'Resource group', parent: 'sub' },
    'vm-app': { name: 'vm-app', kind: 'Virtual machine', parent: 'rg-app', icon: 'vm' },
    'st-app': { name: 'stappfiles', kind: 'Storage account', parent: 'rg-app', icon: 'storage' },
    'sql-data': { name: 'sql-data', kind: 'SQL database', parent: 'rg-data', icon: 'db' }
  };
  const anc = (id) => { const out = []; let c = id; while (c) { out.push(c); c = SCOPES[c].parent; } return out; };

  function miniScope(level) {
    const sp = { boxes: [{ x: 6, y: 6, w: 148, h: 88, label: 'Subscription', cls: level === 'sub' ? 'm-hl' : 'm-in' }, { x: 14, y: 22, w: 64, h: 64, label: 'rg-app', cls: level === 'sub' || level === 'rg' ? 'm-hl' : 'm-off' }, { x: 84, y: 22, w: 62, h: 64, label: 'rg-data', cls: level === 'sub' ? 'm-hl' : 'm-off' }], nodes: [] };
    sp.nodes.push({ x: 34, y: 60, icon: 'vm', r: 9, cls: level === 'res' || level === 'rg' || level === 'sub' ? 'm-hl' : '' }, { x: 60, y: 60, icon: 'storage', r: 9, cls: level === 'rg' || level === 'sub' ? 'm-hl' : '' }, { x: 115, y: 60, icon: 'db', r: 9, cls: level === 'sub' ? 'm-hl' : '' });
    return AZ.mini(sp);
  }

  AZ.register({
    id: 'rbac', num: 15, domain: 'arch', icon: 'key',
    title: 'Azure role-based access control', short: 'RBAC scopes',
    lede: 'Drop a role onto a subscription, a resource group or a single resource and watch exactly how far it reaches. Then test real actions: allowed or denied?',
    objectives: ['a24'],
    memory: [
      { term: 'RBAC', rule: 'WHO has WHAT ACCESS to WHICH SCOPE.', icon: 'key' },
      { term: 'Scope', rule: 'Management group, subscription, resource group or resource. Roles inherit downward.', icon: 'layers' },
      { term: 'Built-in roles', rule: 'Owner: everything + grant access. Contributor: manage, no granting. Reader: view only.', icon: 'users' },
      { term: 'Least privilege', rule: 'Give the smallest role at the narrowest scope that still does the job.', icon: 'lock' }
    ],
    exams: [
      {
        id: 'rbac-x1', concept: 'rbac-scope', short: 'Manage one resource group only → role at resource group scope',
        prompt: 'A developer must manage everything in rg-app, and nothing else in the subscription. Where do you assign the Contributor role?',
        answer: 'rg',
        why: 'Assign at the resource group scope. The role is inherited by every resource in rg-app and reaches nothing outside it.',
        choices: [
          { id: 'sub', label: 'The subscription', art: () => miniScope('sub'), note: 'Too broad: every resource group would be included.' },
          { id: 'rg', label: 'Resource group rg-app', art: () => miniScope('rg'), note: 'Exactly the resources in rg-app.' },
          { id: 'res', label: 'Only vm-app', art: () => miniScope('res'), note: 'Too narrow: misses the other resources in rg-app.' },
          { id: 'mg', label: 'A management group', art: () => miniScope('sub'), note: 'Broader still — many subscriptions.' }
        ]
      }
    ],
    render(root, api) {
      let user = 'riley', role = null;
      let assigns = [{ user: 'alex', role: 'owner', scope: 'sub' }, { user: 'dev', role: 'contributor', scope: 'rg-app' }, { user: 'riley', role: 'reader', scope: 'sub' }];
      const tests = new Set();
      const why = AZ.whyBox(['Pick a person', 'The tree shows how far their access reaches. Drop a role on a box to add an assignment.']);
      const userSeg = AZ.seg({ label: 'Person', value: user, options: Object.keys(USERS).map((k) => ({ id: k, label: USERS[k].name + ' · ' + USERS[k].title, icon: 'user' })), onChange: (v) => { user = v; draw(); explain(); } });
      const roleChips = Object.keys(ROLES).map((k) => {
        const c = h('button', { type: 'button', class: 'chip role-' + k, 'aria-pressed': 'false' }, AZ.icon('key'), h('span', null, ROLES[k].name));
        c.addEventListener('click', () => { role = role === k ? null : k; roleChips.forEach((x, i) => x.setAttribute('aria-pressed', String(Object.keys(ROLES)[i] === role))); tree.classList.toggle('arming', !!role); });
        AZ.draggable(c, { dropSelector: '[data-scope]', onStart: () => { role = k; tree.classList.add('arming'); }, onDrop: (el) => assign(k, el.dataset.scope), onCancel: () => tree.classList.remove('arming') });
        return c;
      });
      const tree = h('div', { class: 'rb-tree' });
      const sentences = h('ul', { class: 'rb-sent' });
      const actSeg = AZ.seg({ label: 'Action', value: 'delete', options: Object.keys(ACTIONS).map((k) => ({ id: k, label: ACTIONS[k] })), cls: 'seg-wrap' });
      const tgtSeg = AZ.seg({ label: 'Resource', value: 'vm-app', options: ['vm-app', 'st-app', 'sql-data'].map((k) => ({ id: k, label: SCOPES[k].name, icon: SCOPES[k].icon })), cls: 'seg-wrap' });
      const stamp = h('div', { class: 'rb-stamp', 'aria-live': 'polite' });
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, tree, stamp),
        h('aside', { class: 'lab-side' },
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Who'), userSeg),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Drag a role onto a scope (or tap role, then tap a box)'), h('div', { class: 'tray' }, roleChips)),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Assignments'), sentences),
          h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Try an action'), actSeg, tgtSeg, AZ.btn('Try it', tryIt, { cls: 'primary', icon: 'play' })),
          why)));

      function effective(u, scope) {
        const a = anc(scope);
        const list = assigns.filter((x) => x.user === u && a.includes(x.scope));
        if (!list.length) return null;
        return list.reduce((best, x) => (ROLES[x.role].rank > ROLES[best.role].rank ? x : best));
      }
      function box(id, kids) {
        const sc = SCOPES[id];
        const eff = effective(user, id);
        const direct = assigns.find((x) => x.user === user && x.scope === id);
        const head = h('button', { type: 'button', class: 'rb-head', 'data-scope': id },
          sc.icon ? AZ.icon(sc.icon) : AZ.icon(id === 'sub' ? 'sub' : 'rg'),
          h('span', { class: 'hz-hl' }, h('span', { class: 'hz-kind' }, sc.kind), h('span', { class: 'hz-name' }, sc.name)),
          eff ? h('span', { class: 'bdg ' + (direct ? 'direct' : 'inh') + ' rb-' + eff.role }, AZ.icon('key'), h('span', null, ROLES[eff.role].name + (direct ? '' : ' ↓'))) : h('span', { class: 'rb-none' }, 'no access'));
        head.addEventListener('click', () => { if (role) assign(role, id); else why.set(sc.name, eff ? USERS[user].name + ' has ' + ROLES[eff.role].name + (eff.scope === id ? ' assigned right here.' : ' here, inherited from ' + SCOPES[eff.scope].name + '.') : USERS[user].name + ' has no role here — not even read.'); });
        return h('div', { class: 'rb-box rb-' + (sc.icon ? 'res' : id === 'sub' ? 'sub' : 'rg') + (eff ? ' has' : ' none'), 'data-box': id }, head, kids);
      }
      function draw() {
        tree.replaceChildren(box('sub', h('div', { class: 'rb-kids' },
          ['rg-app', 'rg-data'].map((rg) => box(rg, h('div', { class: 'rb-kids res' }, Object.keys(SCOPES).filter((k) => SCOPES[k].parent === rg).map((r) => box(r, null))))))));
        sentences.replaceChildren(...assigns.map((a) => h('li', { class: a.user === user ? 'me' : '' },
          h('strong', null, USERS[a.user].name), ' has ', h('span', { class: 'rb-r rb-' + a.role }, ROLES[a.role].name), ' at ', h('code', null, SCOPES[a.scope].name.replace('Subscription · ', 'subscription ')),
          h('button', { type: 'button', class: 'rb-x', 'aria-label': 'Remove this assignment', onClick: () => { assigns = assigns.filter((x) => x !== a); draw(); why.set('Assignment removed', 'Access is additive: removing one assignment can leave another still granting access.'); } }, AZ.icon('x')))));
      }
      function explain() {
        const n = assigns.filter((x) => x.user === user);
        why.set(USERS[user].name + ' · ' + USERS[user].title, n.length ? 'Highlighted boxes are where ' + USERS[user].name + ' has access. Arrows (↓) mean inherited from above.' : USERS[user].name + ' has no assignments, so no access anywhere.');
      }
      function assign(r, scope) {
        tree.classList.remove('arming');
        role = null;
        roleChips.forEach((x) => x.setAttribute('aria-pressed', 'false'));
        assigns = assigns.filter((x) => !(x.user === user && x.scope === scope));
        assigns.push({ user, role: r, scope });
        draw();
        const reach = Object.keys(SCOPES).filter((k) => anc(k).includes(scope) && SCOPES[k].icon).length;
        tree.querySelectorAll('[data-box]').forEach((b) => { if (anc(b.dataset.box).includes(scope)) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 900); } });
        why.set(USERS[user].name + ' → ' + ROLES[r].name + ' at ' + SCOPES[scope].name, 'This reaches ' + reach + ' resource' + (reach === 1 ? '' : 's') + '. Assign at a higher scope and it reaches more; at a resource, it reaches only that resource.', 'ok');
        tests.add('assign');
        if (tests.size >= 3) api.complete();
      }
      async function tryIt() {
        const act = actSeg.value, tgt = tgtSeg.value;
        const eff = effective(user, tgt);
        const ok = !!eff && ROLES[eff.role].can.includes(act);
        tree.querySelectorAll('[data-box]').forEach((b) => b.classList.remove('path'));
        if (eff) {
          const chain = anc(tgt).slice(0, anc(tgt).indexOf(eff.scope) + 1).reverse();
          for (const id of chain) { const b = tree.querySelector(`[data-box="${id}"]`); if (b) b.classList.add('path'); await AZ.wait(260); if (!api.alive) return; }
        }
        stamp.className = 'rb-stamp ' + (ok ? 'ok' : 'bad');
        stamp.replaceChildren(AZ.icon(ok ? 'unlock' : 'lock'), h('span', null, ok ? 'ACCESS ALLOWED' : 'ACCESS DENIED'));
        AZ.pop(stamp, 'pop', 500);
        AZ.reveal(stamp);
        why.set(USERS[user].name + ': ' + ACTIONS[act].toLowerCase() + ' ' + SCOPES[tgt].name, eff
          ? USERS[user].name + '’s ' + ROLES[eff.role].name + ' role (at ' + SCOPES[eff.scope].name + ') ' + (ok ? 'includes this action.' : 'doesn’t include this action.')

        api.concept('rbac-try-' + (ok ? 'allow' : 'deny'), true, ok ? 'RBAC allows actions in the role' : 'RBAC denies actions outside the role');
        tests.add(ok ? 'allow' : 'deny');
        if (tests.size >= 3) api.complete();
        setTimeout(() => tree.querySelectorAll('.path').forEach((b) => b.classList.remove('path')), 2200);
      }
      draw();
      explain();
    }
  });
})();

(function () {

  const SIG = {

    if (v.risk === 'high') return ['block', 'Rule 1: high sign-in risk → block access.'];

    if (v.device === 'unknown' || v.loc === 'odd' || v.risk === 'medium') return ['mfa', 'Rule 3: unknown device, unusual location or medium risk → require MFA.'];

  AZ.register({

          { id: 'rbac', label: 'RBAC role', art: () => AZ.mini({ nodes: [{ x: 50, y: 50, icon: 'user' }, { x: 110, y: 50, icon: 'key', cls: 'm-hl' }], links: [{ a: 0, b: 1 }] }), note: 'Decides what someone can do after sign-in, not how they sign in.' },
          { id: 'mfa', label: 'MFA for everyone, always', art: () => AZ.mini({ nodes: [{ x: 80, y: 50, icon: 'phone', cls: 'm-hl', r: 15 }] }), note: 'Would prompt in the office too.' },
          { id: 'policy', label: 'Azure Policy', art: () => AZ.mini({ nodes: [{ x: 80, y: 50, icon: 'policy', cls: 'm-hl', r: 15 }] }), note: 'Governs resource settings, not sign-ins.' }
        ]
      }
    ],
    render(root, api) {

      const seen = new Set();
      let busy = false;
      const why = AZ.whyBox(['Signals in, decision out', 'Choose the signals, or pick a preset, then run the sign-in.']);
      const stages = ['user', 'device', 'loc', 'risk'].map((k) => h('li', { class: 'ca-st', 'data-k': k }, h('span', { class: 'ca-k' }, SIG[k].k), h('span', { class: 'ca-v' })));
      const policy = h('li', { class: 'ca-st ca-pol' }, h('span', { class: 'ca-k' }, 'Conditional Access policy'), h('ol', { class: 'ca-rules' },
        h('li', null, 'High sign-in risk → Block'), h('li', null, 'Administrators → Require MFA'), h('li', null, 'Unknown device, unusual location or medium risk → Require MFA'), h('li', null, 'Otherwise → Allow')));
      const outs = Object.keys(OUT).map((k) => h('div', { class: 'ca-out ca-' + k, 'data-o': k }, AZ.icon(OUT[k][1]), h('span', null, OUT[k][0])));
      const pipe = h('ol', { class: 'ca-pipe' }, h('li', { class: 'ca-st ca-user' }, AZ.icon('user'), h('span', null, 'Sign-in attempt')), stages, policy);
      const segs = Object.keys(SIG).map((k) => h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, SIG[k].k), AZ.seg({ label: SIG[k].k, value: v[k], cls: 'seg-wrap', options: SIG[k].opts.map(([id, l]) => ({ id, label: l })), onChange: (x) => { v[k] = x; paint(); } })));
      const presetRow = h('div', { class: 'btn-row' }, PRESETS.map(([n, p]) => AZ.btn(n, () => { Object.assign(v, p); segs.forEach((sg, i) => sg.querySelector('.seg').set(v[Object.keys(SIG)[i]])); paint(); run(); }, { cls: 'ghost small' })));
      root.append(h('div', { class: 'lab-grid' },
        h('div', { class: 'lab-main' }, pipe, h('div', { class: 'ca-outs' }, outs)),
        h('aside', { class: 'lab-side' }, h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Presets'), presetRow), segs, AZ.btn('Run sign-in', run, { cls: 'primary', icon: 'play' }), why)));

  /* ================= Cost management + tags ================= */

        if (budget) why.set('Budget alert fired', 'Cost Management budgets alert you when spending crosses thresholds. They warn — they don’t stop resources by themselves.', 'warn');
        if (!groups.Untagged && group === 'Department') api.complete();

  /* ================= Azure Policy + Microsoft Purview ================= */

    ['loc', 'US regions only'], ['size', 'Approved VM sizes (B, D series)'], ['tag', 'CostCenter tag required'], ['enc', 'Encryption required']

  const INCOMING = [
    { n: 'vm-app-01', loc: 'East US', size: 'D2s', tag: true, enc: true },

  const fails = (r) => [r.loc.includes('US') ? null : 'loc', /NC24/.test(r.size) ? 'size' : null, r.tag ? null : 'tag', r.enc ? null : 'enc'].filter(Boolean);
  AZ.register({
    id: 'policy-governance', num: 23, domain: 'gov', icon: 'policy',
    title: 'Azure Policy and Microsoft Purview', short: 'Azure Policy & Purview',
    lede: 'Five resources try to deploy into an organization with four rules. Watch Azure Policy evaluate each one. Then scan the company’s data with Microsoft Purview — a different kind of governance.',
    objectives: ['g5', 'g6'],
    memory: [
      { term: 'Azure Policy', rule: 'Rules for resource settings. Evaluates, reports compliance, can deny.', icon: 'policy' },
      { term: 'Initiative', rule: 'A group of policies assigned together.', icon: 'layers' },
      { term: 'Microsoft Purview', rule: 'Governs DATA: discover, classify and manage it across on-prem, multicloud and SaaS.', icon: 'search' }
    ],
    exams: [{
      id: 'gov-x1', concept: 'gov-purview', short: 'Find and classify sensitive data everywhere → Purview',
      prompt: 'A company must find where sensitive customer data lives across Azure SQL, on-premises databases and another cloud, and classify it.',
      answer: 'purview', why: 'Microsoft Purview discovers, catalogs and classifies data across on-premises, multicloud and SaaS sources. Azure Policy governs resource settings, not data content.',
      choices: [
        { id: 'purview', label: 'Microsoft Purview', art: () => icoMini('search', 'data map'), note: 'Data governance.' },
        { id: 'policy', label: 'Azure Policy', art: () => icoMini('policy', 'rules'), note: 'Checks resource configuration, not what’s inside the data.' },
        { id: 'def', label: 'Defender for Cloud', art: () => icoMini('star', 'secure score'), note: 'Security posture and threats.' },

    render(root, api) {

        h('aside', { class: 'lab-side' }, h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'Effect'), eseg), AZ.btn('Deploy all', run, { cls: 'primary', icon: 'play' }), why)));

        why.set(effect === 'deny' ? 'Deny: bad configs never got in' : 'Audit: deployed, but reported', effect === 'deny' ? 'Policy judged each resource’s settings — nobody’s permissions were involved. Try Audit to see the difference.' : 'Audit lets resources deploy but marks them non-compliant in the compliance report, so you can fix them.', effect === 'deny' ? 'ok' : 'warn');
        api.concept('gov-policy-' + effect, true, 'Azure Policy ' + effect + ' effect');
        busy = false;
      }
      /* Purview */
      const SRC = [['db', 'Azure SQL', 'Credit card numbers'], ['storage', 'Blob Storage', 'Passport scans'], ['server', 'On-prem SQL Server', 'Customer emails'], ['cloud', 'Another cloud bucket', 'None found'], ['mail', 'Microsoft 365', 'Salary data']];
      const why2 = AZ.whyBox(['Microsoft Purview', 'Governs the data itself — wherever it lives. Press Scan.']);
      const map = h('div', { class: 'pv-map' });
      const drawMap = (found) => map.replaceChildren(h('div', { class: 'pv-hub' }, AZ.icon('search'), h('span', null, 'Purview data map')),
        h('div', { class: 'pv-src' }, SRC.map(([ic, n, c], i) => h('div', { class: 'pv-s' + (found > i ? ' found' : '') }, AZ.icon(ic), h('strong', null, n), h('span', { class: 'pill ' + (found > i ? (c === 'None found' ? 'ok' : 'warn') : '') }, found > i ? c : 'not scanned')))));
      drawMap(0);
      root.append(h('div', { class: 'chal-block' }, AZ.part('Microsoft Purview: governing data', 'Azure Policy governs resources. Purview governs the data inside them.'),
        h('div', { class: 'lab-grid' }, h('div', { class: 'lab-main' }, map), h('aside', { class: 'lab-side' }, AZ.btn('Scan all sources', async () => {
          for (let i = 1; i <= SRC.length; i++) { drawMap(i); await AZ.wait(400); if (!api.alive) return; }

          api.complete();
        }, { cls: 'primary', icon: 'search' }), why2))));
    }
  });
})();

      q: ['The database must only be reachable from inside the company’s VNet.', 1] },
    { id: 'mon-health', sides: [['Azure Monitor', 'Telemetry from YOUR resources: metrics, logs, alerts.', () => ico('chart', 'your telemetry')], ['Service Health', 'Problems on AZURE’s side that affect you: incidents, maintenance.', () => ico('heart', 'Azure’s status')]],
      q: ['An Azure datacenter outage is affecting your region.', 1] },
    { id: 'mon-advisor', sides: [['Azure Monitor', 'Watches what’s happening now; alerts on thresholds.', () => ico('bell', 'watch + alert')], ['Azure Advisor', 'Reviews your setup and recommends improvements.', () => ico('bulb', 'recommendations')]],
      q: ['Suggest which underused VMs to resize to save money.', 1] },
    { id: 'iaas-paas-saas', sides: [['IaaS', 'You manage the OS and up.', () => AZ.miniStack(5)], ['PaaS', 'You manage the app and data.', () => AZ.miniStack(3)], ['SaaS', 'You use the software; keep data + access.', () => AZ.miniStack(2)]],
      q: ['Deploy your own code without patching any operating system.', 1] },
    { id: 'capex-opex', sides: [['CapEx', 'Big upfront spend on physical infrastructure.', () => { const sv = svg(); [70, 4, 4, 4, 4, 4].forEach((v, i) => sv.append(s('rect', { x: 26 + i * 20, y: 80 - v, width: 14, height: v, rx: 2, class: 'mt ' + (i ? 'm-in' : 'm-hl') }))); return sv; }], ['OpEx', 'Pay as you consume, no upfront cost.', () => { const sv = svg(); [14, 18, 12, 20, 16, 15].forEach((v, i) => sv.append(s('rect', { x: 26 + i * 20, y: 80 - v, width: 14, height: v, rx: 2, class: 'mt m-in' }))); return sv; }]],
      q: ['Buying new servers for the company datacenter this quarter.', 0] },
    { id: 'redundancy', sides: ['LRS', 'ZRS', 'GRS', 'GZRS'].map((o) => [o, { LRS: '3 copies, 1 datacenter.', ZRS: '3 copies across 3 zones.', GRS: 'LRS + copy in a second region.', GZRS: 'ZRS + copy in a second region.' }[o], () => {
        const geo = o[0] === 'G';
        const sp = { boxes: [{ x: 6, y: 8, w: geo ? 100 : 148, h: 84, label: 'Primary', cls: 'm-in' }] };
        if (geo) sp.boxes.push({ x: 112, y: 8, w: 42, h: 84, label: '2nd', cls: 'm-in' });

    { id: 'blob-files', sides: [['Blob Storage', 'Objects by URL: video, images, backups.', () => ico('file', 'objects by URL')], ['Azure Files', 'A shared file system machines mount (SMB/NFS).', () => M({ nodes: [{ x: 80, y: 30, icon: 'folder', cls: 'm-hl' }, { x: 40, y: 72, icon: 'laptop', r: 10 }, { x: 120, y: 72, icon: 'vm', r: 10 }], links: [{ a: 0, b: 1 }, { a: 0, b: 2 }] })]],
      q: ['Store millions of product photos served to a website.', 0] },
    { id: 'vert-horiz', sides: [['Vertical scaling', 'Scale up: the same server gets bigger.', () => { const sv = svg(); sv.append(s('rect', { x: 56, y: 22, width: 48, height: 56, rx: 4, class: 'mt m-hl mx-grow1' })); return withText(sv, 'bigger'); }], ['Horizontal scaling', 'Scale out: add more servers.', () => withText(boxes(4, 'm-hl', 'mx-grow'), 'more')]],

  AZ.mixups = function (view, api, startPair) {
    let cur = Math.max(0, PAIRS.findIndex((p) => p.id === startPair));
    const why = AZ.whyBox();
    const chips = h('div', { class: 'mx-nav', role: 'tablist', 'aria-label': 'Comparisons' });
    const stage = h('div', { class: 'mx-stage' });
    view.append(
      h('header', { class: 'mod-head' }, h('div', { class: 'eyebrow' }, 'Exam confusion lab'), h('h1', { class: 'mod-title' }, 'Don’t mix these up'),
        h('p', { class: 'lede' }, '16 pairs AZ-900 loves to swap. Each one is a split screen with one sentence per side, then a one-tap check.')),
      chips, stage);
    function drawChips() {
      const S = AZ.progress.state.concepts;
      chips.replaceChildren(...PAIRS.map((p, i) => {
        const c = S['mix-' + p.id];
        const st = AZ.progress.status(c);
        const b = h('button', { type: 'button', role: 'tab', class: 'mx-chip st-' + st, 'aria-selected': String(i === cur) }, AZ.PAIRS[p.id]);
        b.addEventListener('click', () => { cur = i; draw(); });
        return b;
      }));
    }
    function draw() {
      drawChips();
      const p = PAIRS[cur];
      const split = h('div', { class: 'mx-split n' + p.sides.length }, p.sides.map(([n, line, art]) => h('div', { class: 'mx-side' }, h('div', { class: 'mx-art-w' }, art()), h('strong', { class: 'mx-name' }, n), h('p', null, line))));
      const opts = h('div', { class: 'btn-row' });
      let answered = false;
      p.sides.forEach(([n], i) => opts.append(AZ.btn(n, (e) => {
        if (answered) return;
        answered = true;
        const ok = i === p.q[1];
        AZ.progress.concept('mix-' + p.id, ok, { domain: null, label: AZ.PAIRS[p.id], pair: p.id, module: null });
        opts.querySelectorAll('.btn').forEach((b, j) => b.classList.add(j === p.q[1] ? 'right' : j === i ? 'wrong' : 'dimmed'));
        why.set(ok ? 'Correct: ' + p.sides[p.q[1]][0] : 'It’s ' + p.sides[p.q[1]][0], p.sides[p.q[1]][1], ok ? 'ok' : 'bad');
        drawChips();
      }, { cls: 'ghost' })));
      stage.replaceChildren(h('h2', { class: 'part-k' }, AZ.PAIRS[p.id]), split,
        h('div', { class: 'mx-q' }, h('div', { class: 'scn-tag' }, AZ.icon('star'), 'Quick check'), h('p', { class: 'scn-q' }, p.q[0]), opts),
        why,
        h('div', { class: 'btn-row' }, cur > 0 ? AZ.btn('Previous pair', () => { cur--; draw(); }, { cls: 'ghost', icon: 'minus' }) : null, cur < PAIRS.length - 1 ? AZ.btn('Next pair', () => { cur++; draw(); window.scrollTo({ top: 0 }); }, { cls: 'primary', icon: 'arrowR' }) : h('a', { class: 'btn primary', href: '#progress' }, 'See your progress')));
      why.set('Pick one', 'Which side does the scenario describe?');
    }
    draw();
    if (startPair) setTimeout(() => stage.scrollIntoView({ behavior: 'auto', block: 'start' }), 60);
  };
})();

<script>/* js/m-tutor.js */
/* Guided tutor — starts from the learner's goal (Frame of Relevance),
   then teaches the AZ-900 path in order using relationship diagrams. */
(function () {
  'use strict';
  const { h } = AZ;

  // Teaching order when starting from zero: foundations first, then architecture, then governance.
  const PATH = ['cloud-models', 'shared-resp', 'service-models', 'capex-opex', 'reliability', 'scaling',
    'global-infra', 'hierarchy', 'compute', 'networking', 'storage', 'redundancy', 'moving-data',
    'identity', 'authn-authz', 'conditional-access', 'rbac', 'zero-trust',
    'cost-tags', 'controls', 'policy-governance', 'arm-iac', 'mgmt-tools', 'monitoring'];
  const INIT_Q = 'What are you trying to learn today, and what is your specific goal/use case for this knowledge? (I need this to set the Frame of Relevance.)';
  const GOALS = [
    'Pass the AZ-900 exam, starting from zero',
    'Get ready for a cloud or Azure job interview',
    'Understand Azure for the work I do now'
  ];

  function objText(m) {
    const all = {};
    AZ.OBJECTIVES.forEach(([, , list]) => list.forEach(([id, t]) => (all[id] = t)));
    return m.objectives.map((o) => all[o]).filter(Boolean);
  }
  function rules(t) {
    const mods = PATH.filter((id) => AZ.byId[id]).map((id) => id + ' = ' + (AZ.byId[id].short || AZ.byId[id].title)).join('; ');
    return [
      'You are the guided tutor inside "AZ-900 Visual Lab", an app for the Microsoft AZ-900 Azure Fundamentals exam (skills measured as of July 20, 2026). Use current Microsoft names (Microsoft Entra ID, not Azure AD). Stay at AZ-900 depth; do not drift into AZ-104 configuration detail.',
      '',
      'FRAME OF RELEVANCE: the learner said their goal is: "' + t.goal + '". ' + (t.frame ? 'Agreed frame: ' + t.frame + '. ' : '') + 'Open every lesson by tying the concept to that goal in one sentence.',
      '',
      'VISUAL LOGIC (required in every teaching reply): the app draws infographics for you. Include ONE infographic (two at most) as a fenced block that starts with ```visual and contains ONLY valid JSON in one of these shapes:',
      '  flow (a sequence or cause and effect): {"type":"flow","title":"…","steps":[{"label":"…","note":"…","icon":"…"}]}  (3-6 steps)',
      '  contains (one thing inside another): {"type":"contains","title":"…","outer":{"label":"…","note":"…"},"inner":[{"label":"…","note":"…","icon":"…"}],"footer":"…"}',
      '  compare (look-alikes side by side): {"type":"compare","title":"…","columns":[{"label":"…","icon":"…","points":["…","…"],"bestFor":"…"}]}  (2-3 columns)',
      '  hub (one idea and how others relate to it): {"type":"hub","title":"…","center":{"label":"…","icon":"…"},"spokes":[{"label":"…","relation":"…","note":"…"}]}  (3-6 spokes)',
      '  stack (layers and who manages each): {"type":"stack","title":"…","layers":[{"label":"…","owner":"you|microsoft|shared","note":"…"}]}',
      '  Labels at most 4 words, notes at most 10 words. Pick the shape that shows the RELATIONSHIP. icon must be one of: user, users, server, vm, db, storage, web, vnet, cloud, building, lock, shield, key, fn, container, chart, bell, bulb, pulse, search, tag, terminal, doc, file, folder, globe, gear, policy, dollar, gateway, laptop, phone, mail, queue, table, video, mg, sub, rg, cpu, layers, link, route, heart, star, check, x, warn. Never draw ASCII art.',
      '- Around the infographic, when you use bullets, make each bullet a relationship, not a bare item: "A ──▶ B because …", "A vs B: …", "A contains B", with an indented sub-bullet for the consequence. Never give a flat list of facts.',
      '',
      'FORMAT: short. Use "## " for the step title, **bold** sparingly, and no tables or HTML. To point to a hands-on visual in the app write [[lab:ID]] using an ID from: ' + mods + '.',
      'End each lesson with "**Check:**" and ONE question for the learner, then stop and wait. When the learner answers, say whether it is right, repair any gap with a new small diagram, and if they have it, end with the token [[next]].',
      'If the learner goes off-topic, answer briefly and bring them back to the current step.'
    ].join('\n');
  }
  function stepContext(t, i) {
    const m = AZ.byId[t.plan[i]];
    const why = t.focus && t.focus[m.id] ? ' Why it matters for this learner: ' + t.focus[m.id] : '';
    return 'CURRENT STEP ' + (i + 1) + ' of ' + t.plan.length + ': "' + m.title + '" (lab id ' + m.id + ').' + why +
      '\nExam objectives for this step: ' + objText(m).join('; ') +
      '\nKey rules the app teaches (stay consistent with them): ' + (m.memory || []).map((c) => c.term + ': ' + c.rule).join(' | ') +
      (i > 0 ? '\nAlready covered: ' + t.plan.slice(0, i).map((id) => AZ.byId[id].short).join(', ') + '.' : '');
  }

  /* ---------- safe mini-markdown: headings, bullets, **bold**, `code`, ```text fences, [[lab:id]], [[next]] ---------- */
  function inline(str) {
    const out = [];
    const re = /(\*\*[^*]+\*\*|`[^`]+`|\[\[lab:[a-z0-9-]+\]\]|\[\[next\]\])/g;
    let last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) out.push(str.slice(last, m.index));
      const tok = m[0];
      if (tok.startsWith('**')) out.push(h('strong', null, tok.slice(2, -2)));
      else if (tok.startsWith('`')) out.push(h('code', null, tok.slice(1, -1)));
      else if (tok === '[[next]]') out.push(h('span', { class: 'tu-ready' }, AZ.icon('check'), 'Ready for the next step'));
      else {
        const id = tok.slice(6, -2);
        const mod = AZ.byId[id];
        out.push(mod ? h('a', { class: 'tu-lab', href: '#' + id }, AZ.icon(mod.icon || 'play'), 'Try it: ' + (mod.short || mod.title)) : '');
      }
      last = m.index + tok.length;
    }
    if (last < str.length) out.push(str.slice(last));
    return out;
  }
  /* ---------- infographics drawn from the tutor's ```visual JSON ---------- */
  const OWN = { you: 'You manage', microsoft: 'Microsoft manages', shared: 'Shared' };
  const ic = (name) => (name && AZ.ICONS[name] ? AZ.icon(name) : null);
  const txt = (v, n) => String(v == null ? '' : v).slice(0, n || 80);
  function infographic(spec) {
    if (!spec || typeof spec !== 'object') return null;
    const title = spec.title ? h('div', { class: 'ig-title' }, txt(spec.title, 70)) : null;
    const wrap = (cls, ...kids) => h('figure', { class: 'ig ig--' + cls }, title, ...kids);
    if (spec.type === 'flow' && Array.isArray(spec.steps)) {
      return wrap('flow', h('ol', { class: 'ig-flow' }, spec.steps.slice(0, 7).map((s, i) => h('li', { class: 'ig-step' },
        h('span', { class: 'ig-num' }, String(i + 1)), h('span', { class: 'ig-card' }, ic(s.icon), h('strong', null, txt(s.label, 40)), s.note ? h('span', null, txt(s.note, 90)) : null)))));
    }
    if (spec.type === 'contains' && spec.outer && Array.isArray(spec.inner)) {
      return wrap('contains', h('div', { class: 'ig-outer' },
        h('div', { class: 'ig-outer-h' }, h('strong', null, txt(spec.outer.label, 40)), spec.outer.note ? h('span', null, txt(spec.outer.note, 90)) : null),
        h('div', { class: 'ig-inner' }, spec.inner.slice(0, 6).map((s) => h('div', { class: 'ig-box' }, ic(s.icon), h('strong', null, txt(s.label, 40)), s.note ? h('span', null, txt(s.note, 90)) : null)))),
        spec.footer ? h('figcaption', { class: 'ig-foot' }, txt(spec.footer, 120)) : null);
    }
    if (spec.type === 'compare' && Array.isArray(spec.columns)) {
      return wrap('compare', h('div', { class: 'ig-cols n' + Math.min(3, spec.columns.length) }, spec.columns.slice(0, 3).map((c, i) => h('div', { class: 'ig-col c' + i },
        h('div', { class: 'ig-col-h' }, ic(c.icon), h('strong', null, txt(c.label, 40))),
        h('ul', null, (Array.isArray(c.points) ? c.points : []).slice(0, 4).map((p) => h('li', null, txt(p, 100)))),
        c.bestFor ? h('div', { class: 'ig-best' }, h('span', null, 'Best for'), txt(c.bestFor, 90)) : null))));
    }
    if (spec.type === 'hub' && spec.center && Array.isArray(spec.spokes)) {
      return wrap('hub', h('div', { class: 'ig-hub' },
        h('div', { class: 'ig-center' }, ic(spec.center.icon), h('strong', null, txt(spec.center.label, 40))),
        h('div', { class: 'ig-spokes' }, spec.spokes.slice(0, 6).map((s) => h('div', { class: 'ig-spoke' },
          s.relation ? h('span', { class: 'ig-rel' }, txt(s.relation, 30)) : null, h('strong', null, txt(s.label, 40)), s.note ? h('span', null, txt(s.note, 100)) : null)))));
    }
    if (spec.type === 'stack' && Array.isArray(spec.layers)) {
      return wrap('stack', h('div', { class: 'ig-stack' }, spec.layers.slice(0, 10).map((l) => {
        const o = OWN[l.owner] ? l.owner : 'shared';
        return h('div', { class: 'ig-layer o-' + o }, h('strong', null, txt(l.label, 40)), l.note ? h('span', null, txt(l.note, 80)) : null, h('em', null, OWN[o]));
      })));
    }
    return null;
  }
  function render(text) {
    const box = h('div', { class: 'tu-md' });
    const src = String(text);
    const re = /```([a-zA-Z]*)[ \t]*\n?([\s\S]*?)(```|$)/g;
    let last = 0, m;
    const chunks = [];
    while ((m = re.exec(src))) {
      if (m.index > last) chunks.push({ md: src.slice(last, m.index) });
      chunks.push({ lang: (m[1] || '').toLowerCase(), body: m[2], closed: m[3] === '```' });
      last = m.index + m[0].length;
      if (!m[0].length) break;
    }
    if (last < src.length) chunks.push({ md: src.slice(last) });
    chunks.forEach((c) => {
      if (c.md == null) {
        if (c.lang === 'visual' || c.lang === 'json') {
          let spec = null;
          if (c.closed) { try { spec = JSON.parse(c.body); } catch (e) { spec = null; } }
          const fig = spec && infographic(spec);
          box.append(fig || h('div', { class: 'ig ig-wait' }, AZ.icon('chart'), c.closed ? 'This infographic couldn’t be drawn.' : 'Drawing the infographic…'));
        } else box.append(h('pre', { class: 'tu-diagram' }, c.body.replace(/\n$/, '')));
        return;
      }
      mdInto(box, c.md);
    });
    return box;
  }
  function mdInto(box, part) {
    let list = null, sub = null, para = [];
    const flushP = () => { if (para.length) { box.append(h('p', null, inline(para.join(' ')))); para = []; } };
    const closeL = () => { list = null; sub = null; };
    part.split('\n').forEach((raw) => {
      const line = raw.replace(/\s+$/, '');
      const bm = line.match(/^(\s*)[-*•]\s+(.*)$/);
      if (!line.trim()) { flushP(); closeL(); return; }
      if (/^#{1,4}\s/.test(line)) { flushP(); closeL(); box.append(h('h3', { class: 'tu-h' }, inline(line.replace(/^#+\s*/, '')))); return; }
      if (bm) {
        flushP();
        const deep = bm[1].length >= 2;
        if (!list) { list = h('ul', { class: 'tu-rel' }); box.append(list); }
        const li = h('li', null, inline(bm[2]));
        if (deep && list.lastElementChild) {
          if (!sub || sub.parentNode !== list.lastElementChild) { sub = h('ul', null); list.lastElementChild.append(sub); }
          sub.append(li);
        } else { list.append(li); sub = null; }
        return;
      }
      closeL();
      para.push(line.trim());
    });
    flushP();
  }

  /* offline lesson built from the lab's own rules, still relationship-first */
  function offlineLesson(t, i) {
    const m = AZ.byId[t.plan[i]];
    const cards = m.memory || [];
    const vis = { type: 'hub', title: 'How the ideas connect', center: { label: m.short || m.title, icon: m.icon }, spokes: cards.map((c) => ({ label: c.term, relation: 'key idea', note: c.rule })) };
    return '## Step ' + (i + 1) + ': ' + m.title + '\n' +
      'Why this matters for your goal (' + t.goal + '): ' + m.lede + '\n\n```visual\n' + JSON.stringify(vis) + '\n```\n' +
      cards.map((c) => '- **' + c.term + '** ──▶ ' + c.rule).join('\n') +
      '\n\n[[lab:' + m.id + ']]\n\n**Check:** open the visual, do its exercise, then answer the exam scenarios at the bottom of that page.';
  }

  AZ.tutor = function (view, api) {
    let t = AZ.progress.tutor ? JSON.parse(JSON.stringify(AZ.progress.tutor)) : null;
    let sample = null, sampleState = 'waiting';
    const ready = (async () => {
      try { sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { sample = null; }
      sampleState = sample ? 'on' : 'off';
    })();
    let ctl = null, busy = false;
    const log = h('div', { class: 'tu-log', 'aria-live': 'polite' });
    const status = h('p', { class: 'tu-status', 'aria-live': 'polite' });
    const input = h('textarea', { id: 'tuIn', class: 'txt tu-in', rows: 2, placeholder: 'Type your answer or a question', 'aria-label': 'Message to the tutor' });
    const bSend = AZ.btn('Send', () => send(), { cls: 'primary', icon: 'arrowR' });
    const bStop = AZ.btn('Stop', () => ctl && ctl.abort(), { cls: 'ghost', icon: 'x' });
    bStop.hidden = true;
    const actions = h('div', { class: 'btn-row tu-actions' });
    const pathBox = h('div', { class: 'tu-path' });
    const composer = h('div', { class: 'tu-composer' }, input, h('div', { class: 'btn-row' }, bSend, bStop), status);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

    view.append(
      h('header', { class: 'mod-head' }, h('div', { class: 'eyebrow' }, 'Guided tutor'),
        h('h1', { class: 'mod-title' }, 'Learn it step by step'),
        h('p', { class: 'lede' }, 'The tutor starts from your goal, then walks you through AZ-900 in order. Every explanation is a diagram of how the ideas connect, followed by one check question.')),
      h('div', { class: 'tu-grid' }, h('div', { class: 'tu-main' }, log, actions, composer), h('aside', { class: 'tu-side' }, pathBox)));

    const save = () => { if (t) { t.log = t.log.slice(-60); AZ.progress.setTutor(JSON.parse(JSON.stringify(t))); } };

    function bubble(role, content, opts) {
      const b = h('div', { class: 'tu-msg ' + (role === 'u' ? 'me' : 'tutor') + (opts && opts.pending ? ' pending' : '') },
        role === 'u' ? null : h('div', { class: 'tu-who' }, AZ.icon('bulb'), 'Tutor'),
        typeof content === 'string' ? (role === 'u' ? h('p', null, content) : render(content)) : content);
      log.append(b);
      return b;
    }
    let showAll = false;
    function drawLog() {
      log.replaceChildren();
      const focus = t && t.plan && !showAll;
      if (focus) {
        const earlier = t.log.filter((x) => x.s !== t.step).length;
        if (t.step === 0) { bubble('t', INIT_Q); bubble('u', t.goal); if (t.frame) bubble('t', t.frame); }
        if (t.step > 0 || earlier) log.append(h('button', { type: 'button', class: 'tu-earlier', onClick: () => { showAll = true; drawLog(); jumpTo(t.step, true); } },
          AZ.icon('arrowD'), 'Show earlier conversation' + (earlier ? ' (' + earlier + ' messages)' : ''), h('span', { class: 'tu-earlier-s' }, 'your goal, your path and other steps')));
        log.append(h('div', { class: 'tu-divider', 'data-step': t.step }, 'Step ' + (t.step + 1) + ': ' + (AZ.byId[t.plan[t.step]].short || AZ.byId[t.plan[t.step]].title)));
        t.log.filter((x) => x.s === t.step).forEach((m) => bubble(m.r, m.x));
        return;
      }
      bubble('t', INIT_Q);
      if (!t) return;
      bubble('u', t.goal);
      if (t.frame) bubble('t', t.frame);
      if (showAll && t.plan) log.append(h('button', { type: 'button', class: 'tu-earlier', onClick: () => { showAll = false; drawLog(); resume(); } }, AZ.icon('minus'), 'Show only the current step'));
      let cur = -1;
      t.log.forEach((m) => {
        if (m.s !== cur) { cur = m.s; if (t.plan && t.plan[cur]) log.append(h('div', { class: 'tu-divider', 'data-step': cur }, 'Step ' + (cur + 1) + ': ' + (AZ.byId[t.plan[cur]].short || AZ.byId[t.plan[cur]].title))); }
        bubble(m.r, m.x);
      });
    }
    function drawPath() {
      if (!t || !t.plan) {
        pathBox.replaceChildren(h('div', { class: 'ctl-k' }, 'Your path'), h('p', { class: 'muted small' }, 'Answer the question on the left and the tutor maps a path from where you are to your goal.'));
        return;
      }
      const cur = AZ.byId[t.plan[t.step]];
      const list = h('ol', { class: 'tu-steps' }, t.plan.map((id, i) => {
        const m = AZ.byId[id];
        const b = h('button', { type: 'button', class: 'tu-step' + (i === t.step ? ' at' : i < t.step ? ' done' : ''), 'aria-current': i === t.step ? 'step' : null },
          h('span', { class: 'tu-n' }, i < t.step ? '✓' : String(i + 1)), h('span', null, m.short || m.title));
        b.addEventListener('click', () => { if (busy) return; det.open = window.innerWidth >= 980; if (i === t.step) jumpTo(i); else goStep(i); });
        return h('li', null, b);
      }));
      const det = h('details', { class: 'tu-pathd' },
        h('summary', { class: 'tu-sum' },
          h('span', { class: 'tu-sum-t' }, h('span', { class: 'ctl-k' }, 'Your path · step ' + (t.step + 1) + ' of ' + t.plan.length), h('strong', null, cur.short || cur.title)),
          h('span', { class: 'tu-sum-more' }, 'Pick a step', AZ.icon('arrowD'))),
        list,
        AZ.btn('Start over with a new goal', () => { if (busy) return; t = null; AZ.progress.setTutor(null); drawAll(); }, { cls: 'ghost small', icon: 'reset' }));
      det.open = window.innerWidth >= 980 || pathOpen;
      det.addEventListener('toggle', () => { pathOpen = det.open && window.innerWidth < 980; if (det.open) centerCurrent(list); });
      pathBox.replaceChildren(det);
      if (det.open) requestAnimationFrame(() => centerCurrent(list));
    }
    let pathOpen = false;
    function centerCurrent(list) {
      const at = list.querySelector('.at');
      if (at) list.scrollTop = Math.max(0, at.offsetTop - list.clientHeight / 2 + at.offsetHeight / 2);
    }
    function jumpTo(i, instant) {
      const d = log.querySelector('[data-step="' + i + '"]');
      const target = d || log.lastElementChild;
      if (target) target.scrollIntoView({ behavior: AZ.reduced || instant ? 'auto' : 'smooth', block: 'start' });
    }
    // land where the learner left off: the latest tutor message of the current step
    function resume() {
      if (!t || !t.plan) return;
      const mine = log.querySelectorAll('.tu-msg.me');
      const stepMsgs = t.log.filter((x) => x.s === t.step);
      // with a back-and-forth, open on your last answer and the tutor's reply; otherwise on the step's start
      const target = stepMsgs.length > 2 && mine.length ? mine[mine.length - 1] : log.querySelector('[data-step="' + t.step + '"]');
      if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: 'auto', block: 'start' }));
    }
    function drawActions() {
      actions.replaceChildren();
      if (!t) {
        actions.append(...GOALS.map((g) => AZ.btn(g, () => { input.value = g; send(); }, { cls: 'ghost small tu-chip' })));
        input.placeholder = 'Or type your goal in your own words';
        return;
      }
      input.placeholder = 'Type your answer or a question';
      if (!t.plan) return;
      const m = AZ.byId[t.plan[t.step]];
      const started = t.log.some((x) => x.s === t.step);
      if (!started) actions.append(AZ.btn('Start step ' + (t.step + 1) + ': ' + (m.short || m.title), () => teach(), { cls: 'primary', icon: 'play' }));
      else {
        if (t.step < t.plan.length - 1) actions.append(AZ.btn('Next step', () => goStep(t.step + 1), { cls: 'primary', icon: 'arrowR' }));
        actions.append(AZ.btn('Explain it another way', () => send('Explain this step another way, with a different diagram.'), { cls: 'ghost', icon: 'reset' }),
          AZ.btn('Quiz me', () => send('Quiz me on this step with one exam-style scenario. Wait for my answer.'), { cls: 'ghost', icon: 'star' }),
          h('a', { class: 'btn ghost', href: '#' + m.id }, AZ.icon(m.icon || 'play'), h('span', null, 'Open the visual')));
      }
    }
    function drawAll() { drawLog(); drawPath(); drawActions(); setBusy(false); }
    function setBusy(v, msg) {
      busy = v;
      bSend.disabled = v; input.disabled = v; bStop.hidden = !v;
      actions.querySelectorAll('.btn').forEach((b) => (b.disabled = v));
      status.textContent = msg || (sampleState === 'off' ? 'The live tutor isn’t available here, so lessons come from the lab’s own notes.' : '');
    }
    const ERR = {
      rate_limited: 'You’ve hit your Claude usage limit for now. Try again in a little while.',
      session_expired: 'Your Claude session expired. Sign in to Claude again, then retry.',
      refused: 'The tutor couldn’t answer that. Try asking it differently.',
      prompt_too_large: 'This conversation got too long. Tap “Next step” or start over.',
      upstream_error: 'The tutor had a hiccup. Send again.'
    };
    function failCode(e) {
      const c = (e && e.code) || 'upstream_error';
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { sampleState = 'off'; return null; }
      return ERR[c] || ERR.upstream_error;
    }
    async function ask(turns, pendingEl, json) {
      ctl = new AbortController();
      const opts = { signal: ctl.signal, cache: false, modelTier: 'default', onText: ({ text }) => { if (pendingEl) { pendingEl.classList.remove('pending'); pendingEl.lastChild.replaceWith(render(text)); } } };
      return json ? sample.json(turns, opts) : sample(turns, opts);
    }

    async function send(preset) {
      if (busy) return;
      const text = (preset || input.value).trim();
      if (!text) { input.focus(); return; }
      input.value = '';
      if (!t) return setGoal(text);
      if (!t.plan) return;
      const step = t.step;
      if (!t.log.some((x) => x.s === step)) { await teach(); }
      if (sampleState === 'off') {
        bubble('u', text);
        bubble('t', 'The live tutor isn’t available in this view, so I can’t answer free-form questions here. Open the visual for this step and try its exam scenarios — they explain every answer.');
        return;
      }
      t.log.push({ r: 'u', x: text, s: step });
      bubble('u', text);
      const pend = bubble('t', 'Thinking…', { pending: true });
      setBusy(true, 'Thinking… this can take up to a minute.');
      try {
        const res = await ask(turnsFor(step), pend);
        t.log.push({ r: 't', x: res.text, s: step });
        pend.lastChild.replaceWith(render(res.text));
        pend.classList.remove('pending');
        save();
      } catch (e) {
        t.log.pop();
        if (e && e.code === 'cancelled') { pend.remove(); input.value = text; setBusy(false); drawActions(); return; }
        const msg = failCode(e);
        pend.remove();
        input.value = text;
        setBusy(false, msg || 'The live tutor isn’t available here, so lessons come from the lab’s own notes.');
        drawActions();
        return;
      }
      setBusy(false);
      drawActions();
      pend.scrollIntoView({ block: 'nearest' });
    }
    function turnsFor(step) {
      const head = rules(t) + '\n\n' + stepContext(t, step) + '\n\nTeach this step now.';
      const turns = [{ role: 'user', content: head }];
      t.log.filter((x) => x.s === step).slice(-12).forEach((x) => turns.push({ role: x.r === 'u' ? 'user' : 'assistant', content: x.x }));
      if (turns[turns.length - 1].role !== 'user') turns.push({ role: 'user', content: 'Continue.' });
      // keep strict alternation
      const out = [];
      turns.forEach((x) => { if (out.length && out[out.length - 1].role === x.role) out[out.length - 1].content += '\n\n' + x.content; else out.push({ ...x }); });
      return out;
    }

    async function setGoal(goal) {
      t = { goal, frame: '', plan: null, focus: {}, step: 0, log: [] };
      drawLog();
      drawActions();
      const pend = bubble('t', 'Setting your Frame of Relevance…', { pending: true });
      setBusy(true, 'Getting ready…');
      await ready;
      if (sample) {
        setBusy(true, 'Mapping your path… this can take up to a minute.');
        const ids = PATH.filter((id) => AZ.byId[id]);
        const prompt = 'You are planning an AZ-900 (Microsoft Azure Fundamentals) study path for a learner inside a visual lab app.\n' +
          'Learner\'s goal / use case: "' + goal + '"\n\n' +
          'Available lessons, in teaching order from the start: ' + ids.map((id) => id + ' (' + AZ.byId[id].short + ')').join(', ') + '.\n\n' +
          'Reply with only JSON: {"frame": string, "plan": [lesson ids], "focus": {lesson id: string}}.\n' +
          '- frame: 2-4 short lines in markdown. Restate the goal as a Frame of Relevance, then ONE infographic as a ```visual fence holding JSON {"type":"flow","title":"…","steps":[{"label":"…","note":"…","icon":"…"}]} that shows how AZ-900\'s three domains lead to the goal (4-5 steps, labels at most 4 words, icons from: cloud, layers, policy, star, check, globe, shield, chart).\n' +
          '- plan: lesson ids in teaching order. Always guide from the start: keep the foundations first. If the goal is passing the exam, include every lesson. If narrower, include what the goal needs plus any foundations it depends on (at least 6).\n' +
          '- focus: for each planned id, one short sentence on why it matters for this goal.';
        try {
          const r = await ask(prompt, null, true);
          const plan = Array.isArray(r && r.plan) ? r.plan.filter((id, i, a) => ids.includes(id) && a.indexOf(id) === i) : [];
          t.plan = plan.length >= 3 ? plan : ids;
          t.frame = typeof r.frame === 'string' && r.frame.trim() ? r.frame : '';
          t.focus = r && typeof r.focus === 'object' && r.focus ? r.focus : {};
        } catch (e) {
          if (e && e.code === 'cancelled') { t = null; drawAll(); return; }
          const msg = failCode(e);
          if (msg) status.textContent = msg;
        }
      }
      if (!t.plan) t.plan = PATH.filter((id) => AZ.byId[id]);
      if (!t.frame) {
        t.frame = '## Your Frame of Relevance\nGoal: **' + goal + '**. We start at the foundations and build up, so each step leans on the one before.\n\n```visual\n' + JSON.stringify({ type: 'flow', title: 'From foundations to your goal', steps: [{ label: 'Cloud concepts', note: 'why the cloud and how you pay', icon: 'cloud' }, { label: 'Architecture & services', note: 'what Azure is built from', icon: 'layers' }, { label: 'Management & governance', note: 'how to run it safely', icon: 'policy' }, { label: 'Your goal', note: goal.slice(0, 60), icon: 'star' }] }) + '\n```';
      }
      pend.remove();
      save();
      drawAll();
      teach();
    }

    async function teach() {
      const step = t.step;
      const m = AZ.byId[t.plan[step]];
      if (sampleState === 'waiting') { setBusy(true, 'Getting ready…'); await ready; setBusy(false); }
      if (!sample || sampleState === 'off') {
        const x = offlineLesson(t, step);
        t.log.push({ r: 't', x, s: step });
        bubble('t', x);
        save();
        drawActions();
        jumpTo(step);
        return;
      }
      const pend = bubble('t', 'Preparing step ' + (step + 1) + ': ' + (m.short || m.title) + '…', { pending: true });
      pend.scrollIntoView({ behavior: AZ.reduced ? 'auto' : 'smooth', block: 'center' });
      let jumped = false;
      const onFirst = () => { if (!jumped && pend.querySelector('.tu-md') && pend.offsetHeight > 240) { jumped = true; jumpTo(step); } };
      const mo = new MutationObserver(onFirst);
      mo.observe(pend, { childList: true, subtree: true });
      api.onCleanup(() => mo.disconnect());
      setBusy(true, 'Thinking… this can take up to a minute.');
      try {
        const res = await ask(turnsFor(step), pend);
        t.log.push({ r: 't', x: res.text, s: step });
        pend.lastChild.replaceWith(render(res.text));
        pend.classList.remove('pending');
        save();
        mo.disconnect();
        if (!jumped) jumpTo(step);
      } catch (e) {
        mo.disconnect();
        pend.remove();
        if (!(e && e.code === 'cancelled')) {
          const msg = failCode(e);
          if (!msg) { setBusy(false); return teach(); }
          setBusy(false, msg);
          drawActions();
          return;
        }
      }
      setBusy(false);
      drawActions();
    }
    function goStep(i) {
      t.step = i;
      save();
      pathOpen = false;
      showAll = false;
      drawPath();
      drawActions();
      drawLog();
      jumpTo(i);
      if (!t.log.some((x) => x.s === i)) teach();
    }

    drawAll();
    resume();
    // the live tutor lights up when this view can ask Claude
    ready.then(() => { if (api.alive && !busy) setBusy(false); });
    api.onCleanup(() => { if (ctl) ctl.abort(); });
  };
})();

</script>
<script>/* main.js */
/* AZ-900 Visual Lab — app shell: top navigation, search/menu overlay, routing,
   storefront home, module catalog, progress report, memory cards and objective coverage. */
(function () {
  'use strict';
  const { h } = AZ;
  const view = document.getElementById('view');
  const sheet = document.getElementById('sheet');
  const tnav = document.getElementById('tnav');
  const topProg = document.getElementById('topProg');
  const acctBtn = document.getElementById('acctBtn');
  const searchBtn = document.getElementById('searchBtn');
  const finder = document.getElementById('finder');
  let cleanup = [];
  let firstRoute = true;

  AZ.PRIORITY = ['hierarchy', 'service-models', 'shared-resp', 'global-infra', 'scaling', 'networking', 'redundancy', 'authn-authz', 'controls', 'monitoring'];

  function order() {
    const pri = AZ.PRIORITY.filter((id) => AZ.byId[id]).map((id) => AZ.byId[id]);
    const rest = AZ.modules.filter((m) => !AZ.PRIORITY.includes(m.id));
    const dom = ['cloud', 'arch', 'gov'];
    rest.sort((a, b) => dom.indexOf(a.domain) - dom.indexOf(b.domain) || a.num - b.num);
    return { pri, rest, all: pri.concat(rest) };
  }
  function status(id) {
    const S = AZ.progress.state;
    return S.done[id] ? 'done' : S.visited[id] ? 'seen' : 'new';
  }
  const STATUS_TEXT = { done: 'Explored', seen: 'Started', new: 'Not started' };
  const DCOL = { cloud: 'var(--d-cloud)', arch: 'var(--d-arch)', gov: 'var(--d-gov)' };
  const DW = { cloud: 27.5, arch: 37.5, gov: 32.5 };
  const DSHORT = { cloud: 'Cloud concepts', arch: 'Architecture & services', gov: 'Management & governance' };
  const DABBR = { cloud: 'Cloud', arch: 'Architecture', gov: 'Governance' };
  const pad = (n, w) => String(n).padStart(w || 2, '0');
  const modNo = (m) => pad(order().all.indexOf(m) + 1);

  /* ---------------- top navigation ---------------- */
  const TNAV = [['learn', 'Modules'], ['tutor', 'Tutor'], ['mixups', 'Mix-ups'], ['cards', 'Cards'], ['progress', 'Progress']];
  function buildNav() {
    const u = AZ.account.user;
    tnav.hidden = !u;
    tnav.replaceChildren(...TNAV.filter(([id]) => id !== 'tutor' || AZ.tutor).filter(([id]) => id !== 'mixups' || AZ.mixups)
      .map(([id, l]) => h('a', { href: '#' + id, class: 'tl', 'data-id': id }, l)));
    markNav();
    const done = Object.keys(AZ.progress.state.done).filter((id) => AZ.byId[id]).length;
    topProg.hidden = !u;
    topProg.replaceChildren(h('span', { class: 'hide-sm' }, 'Explored '), '[' + done + '/' + AZ.modules.length + ']');
    topProg.setAttribute('aria-label', done + ' of ' + AZ.modules.length + ' modules explored. Open your progress report');
    searchBtn.hidden = !u;
    acctBtn.hidden = !u;
    if (u) acctBtn.replaceChildren(h('span', { class: 'acct-av', 'aria-hidden': 'true' }, u.name.charAt(0).toUpperCase()), h('span', { class: 'acct-n' }, u.name));
    acctBtn.setAttribute('aria-label', u ? 'Signed in as ' + u.name + '. Open your profile' : 'Profile');
  }
  function navId() {
    const f = currentId().split('.')[0];
    if (f.startsWith('mix-')) return 'mixups';
    if (AZ.byId[f]) return 'learn';
    return f;
  }
  function markNav() {
    const id = navId();
    tnav.querySelectorAll('.tl').forEach((a) => {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    const cur = tnav.querySelector('[aria-current]');
    if (cur && tnav.scrollWidth > tnav.clientWidth) tnav.scrollLeft = cur.offsetLeft - 12;
  }

  /* ---------------- search / menu overlay ---------------- */
  let index = null, fdView = 'root', fdQuery = '', fdLast = null;
  function buildIndex() {
    const idx = [];
    const add = (type, t, w, href, extra) => idx.push({ type, t, w: w || '', href, k: (t + ' ' + (w || '') + ' ' + (extra || '')).toLowerCase() });
    [['Home', '#home', 'storefront start'], ['All modules', '#learn', 'catalog map list'], ['Guided tutor', '#tutor', 'learn from the start step by step'],
      ['Progress report', '#progress', 'readiness dashboard stats review'], ["Don't mix these up", '#mixups', 'confusion lab pairs'],
      ['Memory cards', '#cards', 'flashcards rules'], ['Exam objective coverage', '#objectives', 'study guide audit skills measured'], ['Your profile', '#account', 'progress code device sign out']]
      .forEach(([t, href, x]) => add('Page', t, '', href, x));
    const OBJ2 = {};
    order().all.forEach((m) => {
      add('Module', m.title, DSHORT[m.domain], '#' + m.id, (m.short || '') + ' ' + (m.lede || ''));
      (m.memory || []).forEach((c) => add('Concept', c.term, c.rule, '#' + m.id, m.title));
      (m.exams || []).forEach((x) => add('Scenario', x.short || x.prompt, m.short || m.title, '#' + m.id + '.' + x.id, x.prompt));
      m.objectives.forEach((o) => { if (!OBJ2[o]) OBJ2[o] = m; });
    });
    Object.entries(AZ.PAIRS || {}).forEach(([id, l]) => add('Mix-up', l, "Don't mix these up", '#mix-' + id));
    Object.entries(OBJ).forEach(([id, o]) => { if (OBJ2[id]) add('Objective', o.t, o.grp, '#' + OBJ2[id].id); });
    return idx;
  }
  const TYPE_RANK = { Page: 0, Module: 1, Concept: 2, 'Mix-up': 3, Scenario: 4, Objective: 5 };
  function search(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    const ql = q.toLowerCase().trim();
    return index.filter((r) => words.every((w) => r.k.includes(w)))
      .map((r) => ({ r, s: (r.t.toLowerCase().startsWith(ql) ? 4 : r.t.toLowerCase().includes(ql) ? 2 : 0) + (words.every((w) => r.t.toLowerCase().includes(w)) ? 1 : 0) }))
      .sort((a, b) => b.s - a.s || TYPE_RANK[a.r.type] - TYPE_RANK[b.r.type])
      .slice(0, 40).map((x) => x.r);
  }
  const corner = () => h('i', { class: 'fd-mk', 'aria-hidden': 'true' });
  function fdTile(ic, label, onClick, sub) {
    const b = h('button', { type: 'button', class: 'fd-tile' }, corner(), h('span', { class: 'fd-tile-ic' }, AZ.icon(ic)), h('span', { class: 'fd-tile-l' }, label), sub ? h('span', { class: 'fd-tile-s' }, sub) : null);
    b.addEventListener('click', onClick);
    return b;
  }
  const go = (href) => { closeFinder(); if (location.hash === href) route(); else location.hash = href; };
  function fdRow(type, t, w, href, st) {
    return h('a', { class: 'fd-row', href, onClick: (e) => { e.preventDefault(); go(href); } },
      h('span', { class: 'fd-type' }, type), h('span', { class: 'fd-rt' }, t, w ? h('span', { class: 'fd-rw' }, w) : null),
      st ? h('span', { class: 'fd-st st-' + st }, STATUS_TEXT[st]) : AZ.icon('arrowR'));
  }
  function drawFinder() {
    const body = finder.querySelector('.fd-body');
    if (fdQuery.trim()) {
      const res = search(fdQuery);
      body.replaceChildren(h('div', { class: 'fd-k' }, res.length + ' result' + (res.length === 1 ? '' : 's')),
        res.length ? h('div', { class: 'fd-rows' }, res.map((r) => fdRow(r.type, r.t, r.w, r.href))) : h('p', { class: 'fd-empty' }, 'Nothing matches “' + fdQuery.trim() + '”. Try a service name like “Blob” or a term like “elasticity”.'));
      return;
    }
    const { pri, all } = order();
    if (fdView !== 'root') {
      const list = fdView === 'pri' ? pri : all.filter((m) => m.domain === fdView);
      const title = fdView === 'pri' ? 'Most tested' : AZ.DOMAINS[fdView].name;
      const back = h('button', { type: 'button', class: 'fd-backbtn' }, AZ.icon('arrowR', 'flipx'), 'Categories');
      back.addEventListener('click', () => { fdView = 'root'; drawFinder(); finder.querySelector('.fd-tile, .fd-backbtn').focus(); });
      body.replaceChildren(h('div', { class: 'fd-head' }, back, h('span', { class: 'fd-k' }, title + (fdView !== 'pri' ? ' · ' + AZ.DOMAINS[fdView].weight : ''))),
        h('div', { class: 'fd-rows' }, list.map((m) => fdRow(modNo(m), m.title, DSHORT[m.domain], '#' + m.id, status(m.id)))));
      return;
    }
    const drill = (v) => () => { fdView = v; drawFinder(); const b = finder.querySelector('.fd-backbtn'); if (b) b.focus(); };
    const st = stats();
    const overall = Math.round(['cloud', 'arch', 'gov'].reduce((a, d) => a + st.per[d].readiness * DW[d], 0) / 97.5);
    const tu = AZ.progress.tutor;
    const u = AZ.account.user;
    body.replaceChildren(
      h('div', { class: 'fd-k' }, 'Categories'),
      h('div', { class: 'fd-grid' },
        fdTile('cloud', 'Cloud concepts', drill('cloud'), AZ.DOMAINS.cloud.weight),
        fdTile('rack', 'Architecture', drill('arch'), AZ.DOMAINS.arch.weight),
        fdTile('policy', 'Governance', drill('gov'), AZ.DOMAINS.gov.weight),
        fdTile('star', 'Most tested', drill('pri'), pri.length + ' modules'),
        AZ.mixups ? fdTile('layers', 'Mix-ups', () => go('#mixups'), 'Confusion lab') : null,
        fdTile('bulb', 'Memory cards', () => go('#cards'), 'Flip & recall')),

  /* ---------------- progress math ---------------- */
  function stats() {
    const S = AZ.progress.state;
    const per = {};

    AZ.modules.forEach((m) => {

        const dm = x.domain || m.domain;

    const concepts = Object.entries(S.concepts).map(([id, c]) => ({ id, ...c, st: AZ.progress.status(c) }));
    concepts.forEach((c) => {

      if (!p) return;
      if (c.st === 'understood') p.und++; else if (c.st === 'missed') p.miss++; else p.rev++;
    });
    Object.values(per).forEach((p) => {
      const tried = p.und + p.miss + p.rev;
      const cov = p.mods ? p.done / p.mods : 0;
      const examScore = p.exams ? p.examFirst / p.exams : 0;
      const conceptScore = tried ? p.und / tried : 0;
      p.cov = cov;
      p.readiness = Math.round(100 * (0.5 * examScore + 0.3 * conceptScore * cov + 0.2 * cov));

    });
    const pairsMissed = new Set();
    concepts.forEach((c) => { if (c.pair && c.st !== 'understood') pairsMissed.add(c.pair); });
    Object.values(S.exam).forEach((e) => { if (e.pair && !e.last) pairsMissed.add(e.pair); });
    const attempted = ['cloud', 'arch', 'gov'].filter((d) => per[d].und + per[d].miss + per[d].rev + per[d].examTried > 0);
    let weakest = null;
    if (attempted.length) {
      weakest = ['cloud', 'arch', 'gov'].slice().sort((a, b) => per[a].readiness - per[b].readiness)[0];

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!inp.value.trim()) { msg.className = 'form-msg bad'; msg.textContent = 'Type a name to start.'; inp.focus(); return; }
      AZ.account.signIn(inp.value);
    });
    const SW = window.innerWidth >= 700 ? 180 : 120, SH = 40;
    view.replaceChildren(h('section', { class: 'si' },
      h('div', { class: 'mono-row' }, h('span', null, 'AZ-900 Visual Lab'), h('span', null, 'No password'), h('span', null, 'Saved on this device')),
      h('h1', { class: 'home-title' }, 'Who’s studying?'),
      h('div', { class: 'si-art' }, AZ.dither({ w: SW, h: SH, palette: AZ.PAL.ember, field: AZ.heroField(SW, SH, 4.2), animate: true, fps: 10, cls: 'sf-cv' })),
      list.length ? h('div', { class: 'ctl' }, h('span', { class: 'ctl-k' }, 'On this device'),
        h('div', { class: 'si-list' }, list.map((p) => h('button', { type: 'button', class: 'si-user', onClick: () => AZ.account.signIn(p.name) },
          h('span', { class: 'acct-av' }, p.name.charAt(0).toUpperCase()), h('span', null, p.name))))) : null,
      h('div', { class: 'si-card' }, h('h2', { class: 'part-k' }, list.length ? 'Or add a name' : 'Type your name to begin'), form),
      h('details', { class: 'si-card si-code' }, h('summary', null, 'Continuing from another device? Use a progress code'),
        h('p', { class: 'muted small' }, 'On your other device, open your profile and copy your progress code. Paste it here to pick up where you left off.'),
        codeBox()),
      AZ.account.storageOk ? null : h('p', { class: 'form-msg bad' }, 'This browser isn’t letting the lab save data (a private window, perhaps). Copy your progress code before you close it.')));
    setTimeout(() => inp.focus(), 50);
  }
  function renderAccount() {
    const u = AZ.account.user;
    const st = stats();
    const codeOut = h('textarea', { id: 'codeOut', class: 'txt code-ta', rows: 4, readonly: true, 'aria-label': 'Your progress code' });
    const copyMsg = h('p', { class: 'form-msg', 'aria-live': 'polite' });
    const bCopy = AZ.btn('Copy code', async () => {
      try { await navigator.clipboard.writeText(codeOut.value); copyMsg.className = 'form-msg ok'; copyMsg.textContent = 'Copied. Paste it into the lab on your other device.'; }
      catch (e) { codeOut.focus(); codeOut.select(); copyMsg.className = 'form-msg'; copyMsg.textContent = 'Selected. Copy it with your device’s copy command.'; }
    }, { icon: 'doc', cls: 'primary' });
    AZ.account.exportCode().then((c) => { codeOut.value = c; });
    const removeWrap = h('div', { class: 'reset-wrap' });
    const bRemove = AZ.btn('Remove ' + u.name + ' from this device', () => {
      removeWrap.replaceChildren(h('span', null, 'Delete ' + u.name + '’s progress on this device? Copy the code first if you want to keep it.'),
        AZ.btn('Delete', () => AZ.account.remove(u.slug), { cls: 'danger' }),
        AZ.btn('Keep', () => removeWrap.replaceChildren(bRemove), { cls: 'ghost' }));
    }, { cls: 'ghost small', icon: 'trash' });
    removeWrap.append(bRemove);
    view.replaceChildren(
      h('header', { class: 'mod-head' }, h('div', { class: 'eyebrow' }, 'Your profile'),
        h('h1', { class: 'mod-title acct-title' }, h('span', { class: 'acct-av lg' }, u.name.charAt(0).toUpperCase()), u.name),
        h('p', { class: 'lede' }, st.done + ' of ' + AZ.modules.length + ' visualizations explored · ' + st.exFirst + ' of ' + st.exAll + ' exam scenarios right first try.')),
      h('section', { class: 'si-card' }, h('h2', { class: 'part-k' }, 'Move your progress to another device'),
        h('p', { class: 'muted small' }, 'Progress is saved on this device under your name. To continue on a phone or another computer, copy this code, open the lab there, and paste it under “Use a progress code”. Make a fresh code whenever you want to sync again.'),
        codeOut, h('div', { class: 'btn-row' }, bCopy), copyMsg),
      h('details', { class: 'si-card si-code' }, h('summary', null, 'Load a code into ' + u.name),
        h('p', { class: 'muted small' }, 'This replaces ' + u.name + '’s progress on this device with the progress in the code.'),
        codeBox(() => setTimeout(route, 900))),
      h('section', { class: 'si-card' }, h('h2', { class: 'part-k' }, 'Switch person'),
        h('div', { class: 'btn-row' }, AZ.btn('Sign out and pick another name', () => AZ.account.signOut(), { icon: 'user', cls: 'ghost' })),
        removeWrap));
  }

  /* ---------------- memory card gallery ---------------- */
  function renderCards() {
    let filter = 'all';
    const grid = h('div', { class: 'flip-grid' });
    const cards = [];
    AZ.modules.forEach((m) => (m.memory || []).forEach((c) => cards.push({ ...c, m })));
    (AZ.extraMemory || []).forEach((c) => cards.push(c));
    function draw() {
      grid.replaceChildren(...cards.filter((c) => filter === 'all' || (c.m && c.m.domain === filter)).map((c) => {
        const b = h('button', { type: 'button', class: 'flip', 'aria-pressed': 'false', 'aria-label': c.term + '. Tap to reveal the rule.' },
          h('span', { class: 'flip-in' },
            h('span', { class: 'flip-f' }, AZ.icon(c.icon || 'bulb'), h('span', { class: 'flip-term' }, c.term), h('span', { class: 'flip-hint' }, 'Tap to reveal')),
            h('span', { class: 'flip-b' }, h('span', { class: 'flip-term sm' }, c.term), h('span', { class: 'flip-rule' }, c.rule),
              c.m ? h('span', { class: 'flip-src' }, c.m.short || c.m.title) : null)));
        b.addEventListener('click', () => {
          const on = b.getAttribute('aria-pressed') !== 'true';
          b.setAttribute('aria-pressed', String(on));
          b.setAttribute('aria-label', on ? c.term + ': ' + c.rule : c.term + '. Tap to reveal the rule.');
        });
        return b;
      }));
    }
    const seg = AZ.seg({ label: 'Filter by domain', value: 'all', options: [
      { id: 'all', label: 'All' }, { id: 'cloud', label: 'Cloud concepts' }, { id: 'arch', label: 'Architecture' }, { id: 'gov', label: 'Governance' }],
      onChange: (v) => { filter = v; draw(); } });
    view.replaceChildren(
      h('header', { class: 'mod-head' }, h('div', { class: 'eyebrow' }, 'Memory mode'), h('h1', { class: 'mod-title' }, 'Memory cards'),
        h('p', { class: 'lede' }, 'Say the rule out loud, then flip the card to check. ' + cards.length + ' rules from every module.')),
      h('div', { class: 'ctl-row' }, seg,
        AZ.btn('Shuffle', () => { AZ.shuffle(cards); draw(); }, { cls: 'ghost', icon: 'reset' }),
        AZ.btn('Flip all', () => {
          const bs = grid.querySelectorAll('.flip');
          const on = [...bs].some((b) => b.getAttribute('aria-pressed') !== 'true');
          bs.forEach((b) => b.setAttribute('aria-pressed', String(on)));
        }, { cls: 'ghost', icon: 'layers' })),
      grid);
    draw();
  }

  /* ---------------- objective coverage ---------------- */
  function renderObjectives() {
    const map = {};
    AZ.modules.forEach((m) => m.objectives.forEach((o) => (map[o] = map[o] || []).push(m)));
    (AZ.mixupObjectives || []).forEach((o) => (map[o] = map[o] || []).push({ id: 'mixups', short: "Don't mix these up" }));
    let total = 0, covered = 0;
    const secs = AZ.OBJECTIVES.map(([d, grp, list]) => h('section', { class: 'obj-sec' },
      h('h2', { class: 'obj-h' }, h('span', { class: 'dom-dot d-' + d, 'aria-hidden': 'true' }), grp),
      h('ul', { class: 'obj-list' }, list.map(([id, t]) => {
        total++;
        const ms = map[id] || [];
        if (ms.length) covered++;
        return h('li', { class: 'obj ' + (ms.length ? 'ok' : 'todo') },
          AZ.icon(ms.length ? 'check' : 'warn'),
          h('span', { class: 'obj-t' }, t),
          h('span', { class: 'obj-m' }, ms.length ? ms.map((m) => h('a', { href: '#' + m.id, class: 'obj-link' }, m.short || m.title)) : 'No visual yet'));
      }))));
    view.replaceChildren(
      h('header', { class: 'mod-head' }, h('div', { class: 'eyebrow' }, 'Audit against the official study guide'),
        h('h1', { class: 'mod-title' }, 'Exam objective coverage'),
        h('p', { class: 'lede' }, covered + ' of ' + total + ' objectives map to at least one visualization, simulation or visual scenario. Source: Microsoft Learn, AZ-900 study guide, skills measured as of July 20, 2026.'),
        h('p', null, h('a', { href: 'https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900', target: '_blank', rel: 'noopener' }, 'Open the official AZ-900 study guide'))),
      ...secs);
  }

  AZ.on('progress', buildNav);
  AZ.on('account', () => { buildNav(); route(); });
  buildNav();
  route();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
